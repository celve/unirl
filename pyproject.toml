[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unirl"
dynamic = ["version"]
description = "Unified multimodal RL training framework"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "unirl contributors" }
]
dependencies = [
  "numpy>=1.24,<3",
  "torch>=2.1",
  "ray[default]>=2.9,<3",
  "sglang[diffusion] @ git+https://github.com/celve/sglang.git@diffusionrl#subdirectory=python",
  "diffusers>=0.30",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "transformers>=4.41",
  "peft>=0.11",
  "safetensors>=0.4",
  "Pillow>=10",
  "requests>=2.31",
  "psutil>=5.9",
  "tensordict>=0.5",
]

[project.optional-dependencies]
train = [
  "wandb>=0.16,<0.20",
  "aiohttp>=3.9",
]
infer = [
  "accelerate>=0.30",
]
eval = [
  "torchvision>=0.16",
  "easyocr>=1.7",
]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.6",
  "pre-commit>=3.6",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "unirl.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = [
  "unirl",
  "unirl.*",
]

[tool.ruff]
line-length = 120
target-version = "py312"
# unirl-reward-service/ is a vendored standalone sub-project with its own pyproject and
# lint/test tooling; it is not governed by this repo's lint (mirrors its
# exclusion from this repo's pytest). Its vendored upstream model code carries
# semantically-meaningful trailing whitespace (VideoAlign prompt templates) that
# must not be auto-stripped.
extend-exclude = ["unirl-reward-service"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["unirl"]

[tool.ruff.format]
quote-style = "double"
