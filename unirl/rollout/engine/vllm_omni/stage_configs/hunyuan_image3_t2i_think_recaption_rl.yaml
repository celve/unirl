# RL-aware stage config for HI3-Instruct think_recaption mode.
# Based on hunyuan_image3_t2i_rl.yaml with key differences:
#
#   Stage 0 (AR):
#     - is_comprehension: false  (let AR generate think/recaption, not just image directive)
#     - kv_transfer_criteria: special_token + token_id: 128000  (wait for <boi> before KV transfer)
#     - max_tokens: 4096  (think_recaption output is longer than plain t2i)
#     - repetition_penalty: 1.1  (match upstream Instruct defaults)
#
#   Stage 1 (DiT): unchanged from t2i_rl.yaml

stage_args:
  - stage_id: 0
    stage_type: llm
    runtime:
      process: true
      devices: "0,1,2,3"
    engine_args:
      model_stage: AR
      max_num_seqs: 1
      model_arch: HunyuanImage3ForCausalMM
      worker_cls: vllm_omni.worker.gpu_ar_worker.GPUARWorker
      scheduler_cls: vllm_omni.core.sched.omni_ar_scheduler.OmniARScheduler
      worker_extension_cls: unirl.rollout.engine.vllm_omni.weight_sync.ar_extension.HI3ARWeightSyncExtension
      enable_lora: true
      gpu_memory_utilization: 0.9
      enforce_eager: true
      trust_remote_code: true
      engine_output_type: latent
      enable_prefix_caching: false
      max_num_batched_tokens: 32768
      tensor_parallel_size: 4
      pipeline_parallel_size: 1
      distributed_executor_backend: "mp"
      hf_overrides:
        rope_parameters:
          mrope_section: [0, 32, 32]
          rope_type: default
      omni_kv_config:
        need_send_cache: true
        kv_transfer_criteria:
          # Wait for <boi> token before transferring KV to DiT stage.
          # In think_recaption mode, AR generates <think>...</think>
          # <recaption>...</recaption><answer><boi><img_ratio><img_size>
          # and we need the full sequence before DiT starts.
          type: special_token
          token_id: 128000
    # is_comprehension: false lets the AR stage generate think/recaption
    # tokens. When true, AR only generates image-directive tokens.
    is_comprehension: false
    final_output: true
    final_output_type: text
    default_sampling_params:
      temperature: 0.7
      top_p: 0.95
      top_k: 1024
      max_tokens: 4096
      seed: 42
      detokenize: True
      repetition_penalty: 1.1

  - stage_id: 1
    stage_type: diffusion
    runtime:
      process: true
      devices: "4,5,6,7"
      max_batch_size: 1
    engine_args:
      model_stage: diffusion
      enforce_eager: true
      distributed_executor_backend: "mp"
      vae_use_slicing: false
      vae_use_tiling: false
      cache_backend: null
      cache_config: null
      enable_cache_dit_summary: false
      omni_kv_config:
        need_recv_cache: true
      parallel_config:
        pipeline_parallel_size: 1
        data_parallel_size: 1
        tensor_parallel_size: 4
        enable_expert_parallel: false
        sequence_parallel_size: 1
        ulysses_degree: 1
        ring_degree: 1
        cfg_parallel_size: 1
        vae_patch_parallel_size: 1
        use_hsdp: false
        hsdp_shard_size: -1
        hsdp_replicate_size: 1
      custom_pipeline_args:
        pipeline_class: unirl.rollout.engine.vllm_omni.hi3.pipeline.RLHunyuanImage3Pipeline
      worker_extension_cls: unirl.rollout.engine.vllm_omni.weight_sync.dit_extension.DiTWeightSyncExtension
    engine_input_source: [0]
    final_output: true
    final_output_type: image

runtime:
  enabled: true
  defaults:
    window_size: -1
    max_inflight: 1
  edges:
    - from: 0
      to: 1
      window_size: -1
