# @package _global_
# AReaL-compatible deep-research RL with service-scored barrier training.
#
# AReaL alignment status:
#   Stages 1-4: dataset/order/model/prompt/horizon, controller/transcript,
#               one-row trajectory assembly, AReaL services, and actor objective.
#   Later stage: async runtime and disaggregated topology.
#
# Prerequisites:
#   - QWEN3_PATH          : local Qwen3-1.7B checkpoint dir
#   - DATA_PATH           : converted ASearcher-LRM-35k train.jsonl
#   - DATA_MANIFEST       : optional override; defaults to ${DATA_PATH}.manifest.json
#   - DEEP_RESEARCH_RUN_DATE: frozen YYYY-MM-DD date embedded in the prompt
#   - SERPER_KEY_ID       : Serper web-search API key
#   - JINA_API_KEYS       : Jina reader key
#   - JUDGE_URL/JUDGE_MODEL: external Qwen2.5-72B OpenAI-compatible endpoint
#   - JUDGE_TOKENIZER_PATH : tokenizer for that same judge/visit-summary service
#
# Convert data:
#   python -m unirl.utils.prepare_asearcher \
#     --source /path/to/ASearcher-LRM-35k.jsonl --out-dir data/asearcher
#
# Launch:
#   python -m unirl.train_areal --config-name=deep_research/deep_research_search_judge

seed: 1
dataset_sampler_seed: 0
run_date: ${oc.env:DEEP_RESEARCH_RUN_DATE}

# Only deployment-owned values are exposed here. The dedicated AReaL tools and
# judge freeze task behavior such as endpoints, retry counts, timeouts, request
# values, context headroom, and parsing. AReaL passes one Qwen2.5-72B client to
# both visit summarization and judging. The deployment owns global capacity 32;
# the same value only bounds each UniRL reward worker's pending requests.
areal_service:
  endpoint: ${oc.env:JUDGE_URL}
  model: ${oc.env:JUDGE_MODEL}
  tokenizer_path: ${oc.env:JUDGE_TOKENIZER_PATH}
  max_concurrent_requests: 32

system_instruction: |-
  You are a deep research assistant. Your core function is to conduct thorough, multi-source investigations into any topic. You must handle both broad, open-domain inquiries and queries within specialized academic fields. For every request, synthesize information from credible, diverse sources to deliver a comprehensive, accurate, and objective response. When you have gathered sufficient information and are ready to provide the definitive response, you must enclose the entire final answer within <answer></answer> tags.

  # Tools

  You may call one or more functions to assist with the user query.

  You are provided with function signatures within <tools></tools> XML tags:
  <tools>
  {"type": "function", "function": {"name": "search", "description": "Perform Google web searches then returns a string of the top search results. Accepts multiple queries.", "parameters": {"type": "object", "properties": {"query": {"type": "array", "items": {"type": "string", "description": "The search query."}, "minItems": 1, "description": "The list of search queries."}}, "required": ["query"]}}}
  {"type": "function", "function": {"name": "visit", "description": "Visit webpage(s) and return the summary of the content.", "parameters": {"type": "object", "properties": {"url": {"type": "array", "items": {"type": "string"}, "description": "The URL(s) of the webpage(s) to visit. Can be a single URL or an array of URLs."}, "goal": {"type": "string", "description": "The specific information goal for visiting webpage(s)."}}, "required": ["url", "goal"]}}}
  </tools>

  For each function call, return a json object with function name and arguments within <tool_call></tool_call> XML tags:
  <tool_call>
  {"name": <function-name>, "arguments": <args-json-object>}
  </tool_call>

  Current date: ${run_date}

num_devices: 2 # Barrier/colocated until the Stage 5 topology alignment.
batch_size: 128
num_rollouts: 2730 # 10 * floor(35000 / 128)

worker_max_concurrency: 10
per_worker_inflight: 4
stop: []

sampling:
  _target_: unirl.types.sampling.ARSamplingParams
  samples_per_prompt: 8
  temperature: 1.0
  top_p: 1.0
  top_k: 0
  max_new_tokens: 8192

logging:
  report_to_wandb: false
  project_name: unirl-deep-research
  run_name: deepresearch_search_judge_qwen3_1_7b
  entity: ${oc.env:WANDB_ENTITY,null}
  tags: [deep-research, agentic, search, visit, llm-judge, qwen3]

bundle:
  _target_: unirl.models.qwen3.bundle.Qwen3Bundle.from_config
  config:
    _target_: unirl.models.qwen3.config.Qwen3PipelineConfig
    pretrained_model_ckpt_path: ${oc.env:QWEN3_PATH}
    tokenizer_ckpt_path: ${oc.env:QWEN3_TOKENIZER_PATH,${oc.env:QWEN3_PATH}}
    model_precision: bf16
    use_gradient_checkpointing: true
    attn_implementation: flex_attention

pipeline:
  _target_: unirl.models.qwen3.pipeline.Qwen3Pipeline.from_bundle
  system_instruction: ${system_instruction}
  enable_thinking: true
  max_prompt_length: 32768
  autocast_precision: bf16
  logprob_precision: fp32

backend:
  _target_: unirl.train.backend.fsdp.FSDPBackend
  block_class_names: ["Qwen3DecoderLayer"]
  trainable_attr: transformer
  fsdp_cfg:
    _target_: unirl.train.configs.FSDPConfig
    param_dtype: bf16
    cpu_offload: false
    mixed_precision: true
    fsdp_mode: full
    reshard_after_forward: true
    activation_checkpointing: true
    use_torch_compile: false
    forward_prefetch: false
    defer_grad_sync: false
  optimizer_cfg:
    _target_: unirl.train.backend.base.OptimizerConfig
    learning_rate: 3.0e-6
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: 1.0e-8
    weight_decay: 0.003
  scheduler_cfg:
    _target_: unirl.train.backend.base.LrSchedulerConfig
    type: constant
    warmup_steps: 2
    total_steps: ${num_rollouts}

rollout:
  _target_: unirl.rollout.engine.agentic.engine.AgenticRolloutEngine
  config:
    _target_: unirl.rollout.engine.agentic.config.AgenticRolloutEngineConfig
    harness:
      _target_: unirl.rollout.harness.areal_deep_research.ARealDeepResearchHarnessConfig
      max_policy_calls: 100 # Calls 1-99 are ordinary; call 100 is reserved for rescue.
      max_new_tokens_per_call: 8192
      soft_trajectory_tokens: 27648
      answer_now_prompt_tokens: 22118 # floor(0.8 * 27648); rescue triggers only above it.
      hard_context_tokens: 32768
      max_generation_attempts: 3
      retry_backoff_seconds: [0.5, 1.0]
      wall_timeout_seconds: 9000 # 150 minutes.
    inner:
      _target_: unirl.rollout.engine.sglang.config.SGLangEngineConfig
      backend: native
      pretrained_model_ckpt_path: ${oc.env:QWEN3_PATH}
      tp_size: 1
      max_new_tokens: 8192
      temperature: 1.0
      top_p: 1.0
      concurrency: 8
      system_instruction: ${system_instruction}
      prompt_serialization: areal
      chat_template_kwargs:
        enable_thinking: true
        tools: null # Keep the literal prompt schemas; suppress native tool injection.
      engine_kwargs:
        context_length: 32768
        mem_fraction_static: 0.3
        skip_server_warmup: true
        attention_backend: triton
        disable_cuda_graph: false
        cuda_graph_max_bs: 16
        enable_lora: false
        random_seed: ${seed}
    env:
      _target_: unirl.rollout.env.areal_deep_research.ARealDeepResearchEnvironment
      tools:
        - _target_: unirl.rollout.env.tools.areal.ARealSearchTool
        - _target_: unirl.rollout.env.tools.areal.ARealVisitTool
          endpoint: ${areal_service.endpoint}
          model: ${areal_service.model}
          tokenizer_path: ${areal_service.tokenizer_path}
    episode_sampling: ${sampling}

reward:
  _target_: unirl.reward.service.RewardService
  truncated_reward: keep
  backend:
    _target_: unirl.reward.local.areal.ARealJudgeRewardScorer
    base_device: cpu
    config:
      _target_: unirl.reward.local.areal.ARealJudgeSpec
      endpoint: ${areal_service.endpoint}
      model: ${areal_service.model}
      submission_concurrency: ${areal_service.max_concurrent_requests}

# AReaL exposes these tuned numeric values. The dedicated trainer fixes batch-
# global, token-weighted, unbiased normalization with epsilon 1e-5.
reward_transform:
  bias: -0.5
  scale: 10.0

# Structural choices stay in ARealPPO: actor-only (no critic/reference), one
# proximal replay, token-level ratio masking, no lower threshold, and a global
# original-active-token denominator.
algorithm:
  _target_: unirl.algorithms.areal.ARealPPO
  stage_attr: ar
  clip_range: 0.4
  behavior_ratio_upper: 5.0
  sampling_temperature: ${sampling.temperature}
  conditions_cls:
    _target_: hydra.utils.get_class
    path: unirl.models.qwen3.conditions.Qwen3ARConditions

sync:
  _target_: unirl.distributed.weight_sync.full.tensor.TensorWeightSync
  lora_merged: false
  bucket_size_mb: 64
  flush_cache: true

stack:
  _target_: unirl.train.stack.TrainStack
  micro_batch_size: 1
  micro_planner:
    _target_: unirl.train.stack.TokenBudgetPlanner
    token_budget: 32768
    cost_model: sum
  max_grad_norm: 1.0
  num_updates_per_batch: 1

data_source:
  _target_: unirl.data.data_source.MultimodalRLDataSource
  args:
    run:
      data_path: ${oc.env:DATA_PATH}
      manifest_path: ${oc.env:DATA_MANIFEST,${oc.env:DATA_PATH}.manifest.json}
      expected_num_prompts: 35000
      stateful_epoch_order: true
      seed: ${dataset_sampler_seed}
      shuffle: true
      drop_last: true
    algorithm:
      prompts_per_rollout: ${batch_size}
