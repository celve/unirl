# @package _global_
# M2 — Deep-research agentic RL: the REAL deep-research run. Same AgenticTrainer
# + AgenticRolloutEngine as M1 (unchanged), swapping ONLY the tools (search + visit)
# and the reward backend (LLM-as-judge). This is the proof that the design isolates
# "what tools / what reward" from "how to train".
#
# Prerequisites (operational — set on the pod):
#   - QWEN3_INSTRUCT_PATH : local Qwen3-Instruct checkpoint dir
#   - DATA_PATH           : ASearcher jsonl (python -m unirl.utils.prepare_asearcher --out-dir data/asearcher)
#   - POLARIS_APP_ID / POLARIS_APP_KEY: shared gateway credentials for the
#                            Serper search and Jina reader providers (preferred)
#   - SERPER_KEY_ID / JINA_API_KEYS: legacy direct-provider credentials
#   - JUDGE_URL/JUDGE_MODEL: an OpenAI-compatible judge endpoint (e.g. a separate
#                            SGLang/vLLM server hosting Qwen2.5-72B-Instruct)
#   - SUMMARY_URL/SUMMARY_MODEL (optional): summarizer for the visit tool (the judge
#                            endpoint works); without it, visit returns raw page text.
#
# Run (single node, >=2 GPUs; scale num_devices / batch_size / n up for real training):
#   QWEN3_INSTRUCT_PATH=... DATA_PATH=data/asearcher/train.jsonl \
#   SERPER_KEY_ID=... JINA_API_KEYS=... JUDGE_URL=... JUDGE_MODEL=... \
#   python -m unirl.train_deep_research --config-name=deep_research/deep_research_search_judge num_devices=2
#
# Polaris gateway: set SERPER_AUTH=polaris, JINA_PROVIDER=jina_ai, and
#   POLARIS_APP_ID/POLARIS_APP_KEY. The tools use the fixed internal URLs and
#   synthesize provider-scoped bearer tokens at request time; secrets must remain
#   in a pod-local environment file.
# Debug: set TRAJ_DUMP_DIR=/abs/path to dump every trajectory of every rollout to
#   <dir>/rollout_<id>.jsonl — one line per sample (decoded turns + reward + advantage).
#   TRAJ_DUMP_MAX_CHARS>0 caps per-turn text (default 0 = full).

num_devices: 8
batch_size: 128 # P prompts_per_rollout; P*n = 1024 must be divisible by num_devices (tongyi_deepresearch batch_size=128)
num_rollouts: 200
weight_sync_interval: 1
eval_interval: 0

worker_max_concurrency: 8
# AReaL parity (LIN-564): stop at the hallucinated <tool_response>, NOT at </tool_call>.
# Proven decisive for rollout-0: replicating AReaL's harness on vanilla Qwen3-1.7B, swapping ONLY
# this stop from <tool_response> to </tool_call> turned 0 loops into 4/12 max-turn loops (the model
# concludes in \boxed{} and re-searches forever instead of emitting <answer>). </tool_call> ends the
# search turn one token early and derails the multi-turn protocol; <tool_response> keeps it on-track.
stop: ["\n<tool_response>", "<tool_response>"]
# SGLang's default trimming remains active for this literal AReaL stop-parameter
# baseline. A separate clean react-style serialization ablation intentionally
# overrides both this and ``stop`` together; it is behavioral alignment, not a
# claim that AReaL itself stops at ``</tool_call>``.
no_stop_trim: false

adv_normalization_scope: token-global # exact AReaL loss-mask/token-weighted batch normalization
normalize_adv_by_std: true
# Intervention-aware credit for the optional user-nudge NEITHER rescue. Existing
# recipes remain byte-identical unless explicitly enabled by a launcher.
mask_answer_rescue_trigger_task_credit: false
answer_rescue_trigger_penalty: 0.0

logging:
  report_to_wandb: true
  project_name: unirl-deep-research
  run_name: deepresearch_tongyi_qwen3_1p7b
  entity: ${oc.env:WANDB_ENTITY,null}
  tags: [deep-research, agentic, search, visit, llm-judge, qwen3, m2]

bundle:
  _target_: unirl.models.qwen3.bundle.Qwen3Bundle.from_config
  config:
    _target_: unirl.models.qwen3.config.Qwen3PipelineConfig
    pretrained_model_ckpt_path: ${oc.env:QWEN3_INSTRUCT_PATH,Qwen/Qwen3-1.7B}
    model_precision: fp32
    use_gradient_checkpointing: true
    attn_implementation: flex_attention

pipeline:
  _target_: unirl.models.qwen3.pipeline.Qwen3Pipeline.from_bundle
  enable_thinking: true # tongyi_deepresearch runs thinking-on (LIN-564); must agree with chat_template_kwargs
  autocast_precision: bf16
  logprob_precision: fp32

backend:
  _target_: unirl.train.backend.fsdp.FSDPBackend
  block_class_names: ["Qwen3DecoderLayer"]
  trainable_attr: transformer
  fsdp_cfg:
    _target_: unirl.train.configs.FSDPConfig
    param_dtype: bf16
    cpu_offload: false
    mixed_precision: true
    fsdp_mode: full
    reshard_after_forward: true
    activation_checkpointing: true
    use_torch_compile: false
    forward_prefetch: false
    defer_grad_sync: false
  optimizer_cfg:
    _target_: unirl.train.backend.base.OptimizerConfig
    learning_rate: 3.0e-6 # tongyi_deepresearch
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: 1.0e-8
    weight_decay: 0.003 # tongyi_deepresearch
  scheduler_cfg:
    _target_: unirl.train.backend.base.LrSchedulerConfig
    type: constant
    warmup_steps: 2 # ~0.001 warmup proportion, tongyi_deepresearch
    total_steps: 2000

rollout:
  _target_: unirl.rollout.engine.agentic.engine.AgenticRolloutEngine
  config:
    _target_: unirl.rollout.engine.agentic.config.AgenticRolloutEngineConfig
    max_turns: 100 # tongyi_deepresearch max_llm_calls_per_run
    max_tokens_per_trajectory: 27648 # tongyi_deepresearch per-trajectory token budget; force-answer at 0.8
    # Opt-in decoder-side format repair experiment. A true NEITHER turn can be
    # continued from exact assistant token ids after injecting <answer>, without
    # adding a synthetic user/chat turn. Keep false for baseline recipes.
    inject_answer_after_neither: false
    # Safer alternative: add a user observation and sample a complete answer turn,
    # including the <answer> opener. Mutually exclusive with decoder-prefix repair.
    nudge_answer_after_neither: false
    neither_answer_prefix: "\n<answer>"
    neither_answer_stop: "</answer>"
    neither_answer_max_new_tokens: 1024
    per_worker_concurrency: 8
    inner:
      _target_: unirl.rollout.engine.sglang.config.SGLangEngineConfig
      backend: native
      pretrained_model_ckpt_path: ${oc.env:QWEN3_INSTRUCT_PATH,Qwen/Qwen3-1.7B}
      tp_size: 1
      max_new_tokens: 8192 # per TURN; aligned to tongyi_deepresearch
      temperature: 1.0
      top_p: 1.0
      concurrency: 8
      # The deep-research framing — VERBATIM from AReaL's tongyi_deepresearch SYSTEM_PROMPT,
      # INCLUDING the <tools> JSON block embedded as TEXT (LIN-564 rollout-0 fix). Do NOT drop
      # the tools block and rely on tools= auto-injection: passing tools= puts Qwen3 into native
      # tool-calling mode, where the model self-terminates at </tool_call> (emits <|im_end|>) and
      # then falls back to \boxed{} answers → re-searches forever → rollout-0 turns blow up to the
      # 100-turn cap (mean 5.7). Embedding tools as text (AReaL's way) keeps the model generating
      # through the tool boundary so it emits <answer> and converges (~2.28 turns). Proven by a
      # faithful AReaL-harness replica on vanilla Qwen3-1.7B: tools-in-system → 0 loops on the 12
      # worst questions; tools= injection → 4 loops. See docs/unirl-vs-areal-turn-growth-causes.md.
      system_instruction: |-
        You are a deep research assistant. Your core function is to conduct thorough, multi-source investigations into any topic. You must handle both broad, open-domain inquiries and queries within specialized academic fields. For every request, synthesize information from credible, diverse sources to deliver a comprehensive, accurate, and objective response. When you have gathered sufficient information and are ready to provide the definitive response, you must enclose the entire final answer within <answer></answer> tags.

        # Tools

        You may call one or more functions to assist with the user query.

        You are provided with function signatures within <tools></tools> XML tags:
        <tools>
        {"type": "function", "function": {"name": "search", "description": "Perform Google web searches then returns a string of the top search results. Accepts multiple queries.", "parameters": {"type": "object", "properties": {"query": {"type": "array", "items": {"type": "string", "description": "The search query."}, "minItems": 1, "description": "The list of search queries."}}, "required": ["query"]}}}
        {"type": "function", "function": {"name": "visit", "description": "Visit webpage(s) and return the summary of the content.", "parameters": {"type": "object", "properties": {"url": {"type": "array", "items": {"type": "string"}, "description": "The URL(s) of the webpage(s) to visit. Can be a single URL or an array of URLs."}, "goal": {"type": "string", "description": "The specific information goal for visiting webpage(s)."}}, "required": ["url", "goal"]}}}
        </tools>

        For each function call, return a json object with function name and arguments within <tool_call></tool_call> XML tags:
        <tool_call>
        {"name": <function-name>, "arguments": <args-json-object>}
        </tool_call>

        Current date: ${oc.env:RUN_DATE,2026-07-16}
      chat_template_kwargs:
        enable_thinking: true # tongyi_deepresearch runs thinking-on (LIN-564); must agree with pipeline.enable_thinking
        tools: null # AReaL parity (LIN-564): tools are embedded in system_instruction as TEXT (above); do NOT auto-inject via tools= (native tool mode → self-terminate at </tool_call> → \boxed{} loops). null suppresses the _maybe_inject_tool_schemas setdefault.
      engine_kwargs:
        mem_fraction_static: 0.3
        context_length: 32768 # aligned to tongyi_deepresearch trajectory budget
        skip_server_warmup: true
        attention_backend: fa3 # tongyi_deepresearch uses fa3
        disable_cuda_graph: true # sglang JIT activation kernel (PDL variant) fails to compile at graph capture in this env
        cuda_graph_max_bs: 16
        enable_lora: false
    env:
      _target_: unirl.rollout.loop.tool_environment.ToolEnvironment
      max_turns: 100 # keep == config.max_turns
      tools:
        - _target_: unirl.rollout.loop.tools.search.SearchTool
          top_k: 10
          timeout: 65
          provider: serper
        - _target_: unirl.rollout.loop.tools.visit.VisitTool
          endpoint: ${oc.env:SUMMARY_URL,""}
          model: ${oc.env:SUMMARY_MODEL,""}
          timeout: 65
          reader_provider: ${oc.env:JINA_PROVIDER,direct}
          reader_url: ${oc.env:JINA_READER_URL,""}
    episode_sampling:
      _target_: unirl.types.sampling.ARSamplingParams
      samples_per_prompt: 8
      temperature: 1.0
      top_p: 1.0
      top_k: 0
      max_new_tokens: 8192

reward:
  # LLM-as-judge over text: the judge decides whether the trajectory's <answer> is
  # equivalent to the reference answer (metadata["answer"]) -> 1.0 / 0.0. Hosted
  # out-of-band; the scorer only POSTs to $JUDGE_URL.
  _target_: unirl.reward.service.RewardService
  truncated_reward: keep
  backend:
    _target_: unirl.reward.local.llm_judge.LLMJudgeRewardScorer
    base_device: cpu
    config:
      _target_: unirl.reward.local.llm_judge.LLMJudgeSpec
      endpoint: ${oc.env:JUDGE_URL,""}
      model: ${oc.env:JUDGE_MODEL,""}

algorithm:
  _target_: unirl.algorithms.grpo.GRPO
  stage_attr: ar
  clip_range: 0.4 # tongyi_deepresearch eps_clip
  clip_range_high: null
  clip_schedule: constant
  loss_agg_mode: global-token-mean # exact flat active-token mean across micros + DP ranks
  horizon: 8192
  sampling_temperature: 1.0 # MUST equal episode_sampling.temperature
  conditions_cls:
    _target_: hydra.utils.get_class
    path: unirl.models.qwen3.conditions.Qwen3ARConditions

sync:
  _target_: unirl.distributed.weight_sync.full.tensor.TensorWeightSync
  lora_merged: false
  bucket_size_mb: 64
  flush_cache: true

stack:
  _target_: unirl.train.stack.TrainStack
  micro_batch_size: 1
  max_grad_norm: 1.0
  num_updates_per_batch: 1 # strict on-policy MVP

data_source:
  _target_: unirl.data.data_source.MultimodalRLDataSource
  args:
    run:
      data_path: ${oc.env:DATA_PATH} # ASearcher jsonl: {"prompt": ..., "metadata": {"answer": ...}}
      eval_data_path: ${oc.env:EVAL_DATA_PATH,${oc.env:DATA_PATH}} # unused (eval_interval=0); defaults to train
      seed: 42
    algorithm:
      prompts_per_rollout: 128 # == batch_size (P)

sampling:
  _target_: unirl.types.sampling.ARSamplingParams
  samples_per_prompt: 8
  temperature: 1.0
  top_p: 1.0
  top_k: 0
  max_new_tokens: 8192
