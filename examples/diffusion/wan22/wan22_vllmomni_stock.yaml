# @package _global_
# Wan2.2-T2V-A14B + vLLM-Omni rollout — STOCK kernels (gap-measurement baseline).
#
# Identical run shape to wan22_vllmomni_parity.yaml (same batch/spp/steps/SDE
# window/LoRA/sync), but the engine and trainer keep their stock kernels and
# canonical precisions (autocast bf16, fp16 trajectory, parity_mode off).
# The rollout_replay_logp_absdiff_{mean,max} metrics then MEASURE the natural
# rollout-vs-train gap of this stack instead of asserting zero.

num_devices: 8
batch_size: 16
adv_use_global_std: true
num_rollouts: 100

weight_sync_interval: 1

logging:
  report_to_wandb: false
  project_name: unirl
  run_name: wan22-stock-vllmomni
  entity: null
  tags: [wan22, stock-kernels, lora, dual-expert]

bundle:
  _target_: unirl.models.wan22.bundle.WAN22Bundle.from_config
  config:
    _target_: unirl.models.wan22.config.WAN22PipelineConfig
    pretrained_model_ckpt_path: ${oc.env:PRETRAINED_MODEL,Wan-AI/Wan2.2-T2V-A14B-Diffusers}
    model_precision: bf16
    shift: 5.0
    max_sequence_length: 512
    boundary_ratio: 0.875
    num_train_timesteps: 1000
    load_aux_modules: false   # UMT5+VAE live in the engine; trainer replays harvested conditions

pipeline:
  _target_: unirl.models.wan22.pipeline.WAN22Pipeline
  shift: 5.0
  autocast_precision: bf16
  trajectory_precision: fp16
  logprob_precision: fp32
  max_sequence_length: 512
  strategy:
    _target_: unirl.sde.kernels.FlowSDEStrategy

backend:
  _target_: unirl.train.backend.fsdp.FSDPBackend
  block_class_names: ["WanTransformerBlock"]
  trainable_attr: transformer
  fsdp_cfg:
    _target_: unirl.train.configs.FSDPConfig
    param_dtype: bf16
    cpu_offload: false
    mixed_precision: true
    fsdp_mode: full
    reshard_after_forward: true
    activation_checkpointing: false
    use_torch_compile: false
  optimizer_cfg:
    _target_: unirl.train.backend.base.OptimizerConfig
    learning_rate: 3.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: 1.0e-8
    weight_decay: 0.0
  scheduler_cfg:
    _target_: unirl.train.backend.base.LrSchedulerConfig
    type: constant
    warmup_steps: 0
    total_steps: 10000
  lora_cfg:
    _target_: unirl.train.configs.LoraConfig
    rank: 64
    alpha: 128         # alpha/rank = 2.0 — power-of-two fold, bitwise-free
    dropout: 0.0       # engine applies no dropout; parity processor enforces 0
    bias: none
    task_type: FEATURE_EXTRACTION
    target_modules:
      - attn1.to_q
      - attn1.to_k
      - attn1.to_v
      - attn1.to_out.0
      - attn2.to_q
      - attn2.to_k
      - attn2.to_v
      - attn2.to_out.0

rollout:
  _target_: unirl.rollout.engine.vllm_omni.engine.VLLMOmniRolloutEngine
  model_config: ${bundle.config}
  config:
    _target_: unirl.rollout.engine.vllm_omni.config.VLLMOmniEngineConfig
    model_path: ${oc.env:PRETRAINED_MODEL,Wan-AI/Wan2.2-T2V-A14B-Diffusers}
    modality: wan22_t2v
    enable_sleep_mode: true
    parity_mode: false

reward:
  _target_: unirl.reward.service.RewardService
  backend:
    _target_: unirl.reward.local.video_pickscore.VideoPickScoreScorer
    base_device: cuda
    config:
      _target_: unirl.reward.local.video_pickscore.VideoPickScoreSpec
      batch_size: 8
      device: auto
      processor_id: laion/CLIP-ViT-H-14-laion2B-s32B-b79K
      model_id: yuvalkirstain/PickScore_v1

algorithm:
  _target_: unirl.algorithms.flowgrpo.FlowGRPO
  stage_attr: diffusion
  clip_range: 1.0e-4
  clip_schedule: constant
  old_logp_source: rollout
  conditions_cls:
    _target_: hydra.utils.get_class
    path: unirl.models.wan21.conditions.WAN21Conditions
  params: ${sampling}

stack:
  _target_: unirl.train.stack.TrainStack
  micro_batch_size: 1
  max_grad_norm: 1.0
  num_updates_per_batch: 1

data_source:
  _target_: unirl.data.data_source.MultimodalRLDataSource
  args:
    run:
      data_path: datasets/pickscore/train.txt
      eval_data_path: datasets/pickscore/test.txt
      seed: 42
    algorithm:
      prompts_per_rollout: ${batch_size}

sampling:
  _target_: unirl.types.sampling.DiffusionSamplingParams
  num_inference_steps: 20
  guidance_scale: 1.0
  height: 480
  width: 640
  num_frames: 1
  eta: 0.7
  samples_per_prompt: 8
  seed: 42
  init_same_noise: false
  scheduler:
    _target_: unirl.utils.scheduler_utils.AllSDEScheduler
    num_timesteps: ${..num_inference_steps}
    timestep_fraction: [0.0, 0.2]
    num_sde_steps: null

# LoRA adapter sync (bf16 wire). param_prefix "" so the composite children
# carry the expert prefix; name_substitutions routes them onto the engine's
# dual-module namespace (transformer / transformer_2). The .to_out.0. fixup
# is LoRA-only: the engine module is `to_out` (diffusers' is a ModuleList
# `to_out.0`); the engine's own load_weights remaps it for FULL weights, but
# the LoRA path bypasses load_weights. peft_target_modules_override ships
# engine-shaped strings so the engine LoRA manager's suffix match wraps the
# right modules under BOTH experts (the fused attn1.to_qkv expands to
# to_q/to_k/to_v slices via the manager's packed-modules mapping).
sync:
  _target_: unirl.distributed.weight_sync.lora.LocalLoraWeightSync
  verify: true
  param_prefix: ""
  adapter_name: default
  name_substitutions:
    "high_noise.": "transformer."
    "low_noise.": "transformer_2."
    ".to_out.0.": ".to_out."
  peft_target_modules_override:
    - attn1.to_q
    - attn1.to_k
    - attn1.to_v
    - attn1.to_out
    - attn2.to_q
    - attn2.to_k
    - attn2.to_v
    - attn2.to_out
