# @package _global_
# SD3.5-medium + vLLM-Omni — GROUPED shared-kernel parity (full throughput).
#
# Same numerics contract as sd3_vllmomni_parity.yaml (shared kernels, autocast
# off, bf16 timestep, gate tol=0.0), but the GEOMETRY seam is closed the other
# way around: instead of forcing the engine down to batch-1 requests, the
# trainer replays at the engine's native grouped geometry —
#   engine:  one request per prompt, forward batch [spp, ...] latents against
#            ONE [1, L, D] text row (AdaLN broadcasts it);
#   trainer: micro_batch_size == samples_per_prompt (one noise group per
#            micro) + group_broadcast_conditions collapses the group's
#            identical condition rows back to [1, L, D] before the forward.
# Both sides then run the identical grouped kernels — bitwise parity at
# grouped throughput (expected: generate ≈ stock ~44 ms/sample, vs 60 in the
# ungrouped Phase A recipe).

num_devices: 8
batch_size: 16
adv_use_global_std: true

weight_sync_interval: 1

logging:
  report_to_wandb: false
  project_name: unirl
  run_name: sd3-parity-grouped
  entity: null
  tags: [sd3, parity, shared-kernels, grouped]

bundle:
  _target_: unirl.models.sd3.bundle.SD3Bundle.from_config
  config:
    _target_: unirl.models.sd3.config.SD3PipelineConfig
    pretrained_model_ckpt_path: ${oc.env:PRETRAINED_MODEL,stabilityai/stable-diffusion-3.5-medium}
    model_precision: bf16
    shift: 3.0
    shared_kernels: true
    timestep_in_model_dtype: true
    group_broadcast_conditions: true

pipeline:
  _target_: unirl.models.sd3.pipeline.SD3Pipeline
  shift: 3.0
  autocast_precision: fp32   # NO autocast — pure-bf16 forward like the engine
  trajectory_precision: bf16
  logprob_precision: fp32
  timestep_in_model_dtype: true
  group_broadcast_conditions: true
  strategy:
    _target_: unirl.sde.kernels.FlowSDEStrategy

backend:
  _target_: unirl.train.backend.fsdp.FSDPBackend
  block_class_names: ["JointTransformerBlock"]
  trainable_attr: transformer
  fsdp_cfg:
    _target_: unirl.train.configs.FSDPConfig
    param_dtype: bf16
    cpu_offload: false
    mixed_precision: true
    fsdp_mode: full
    reshard_after_forward: false
    # Grouped replay holds micro=8 x num-SDE-step autograd graphs at once
    # (~78 GB without AC on an H20 alongside the colocated engine). AC
    # recomputes deterministically with the same shared kernels, so the
    # bitwise gate is unaffected; only train_time pays (~+30%).
    activation_checkpointing: true
    use_torch_compile: false
  optimizer_cfg:
    _target_: unirl.train.backend.base.OptimizerConfig
    learning_rate: 1.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: 1.0e-8
    weight_decay: 0.0
  scheduler_cfg:
    _target_: unirl.train.backend.base.LrSchedulerConfig
    type: constant
    warmup_steps: 0
    total_steps: 10000
  # Full-weight (no lora_cfg), same as Phase A.

rollout:
  _target_: unirl.rollout.engine.vllm_omni.engine.VLLMOmniRolloutEngine
  model_config: ${bundle.config}
  config:
    _target_: unirl.rollout.engine.vllm_omni.config.VLLMOmniEngineConfig
    model_path: ${oc.env:PRETRAINED_MODEL,stabilityai/stable-diffusion-3.5-medium}
    modality: sd3_t2i
    enable_sleep_mode: true
    parity_mode: true
    # THE knob of this recipe: keep grouped requests.
    parity_ungrouped: false

reward:
  _target_: unirl.reward.service.RewardService
  backend:
    _target_: unirl.reward.local.pickscore.PickScoreRewardScorer
    base_device: cuda
    config:
      _target_: unirl.reward.local.pickscore.PickScoreSpec
      batch_size: 8
      device: auto
      processor_id: laion/CLIP-ViT-H-14-laion2B-s32B-b79K
      model_id: yuvalkirstain/PickScore_v1

algorithm:
  _target_: unirl.algorithms.flowgrpo.FlowGRPO
  stage_attr: diffusion
  clip_range: 1.0e-4
  clip_schedule: constant
  old_logp_source: rollout
  parity_assert_tol: 0.0
  conditions_cls:
    _target_: hydra.utils.get_class
    path: unirl.models.sd3.conditions.SD3Conditions
  params: ${sampling}

stack:
  _target_: unirl.train.stack.TrainStack
  # One noise group per micro — MUST equal sampling.samples_per_prompt.
  micro_batch_size: 8
  max_grad_norm: 1.0
  num_updates_per_batch: 1

data_source:
  _target_: unirl.data.data_source.MultimodalRLDataSource
  args:
    run:
      data_path: datasets/pickscore/train.txt
      eval_data_path: datasets/pickscore/test.txt
      seed: 42
    algorithm:
      prompts_per_rollout: ${batch_size}

sampling:
  _target_: unirl.types.sampling.DiffusionSamplingParams
  num_inference_steps: 10
  guidance_scale: 1.0
  height: 512
  width: 512
  eta: 0.7
  samples_per_prompt: 8
  seed: 42
  init_same_noise: false
  scheduler:
    _target_: unirl.utils.scheduler_utils.AllSDEScheduler
    num_timesteps: ${..num_inference_steps}
    num_sde_steps: 3
    timestep_fraction: [0, 0.5]

sync:
  _target_: unirl.distributed.weight_sync.full.ipc.IPCWeightSync
  lora_merged: false
  bucket_size_mb: 2048
  use_shm: false
  flush_cache: true
  name_remap: {"*": "transformer.*"}
