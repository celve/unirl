# @package _global_
# FLUX.2-klein-4B GRPO — SGLANG rollout + RemoteRewardBackend (EditReward).
#
# THE SGLANG ARM of the correctness A/B. This is a duplicate of
# flux2_klein_4b_editreward.yaml (the proven trainside recipe) with the rollout
# engine swapped to SGLangDiffusionRolloutEngine. Its purpose is to answer one
# question: DOES THE ti2i SGLANG PATH TRAIN? If this recipe's reward curve grows
# the way the trainside baseline's does, the conditions round-trip
# (image_latent + image_latent_ids capture -> replay) is correct.
#
# Why EditReward and not PickScore. A prior A/B ran both engines against
# PickScore for 55 rollouts each. Both curves were flat and statistically
# indistinguishable (slopes -0.000023 vs -0.000023, r=0.9983). That established
# the engines AGREE, but could not establish either one TRAINS -- PickScore
# scores text<->image alignment and never looks at the source image, so an edit
# task gives it almost nothing to reward. EditReward scores the edit itself, so
# a growing curve here is a real positive result rather than an absence of one.
#
# DEVIATIONS from the trainside recipe. All are forced by the engine swap; none
# were chosen. Listed so a curve difference can be attributed honestly:
#   1. rollout / sync / weight_sync_interval -- the engine itself. Trainside
#      trains the sampler in place; SGLang needs LoRA weights pushed to the
#      engine each interval.
#   2. param_dtype fp32 -> bf16, plus master_dtype: fp32. The synced LoRA wire
#      dtype must be bf16 for the SGLang kernels; master_dtype restores the
#      proven recipe's fp32 optimizer precision, which is load-bearing at the
#      ~1e-3 gradient scale this task runs at.
#   3. init_same_noise true -> false. NOT a preference: the engine's
#      init_same_noise=true path sizes x_T via the SGLang fork's flux2
#      prepare_latent_shape, which mis-sizes FLUX.2 latent channels (DiT img_in
#      sees 128 vs the expected 64 and the denoising matmul fails). GRPO
#      correctness does not depend on shared init noise -- per-prompt-group
#      advantages do not require it; it is variance reduction only -- but it
#      DOES mean this arm has higher within-group variance than the baseline.
#      *** THIS IS THE ONE CONFOUND IN THE A/B. *** If the baseline grows and
#      this arm does not, run the tiebreaker before blaming the conditioning:
#      the trainside recipe with init_same_noise: false. If that also fails to
#      grow, the cause is the missing variance reduction, not the engine.
#   4. activation_checkpointing false -> true. Memory, not math: each of the 8
#      actors colocates its own SGLang engine holding a full model copy, and
#      ti2i concatenates source-image tokens onto the noise sequence.
#   5. bundle.config inlined -> ${model_config} anchor, and strategy likewise.
#      Structural only, same values -- the SGLang engine needs to reference both.
#   6. use_lora / lora_target_modules surfaced onto model_config, and
#      stage_config.task: it2i added (fails fast if the dataset lost its
#      condition images instead of silently training t2i).
#
# 2-node deployment (the reward service is SHARED with the trainside arm, so
# both arms score against byte-identical weights):
#   Node 0 (reward): ray start --head --port=6379 --num-gpus=1
#                    python -m reward_service --config configs/editreward_service.yaml
#   Node 1 (train):  export REWARD_SERVICE_URL=http://<node0_ip>:8080
#                    export DATA_PATH=/root/it2i_data/train.jsonl
#                    bash examples/run_experiment_single_node.sh diffusion/flux2_klein/flux2_klein_4b_editreward_sglang

num_devices: 8
batch_size: 64
num_rollouts: 10000

# Checkpointing (LoRA adapter only — MBs, not GBs). Set SAVE_DIR to a persistent
# location (e.g. CephFS) so checkpoints survive pod teardown; the default is a
# repo-relative path. save_interval=0 disables saving (the framework default).
save_interval: ${oc.env:SAVE_INTERVAL,100}
save_mode: ${oc.env:SAVE_MODE,adapter}
save_dir: ${oc.env:SAVE_DIR,checkpoints/flux2klein_4b_editreward}

logging:
  report_to_wandb: true
  project_name: ${oc.env:WANDB_PROJECT,unirl-flux2klein-editreward}
  run_name: ${oc.env:WANDB_RUN_NAME,klein4b_editreward_sglang}
  entity: ${oc.env:WANDB_ENTITY,linyuwus}
  tags: [flux2_klein, 4b, it2i, editreward, sglang, ab-test]
  log_media: true
  media_max_items: 8
  media_log_interval: 1

# Pin the edit task: a dataset that lost its (image, condition) media refs then
# fails on rollout 1 in the adapter instead of silently degrading to t2i.
stage_config:
  task: it2i

strategy:
  _target_: unirl.sde.kernels.DanceSDEStrategy

model_config:
  _target_: unirl.models.flux2_klein.config.Flux2KleinPipelineConfig
  pretrained_model_ckpt_path: ${oc.env:FLUX2_KLEIN_PATH,black-forest-labs/FLUX.2-klein-base-4B}
  model_precision: bf16
  max_sequence_length: 512
  shift: 1.0
  use_lora: true
  lora_target_modules: &lora_targets
    - to_q
    - to_k
    - to_v
    - to_out.0
    - add_q_proj
    - add_k_proj
    - add_v_proj
    - to_add_out
    - ff.linear_in
    - ff.linear_out
    - ff_context.linear_in
    - ff_context.linear_out
    - to_qkv_mlp_proj

bundle:
  _target_: unirl.models.flux2_klein.bundle.Flux2KleinBundle.from_config
  config: ${model_config}

pipeline:
  _target_: unirl.models.flux2_klein.pipeline.Flux2KleinPipeline
  shift: 1.0
  autocast_precision: bf16
  trajectory_precision: fp16
  logprob_precision: fp32
  max_sequence_length: 512
  qwen3_extraction_layers: [9, 18, 27]
  strategy: ${strategy}

backend:
  _target_: unirl.train.backend.fsdp.FSDPBackend
  block_class_names: ["Flux2TransformerBlock", "Flux2SingleTransformerBlock"]
  trainable_attr: transformer
  fsdp_cfg:
    _target_: unirl.train.configs.FSDPConfig
    # fp32 -> bf16 forced by the synced LoRA wire dtype; master_dtype restores
    # the proven recipe's fp32 optimizer precision.
    param_dtype: bf16
    master_dtype: fp32
    cpu_offload: false
    mixed_precision: true
    fsdp_mode: full
    reshard_after_forward: true
    # Memory, not math (numerically neutral): 8 colocated SGLang engines plus
    # ti2i's source-image tokens concatenated onto the noise sequence.
    activation_checkpointing: true
    use_torch_compile: false
  optimizer_cfg:
    _target_: unirl.train.backend.base.OptimizerConfig
    learning_rate: 5.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: 1.0e-8
    weight_decay: 0.0
  scheduler_cfg:
    _target_: unirl.train.backend.base.LrSchedulerConfig
    type: constant
    warmup_steps: 0
    total_steps: 10000
  lora_cfg:
    _target_: unirl.train.configs.LoraConfig
    rank: 16
    alpha: 32
    dropout: 0.0
    bias: none
    task_type: FEATURE_EXTRACTION
    target_modules: *lora_targets

rollout:
  _target_: unirl.rollout.engine.sglang_diffusion.engine.SGLangDiffusionRolloutEngine
  config:
    _target_: unirl.rollout.engine.sglang_diffusion.config.SGLangDiffusionEngineConfig
    # Klein serves t2i and ti2i off one checkpoint; the adapter branches on
    # req.primitives['image'].
    model_family: flux2_klein
    # LOAD-BEARING for ti2i: replay consumes the SERVER's packed condition
    # tokens and their RoPE ids, shipped back as image_latent/image_latent_ids.
    # Without this the trainer has no source-image conditioning at replay.
    populate_conditions: true
    init_same_noise: ${sampling.init_same_noise}
    forward_batch_size: 16
    num_gpus: 1
    tp_size: 1
    local_mode: true
    target_modules: *lora_targets
    engine_kwargs:
      model_type: flux2_klein
  model_config: ${model_config}
  strategy: ${strategy}

weight_sync_interval: 1

sync:
  _target_: unirl.distributed.weight_sync.lora.LocalLoraWeightSync
  # Must be false on SGLang — only vLLM-Omni implements the checksum read-back.
  verify: false
  param_prefix: "transformer."
  adapter_name: default

reward:
  _target_: unirl.reward.service.RewardService
  backend:
    _target_: unirl.reward.remote.RemoteRewardBackend
    base_device: cpu
    config:
      _target_: unirl.reward.remote.RemoteRewardSpec
      base_url: ${oc.env:REWARD_SERVICE_URL,http://localhost:8080}
      required_rewards: [editreward]
      reward_weights:
        editreward: 1.0
      batch_size: 8
      timeout: 300.0
      sub_metric_reduce: mean
      aggregation_method: weighted_sum

algorithm:
  _target_: unirl.algorithms.flowgrpo.FlowGRPO
  stage_attr: diffusion
  clip_range: 5.0e-3
  clip_schedule: constant
  old_logp_source: replay
  conditions_cls:
    _target_: hydra.utils.get_class
    path: unirl.models.flux2_klein.conditions.Flux2KleinConditions
  params: ${sampling}

stack:
  _target_: unirl.train.stack.TrainStack
  micro_batch_size: 1
  max_grad_norm: 1.0
  num_updates_per_batch: 2

data_source:
  _target_: unirl.data.data_source.MultimodalRLDataSource
  args:
    run:
      # REQUIRED. datasets/image_edit/*.jsonl ships PLACEHOLDER uris that do not
      # resolve; point these at a real, pod-local edit dataset.
      data_path: ${oc.env:DATA_PATH,???}
      eval_data_path: ${oc.env:EVAL_DATA_PATH,???}
      seed: 42
    algorithm:
      prompts_per_rollout: ${batch_size}

sampling:
  _target_: unirl.types.sampling.DiffusionSamplingParams
  num_inference_steps: 10
  guidance_scale: 1.0
  height: 512
  width: 512
  eta: 0.7
  samples_per_prompt: 16
  seed: 42
  # FORCED false (see DEVIATIONS #3 in the header) — the engine's
  # init_same_noise=true path mis-sizes FLUX.2 latent channels. This is the one
  # confound in the A/B.
  init_same_noise: false
  scheduler:
    _target_: unirl.utils.scheduler_utils.AllSDEScheduler
    num_timesteps: ${..num_inference_steps}
    num_sde_steps: 3
    timestep_fraction: [0, 0.5]
