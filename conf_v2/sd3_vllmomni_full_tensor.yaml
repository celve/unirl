# SD3 v2 trainer — LoRA training, MERGED full-weight sync via tensor-payload (COLOCATE).
# Self-contained variant of sd3_vllmomni.yaml. Differences:
#   - LoRA training (lora_cfg kept), pushed as a MERGED full model each sync —
#     sync.use_merged: true folds the LoRA delta into the base weights, so the
#     rollout engine runs the merged model with no separate adapter.
#   - sync -> TensorWeightSync (colocate serialized-tensor handoff).

num_devices: 8
batch_size: 48 # prompts_per_rollout

# Every N rollouts the loop pushes the freshly-trained full weights into the
# engine just before that rollout's generate.
weight_sync_interval: 1

bundle:
  _target_: diffusionrl.models.sd3.bundle.SD3Bundle.from_config
  config:
    _target_: diffusionrl.models.sd3.config.SD3PipelineConfig
    pretrained_model_ckpt_path: ${oc.env:PRETRAINED_MODEL,stabilityai/stable-diffusion-3.5-medium}
    model_precision: bf16
    autocast_precision: bf16
    trajectory_precision: bf16
    logprob_precision: fp32
    shift: 3.0

pipeline:
  _target_: diffusionrl.models.sd3.pipeline.SD3Pipeline
  shift: 3.0
  autocast_precision: bf16
  trajectory_precision: bf16
  logprob_precision: fp32
  strategy:
    _target_: diffusionrl.sde.kernels.FlowSDEStrategy

backend:
  _target_: diffusionrl.train.backend.fsdp.FSDPBackend
  block_class_names: ["JointTransformerBlock"]
  trainable_attr: transformer
  fsdp_cfg:
    _target_: diffusionrl.train.configs.FSDPConfig
    param_dtype: bf16
    cpu_offload: false
    mixed_precision: true
    fsdp_mode: full
    reshard_after_forward: true
    activation_checkpointing: false
    use_torch_compile: false
  optimizer_cfg:
    _target_: diffusionrl.train.backend.base.OptimizerConfig
    learning_rate: 3.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: 1.0e-8
    weight_decay: 0.0
  scheduler_cfg:
    _target_: diffusionrl.train.backend.base.LrSchedulerConfig
    type: constant
    warmup_steps: 0
    total_steps: 10000
  # LoRA training — synced as a MERGED full model (sync.use_merged: true), so the
  # rollout engine runs the merged weights without a separate adapter.
  lora_cfg:
    _target_: diffusionrl.train.configs.LoraConfig
    rank: 32
    alpha: 64
    dropout: 0.0
    bias: none
    task_type: FEATURE_EXTRACTION
    target_modules:
      - attn.add_k_proj
      - attn.add_q_proj
      - attn.add_v_proj
      - attn.to_add_out
      - attn.to_k
      - attn.to_out.0
      - attn.to_q
      - attn.to_v

rollout:
  _target_: diffusionrl.rollout.engine.vllm_omni.engine.VLLMOmniRolloutEngine
  model_config: ${bundle.config}
  config:
    _target_: diffusionrl.rollout.engine.vllm_omni.config.VLLMOmniEngineConfig
    model_path: ${oc.env:PRETRAINED_MODEL,stabilityai/stable-diffusion-3.5-medium}
    modality: sd35_t2i
    default_height: 512
    default_width: 512
    default_num_inference_steps: 10
    default_guidance_scale: 1.0
    default_eta: 0.7
    enable_sleep_mode: true # colocate: train + rollout time-share the GPU

reward:
  _target_: diffusionrl.reward.service_new.RewardServiceNew
  aggregation_method: mean
  executors:
    - _target_: diffusionrl.reward.base.InProcessRewardExecutor
      weight: 1.0
      scorer:
        _target_: diffusionrl.reward.scorers.pickscore.PickScoreRewardScorer
        base_device: cuda
        config:
          _target_: diffusionrl.reward.scorers.pickscore.PickScoreSpec
          weight: 1.0
          batch_size: 8
          device: auto
          processor_id: laion/CLIP-ViT-H-14-laion2B-s32B-b79K
          model_id: yuvalkirstain/PickScore_v1

algorithm:
  _target_: diffusionrl.algorithms.grpo.DiffusionGRPO
  stage_attr: diffusion
  clip_range: 1.0e-4
  clip_schedule: constant
  conditions_cls:
    _target_: hydra.utils.get_class
    path: diffusionrl.models.sd3.conditions.SD3Conditions
  params: ${sampling}

stack:
  _target_: diffusionrl.train.stack.TrainStack
  micro_batch_size: 1
  max_grad_norm: 1.0

data_source:
  _target_: diffusionrl.data.data_source.DefaultDataSource
  args: {}

sampling:
  _target_: diffusionrl.types.sampling.DiffusionSamplingParams
  num_inference_steps: 10
  guidance_scale: 1.0
  height: 512
  width: 512
  eta: 0.7
  samples_per_prompt: 16
  seed: 42
  init_same_noise: false
  autocast_precision: bf16
  trajectory_precision: bf16
  logprob_precision: fp32
  scheduler:
    _target_: diffusionrl.utils.scheduler_utils.AllSDEScheduler
    num_timesteps: ${..num_inference_steps}
    num_sde_steps: null

# LoRA → merged full-weight sync → vLLM-Omni rollout (colocate tensor-payload).
sync:
  _target_: diffusionrl.distributed.weight_sync.full.tensor.TensorWeightSync
  # Fold the trained LoRA delta into the base weights and push the merged full
  # model (we LoRA-train but serve a merged model — no separate adapter).
  use_merged: true
  bucket_size_mb: 512
  flush_cache: true
  target_modules: ["transformer"]
  # Pipeline prefix for the trained submodule's bare keys (backend.model is the
  # SD3 transformer); maps them under the receiver's transformer.* namespace.
  # Applied on both the merged (use_merged=true) and raw paths.
  param_name_prefix: "transformer."
