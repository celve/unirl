# FlowGRPO-Fast SD3 colocate reproduce — v2 trainer variant.
# Aligned with conf/experiment/flowgrpo_fast_sd3_colocate_reproduce.yaml
# (1x8 H20 colocate baseline). Diverges only on:
#   - activation_checkpointing: false (user request; reference uses bf16_full_ac)
#   - rollout engine: TrainsideRolloutEngine (v2 in-process colocate; reference uses vllm-omni)
#   - num_updates_per_batch is deferred (TrainStack is single-pass per rollout)

num_devices: 8
batch_size: 48                # prompts_per_rollout
# samples_per_prompt lives inside `sampling` (DiffusionSamplingParams).

bundle:
  _target_: diffusionrl.models.sd3.bundle.SD3Bundle.from_config
  config:
    _target_: diffusionrl.models.sd3.config.SD3PipelineConfig
    pretrained_model_ckpt_path: ${oc.env:PRETRAINED_MODEL,stabilityai/stable-diffusion-3.5-medium}
    model_precision: bf16
    autocast_precision: bf16
    trajectory_precision: bf16
    logprob_precision: fp32
    shift: 3.0

pipeline:
  _target_: diffusionrl.models.sd3.pipeline.SD3Pipeline
  shift: 3.0
  autocast_precision: bf16
  trajectory_precision: bf16
  logprob_precision: fp32
  strategy:
    _target_: diffusionrl.sde.kernels.FlowSDEStrategy

backend:
  _target_: diffusionrl.train.backend.fsdp.FSDPBackend
  block_class_names: ["JointTransformerBlock"]
  trainable_attr: transformer
  fsdp_cfg:
    _target_: diffusionrl.train.configs.FSDPConfig
    param_dtype: bf16
    cpu_offload: false
    mixed_precision: true
    fsdp_mode: full
    reshard_after_forward: true
    activation_checkpointing: false   # diverges from reference (bf16_full_ac) per user request
    use_torch_compile: false
  optimizer_cfg:
    _target_: diffusionrl.train.backend.base.OptimizerConfig
    learning_rate: 3.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: 1.0e-8
    weight_decay: 0.0
  scheduler_cfg:
    _target_: diffusionrl.train.backend.base.LrSchedulerConfig
    type: constant
    warmup_steps: 0
    total_steps: 10000
  lora_cfg:
    _target_: diffusionrl.train.configs.LoraConfig
    rank: 32
    alpha: 64
    dropout: 0.0
    bias: none
    task_type: FEATURE_EXTRACTION
    target_modules:
      - attn.add_k_proj
      - attn.add_q_proj
      - attn.add_v_proj
      - attn.to_add_out
      - attn.to_k
      - attn.to_out.0
      - attn.to_q
      - attn.to_v

rollout:
  _target_: diffusionrl.rollout.engine.trainside.engine.TrainsideRolloutEngine
  stage_attrs: [diffusion]
  # SD3 VAE decode on 96 fp32 latents at once (batch_size=48 × samples_per_prompt=16
  # / 8 devices) peaks ~24 GB on an H20 and OOMs alongside the resident text
  # encoders. Chunk forward into 16-sample groups (= samples_per_prompt so groups
  # never straddle a chunk boundary, matters once init_same_noise flips on).
  forward_batch_size: 16

reward:
  _target_: diffusionrl.reward.service.RewardService
  backend:
    _target_: diffusionrl.reward.local.pickscore.PickScoreRewardScorer
    base_device: cuda
    config:
      _target_: diffusionrl.reward.local.pickscore.PickScoreSpec
      batch_size: 8
      device: auto
      processor_id: laion/CLIP-ViT-H-14-laion2B-s32B-b79K
      model_id: yuvalkirstain/PickScore_v1

algorithm:
  _target_: diffusionrl.algorithms.grpo.DiffusionGRPO
  stage_attr: diffusion
  clip_range: 1.0e-4
  clip_schedule: constant
  conditions_cls:
    _target_: hydra.utils.get_class
    path: diffusionrl.models.sd3.conditions.SD3Conditions
  # Algorithm.compute_loss_and_backward calls stage.replay(params=self.params)
  # and needs the same guidance_scale / eta the rollout sampled with. Bind to
  # the sampling block; OmegaConf serializes a copy and the worker materializes
  # a second DiffusionSamplingParams instance per role (cheap metadata).
  params: ${sampling}

stack:
  _target_: diffusionrl.train.stack.TrainStack
  micro_batch_size: 1
  max_grad_norm: 1.0

data_source:
  _target_: diffusionrl.data.data_source.DefaultDataSource
  args: {}  # DefaultDataSource ignores args; uses hardcoded prompts

sampling:
  _target_: diffusionrl.types.sampling.DiffusionSamplingParams
  num_inference_steps: 10
  guidance_scale: 1.0
  height: 512
  width: 512
  eta: 0.7
  samples_per_prompt: 16
  seed: 42
  init_same_noise: false
  autocast_precision: bf16
  trajectory_precision: bf16
  logprob_precision: fp32
  # SDE step schedule: which denoising steps record SDE log-probs.
  # num_sde_steps: null = all steps; int = sparse subset; 0 = none (NFT).
  # A static `sde_indices: [...]` overrides this. (WindowScheduler also available.)
  scheduler:
    _target_: diffusionrl.utils.scheduler_utils.AllSDEScheduler
    num_timesteps: ${..num_inference_steps}
    num_sde_steps: null
