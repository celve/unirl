# Auxiliary committed example for grouped-YAML editing.
# Primary researcher entrypoint remains scripts/train_dancegrpo_flux_sglang_separate.sh.

model:
  model_type: flux
  pretrained_model_ckpt_path: models/local/flux.1-dev

sampling:
  sde_type: dance
  eta: 0.3
  shift: 3.0
  num_inference_steps: 25
  guidance_scale: 3.5
  timestep_fraction: 0.6
  logprob_source: replay
  height: 256
  width: 256

reward:
  reward_components: ocr

algorithm:
  algorithm_type: grpo
  prompts_per_rollout: 4
  samples_per_prompt: 4
  shuffle_seed: 42
  shuffle_samples: true
  adv_normalization_scope: group
  clip_max: 5.0
  eval_ema_decay: 0.9
  eval_ema_update_interval: 1
  algorithm_kwargs:
    clip_range: 0.0001
    use_kl_penalty: false

training:
  micro_batch_size: 1
  learning_rate: 0.00001
  max_grad_norm: 1.0
  weight_decay: 0.0001
  use_lora: true
  lora_rank: 16
  lora_alpha: 32

precision:
  model_precision: bf16
  fsdp_precision: fp32
  training_autocast_precision: bf16
  rollout_autocast_precision: bf16
  trajectory_precision: fp16
  logprob_precision: fp32

ray:
  rollout_num_gpus_per_node: 4
  training_num_gpus_per_node: 4
  placement_strategy: SPREAD

rollout:
  mode: separate
  rollout_engine: sglang
  num_gpus_per_actor: 1
  tp_size: 1
  num_rollout: 300
  save_steps: 40
  output_dir: outputs/scripts_example_flux_dancegrpo_sglang_separate

logging:
  logging_steps: 10

sync:
  protocol: tensor_payload

data_source_dotpath: diffusionrl.data.data_source.ImageRLDataSource
rollout_function_dotpath: diffusionrl.rollout.default_rollout.generate_rollout
eval_function_dotpath: diffusionrl.rollout.default_rollout.evaluate_rollout
reward_hook_dotpath: diffusionrl.rollout.default_rollout.score_rewards_hook
data_path: data/samples/ocr_prompts_toy.json
