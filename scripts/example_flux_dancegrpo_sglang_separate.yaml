# Auxiliary committed example for grouped-YAML editing.
# Primary researcher entrypoint remains scripts/train_dancegrpo_flux_sglang_separate.sh.

model:
  model_type: flux
  pretrained_model_saved_path: models/local/flux.1-dev

sampling:
  sde_type: dance
  eta: 0.3
  shift: 3.0
  num_inference_steps: 25
  guidance_scale: 3.5
  timestep_fraction: 0.6
  logprob_source: replay
  replay_log_probs: true

reward:
  reward_model_name: ocr

algorithm:
  algorithm_type: grpo
  prompts_per_rollout: 4
  samples_per_prompt: 4
  shuffle_seed: 42
  shuffle_samples: true
  adv_normalization: group
  adv_clip_abs: 5.0
  eval_ema_decay: 0.9
  eval_ema_update_interval: 1
  algorithm_kwargs:
    clip_range: 0.0001
    use_kl_penalty: false

training:
  local_micro_batch_size: 1
  learning_rate: 0.00001
  max_grad_norm: 1.0
  weight_decay: 0.0001
  use_lora: true
  lora_rank: 16
  lora_alpha: 32

precision:
  training:
    model_precision: bf16
    fsdp_precision: fp32
    autocast_precision: bf16
  rollout:
    autocast_precision: bf16
    trajectory_precision: fp16
    logprob_precision: fp32

ray:
  rollout_num_gpus_per_node: 4
  training_num_gpus_per_node: 4
  placement_strategy: SPREAD

rollout:
  topology:
    mode: separate_rollout
    service_engine: sglang
    service_num_gpus: 1
    engine_tp_size: 1
  control:
    num_rollout: 300
  artifacts:
    save_steps: 40
    output_dir: outputs/scripts_example_flux_dancegrpo_sglang_separate
  logging:
    logging_steps: 10

sync:
  protocol: tensor_payload

data_source_path: diffusionrl.data.data_source.ImageRLDataSource
rollout_function_path: diffusionrl.rollout.default_rollout.generate_rollout
eval_function_path: diffusionrl.rollout.default_rollout.evaluate_rollout
reward_hook_path: diffusionrl.rollout.default_rollout.score_rewards_hook
data_path: data/samples/ocr_prompts_toy.json
height: 256
width: 256
