# Auxiliary committed example for grouped-YAML editing.
# Primary researcher entrypoint remains scripts/train_dancegrpo_hunyuan_train_actor_sampling.sh.

model:
  model_type: hunyuan
  pretrained_model_ckpt_path: models/local/hunyuan-video

sampling:
  sde_type: dance
  eta: 0.25
  shift: 5.0
  num_inference_steps: 16
  guidance_scale: 6018.0
  timestep_fraction: 0.6
  init_same_noise: true

reward:
  reward_components: hpsv2

algorithm:
  algorithm_type: grpo
  prompts_per_rollout: 8
  samples_per_prompt: 8
  adv_normalization: group
  adv_clip_abs: 5.0
  algorithm_kwargs:
    clip_range: 0.0001
    use_kl_penalty: false

training:
  local_micro_batch_size: 1
  num_updates_per_local_batch: 1
  learning_rate: 0.00001
  max_grad_norm: 1.0
  weight_decay: 0.0001
  use_gradient_checkpointing: true

precision:
  training:
    model_precision: bf16
    fsdp_precision: fp32
    autocast_precision: bf16
  rollout:
    autocast_precision: bf16
    trajectory_precision: fp16
    logprob_precision: fp32

ray:
  rollout_num_nodes: 0
  rollout_num_gpus_per_node: 0
  training_num_gpus_per_node: 8
  placement_strategy: PACK

rollout:
  topology:
    mode: direct_sampling
  control:
    num_rollout: 202
  artifacts:
    save_steps: 50
    output_dir: outputs/scripts_example_hunyuan_dancegrpo_direct
  logging:
    logging_steps: 1

sync:
  protocol: disabled

data_source_dotpath: diffusionrl.data.data_source.ImageRLDataSource
data_path: data/samples/video_prompts_toy.txt
height: 480
width: 480
num_frames: 53
fps: 8
