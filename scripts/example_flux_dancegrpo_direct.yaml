# Auxiliary grouped-YAML example with nested subgroup overrides.
# Primary researcher entrypoint remains scripts/train_dancegrpo_flux_train_actor_sampling.sh.
# Unlike minimal_flux.yaml, this example demonstrates:
# - algorithm.window nested config
# - explicit LoRA target modules
# - eval-only rollout overrides

model:
  model_type: flux
  pretrained_model_saved_path: models/local/flux.1-dev

sampling:
  sde_type: dance
  eta: 0.3
  shift: 3.0
  num_inference_steps: 25
  guidance_scale: 3.5
  timestep_fraction: 0.6

reward:
  reward_model_name: ocr

algorithm:
  algorithm_type: grpo
  prompts_per_rollout: 1
  samples_per_prompt: 4
  adv_normalization: group
  adv_clip_abs: 5.0
  window:
    window_training: true
    timestep_strategy: window
    window_group_size: 6
    window_strategy: progressive
  algorithm_kwargs:
    clip_range: 0.0001
    use_kl_penalty: false

training:
  local_micro_batch_size: 1
  num_updates_per_local_batch: 1
  learning_rate: 0.00001
  max_grad_norm: 1.0
  weight_decay: 0.0001
  use_lora: true
  lora_rank: 16
  lora_alpha: 32
  lora_target_modules: to_q,to_k,to_v,to_out.0

precision:
  training:
    model_precision: bf16
    fsdp_precision: fp32
    autocast_precision: bf16
  rollout:
    autocast_precision: bf16
    trajectory_precision: fp16
    logprob_precision: fp32

ray:
  rollout_num_nodes: 0
  rollout_num_gpus_per_node: 0
  training_num_gpus_per_node: 4
  placement_strategy: SPREAD

rollout:
  topology:
    mode: direct_sampling
  control:
    num_rollout: 300
  artifacts:
    save_steps: 40
    output_dir: outputs/scripts_example_flux_dancegrpo_direct
  evaluation:
    eval_steps: 50
    eval_batch_size: 2
    num_inference_steps: 30
    eta: 0.2
  logging:
    logging_steps: 10
    wandb_tags: example,flux,direct

sync:
  protocol: disabled

data_source_path: diffusionrl.data.data_source.ImageRLDataSource
rollout_function_path: diffusionrl.rollout.default_rollout.generate_rollout
eval_function_path: diffusionrl.rollout.default_rollout.evaluate_rollout
reward_hook_path: diffusionrl.rollout.default_rollout.score_rewards_hook
data_path: data/samples/prompts_toy.json
eval_data_path: data/samples/prompts_toy.json
height: 256
width: 256
