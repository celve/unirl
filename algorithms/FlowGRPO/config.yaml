# ─────────────────────────────────────────────────────────────────────────────
# flowGRPO — annotated config EXTRACT (for reading, not launching).
#
# These are the two blocks that define the algorithm and the trajectory it trains
# on, lifted from the full runnable recipe:
#     recipes/diffusion_rl/sd3_trainside.yaml
# Launch that recipe to actually train (see this folder's README.md). The omitted
# blocks (bundle / pipeline / backend / rollout / reward / stack / data_source)
# are model & infrastructure, not algorithm.
# ─────────────────────────────────────────────────────────────────────────────

algorithm:
  _target_: unirl.algorithms.diffusion_grpo.DiffusionGRPO
  stage_attr: diffusion          # which pipeline stage owns replay() (the SDE forward)
  clip_range: 1.0e-4             # PPO epsilon ε: ratio is clamped to [1-ε, 1+ε].
                                 # Tiny here because a single SDE step's log-prob
                                 # moves fast; large ε would let the policy run away.
  clip_schedule: constant        # constant | linear_decay | cosine_decay (vs training_progress)
  conditions_cls:                # stage-typed prompt/condition container
    _target_: hydra.utils.get_class
    path: unirl.models.sd3.conditions.SD3Conditions
  params: ${sampling}            # GRPO replays with the SAME guidance_scale/eta the
                                 # rollout sampled with — so bind to the sampling block.

# The sampling block defines the SDE rollout GRPO trains against. In the full recipe the
# advantage subtracts each prompt group's mean reward and divides by ONE batch-wide std
# (adv_use_global_std: true); the loss is a PPO clip on the per-step SDE log-prob ratio at
# the SDE-gated steps.
sampling:
  _target_: unirl.types.sampling.DiffusionSamplingParams
  num_inference_steps: 10
  guidance_scale: 1.0
  height: 512
  width: 512
  eta: 0.7                       # > 0 ⇒ stochastic (SDE) sampling; this is what makes
                                 # per-step log-probs well-defined and trainable.
  samples_per_prompt: 16         # group size G for the GRPO advantage normalization
  seed: 42
  init_same_noise: false
  scheduler:
    _target_: unirl.utils.scheduler_utils.AllSDEScheduler
    num_timesteps: ${..num_inference_steps}
    num_sde_steps: 3             # how many steps record SDE log-probs (the trained steps)
    timestep_fraction: [0, 0.5]  # confine the SDE noise to the early, high-σ steps

# Trust region is also shaped by the train stack (from the full recipe):
#   stack.num_updates_per_batch: 2   # π_old frozen once, then 2 PPO mini-epochs
# Advantage scale (from the full recipe):
#   adv_use_global_std: true         # per-prompt group mean − one batch-wide std
