name: PR Body

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-template:
    name: Validate PR body sections
    runs-on: ubuntu-latest
    steps:
      - name: Require template sections and completed checklist
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import sys

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as event_file:
              event = json.load(event_file)

          body = event["pull_request"].get("body") or ""
          errors = []

          def get_section(heading: str) -> str:
              pattern = rf"(?ms)^{re.escape(heading)}\s*\n(?P<content>.*?)(?=^##\s+|\Z)"
              match = re.search(pattern, body)
              if not match:
                  errors.append(f"Missing required section: {heading}")
                  return ""
              return match.group("content")

          summary = re.sub(r"(?s)<!--.*?-->", "", get_section("## Summary")).strip()
          if not summary:
              errors.append("The Summary section must describe the change.")

          get_section("## Test Plan")
          checklist = get_section("## Checklist")
          checklist_items = re.findall(r"(?im)^\s*-\s+\[([ xX])\]\s+(.+?)\s*$", checklist)

          if not checklist_items:
              errors.append("The Checklist section must contain checklist items.")

          unchecked = [text for marker, text in checklist_items if marker == " "]
          if unchecked:
              errors.append("All final Checklist items must be checked:")
              errors.extend(f"- {item}" for item in unchecked)

          if errors:
              print("\n".join(errors), file=sys.stderr)
              sys.exit(1)
          PY
