# ─────────────────────────────────────────────────────────────────────────────
# flowDPPO — annotated config EXTRACT (for reading, not launching).
#
# Lifted from the full runnable recipe:
#     recipes/diffusion_rl/sd3_flowdppo.yaml
# Launch that recipe to actually train (see this folder's README.md). flowDPPO
# uses the SAME SDE rollout as flowGRPO; it only swaps the loss (KL-mask instead
# of ratio-clip) and so additionally records the per-step Gaussian means.
# ─────────────────────────────────────────────────────────────────────────────

algorithm:
  _target_: unirl.algorithms.dppo.DiffusionDPPO
  stage_attr: diffusion
  conditions_cls:
    _target_: hydra.utils.get_class
    path: unirl.models.sd3.conditions.SD3Conditions
  params: ${sampling}
  # ── Flow-DPPO loss hyperparameters ──
  kl_mask_threshold: 1.0e-5     # per-sample KL(new‖old) below this ⇒ update passes
                                 # freely (no clipping). Above it, the advantage-aware
                                 # mask may zero the update (see README).
  add_kl_coefficient: true       # normalize the KL by σ_t = std_dev_t·√(-dt), the
                                 # flow-matching step noise scale. false ⇒ raw MSE.

# Same SDE rollout as flowGRPO (eta>0, SDE steps recorded). DPPO additionally needs
# the per-step Gaussian transition means (prev_sample_means) — replay() emits them.
sampling:
  _target_: unirl.types.sampling.DiffusionSamplingParams
  num_inference_steps: 10
  guidance_scale: 1.0
  height: 512
  width: 512
  eta: 0.7                       # stochastic SDE sampling (same as flowGRPO)
  samples_per_prompt: 16
  seed: 42
  init_same_noise: false
  scheduler:
    _target_: unirl.utils.scheduler_utils.AllSDEScheduler
    num_timesteps: ${..num_inference_steps}
    num_sde_steps: 3
    timestep_fraction: [0.0, 0.5]

# Trust region (from the full recipe):
#   stack.num_updates_per_batch: 2   # KL anchor frozen once, then 2 mini-epochs
