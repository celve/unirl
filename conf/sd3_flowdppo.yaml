# Flow-DPPO SD3.5 trainside (FSDP) colocate, v2 trainer, 1x8.
# Ported from conf/experiment/flowdppo_fast_sd3_colocate.yaml.
#
# Flow-DPPO replaces PPO ratio clipping with KL-divergence-based masking:
#   - algorithm._target_ = DiffusionDPPO (vs DiffusionGRPO).
#   - kl_mask_threshold: KL threshold below which updates pass unmasked.
#   - add_kl_coefficient: normalize KL by sigma_t (flow-matching noise scale).
#   - No clip_range (replaced by KL masking). DPPO's prepare_segment replays at
#     pre-update weights to capture old means (the KL reference).
# SDE indices: sparse over the first half (timestep_fraction [0.0, 0.5], 3 steps).
#
# Faithful to v1 (vs sd3_trainside): activation_checkpointing ON (bf16_full_ac),
# micro_batch_size 8, forward_batch_size 8.
# Not carried over: v1 training.ema (full-model decay-0.99 mirror) — it was an
#   eval/export EMA; the minimal v2 trainer does no eval-EMA swap, so a mirror
#   would only double model memory unused. v1 num_updates_per_batch=2 is also
#   NOT honored (v2 TrainStack is single-pass per rollout).

num_devices: 8                # 1 node x 8 GPUs (v1 actor_count 8)
batch_size: 48                # prompts_per_rollout
num_rollouts: 10000

bundle:
  _target_: diffusionrl.models.sd3.bundle.SD3Bundle.from_config
  config:
    _target_: diffusionrl.models.sd3.config.SD3PipelineConfig
    pretrained_model_ckpt_path: ${oc.env:PRETRAINED_MODEL,stabilityai/stable-diffusion-3.5-medium}
    model_precision: bf16
    autocast_precision: bf16
    trajectory_precision: bf16
    logprob_precision: fp32
    shift: 3.0

pipeline:
  _target_: diffusionrl.models.sd3.pipeline.SD3Pipeline
  shift: 3.0
  autocast_precision: bf16
  trajectory_precision: bf16
  logprob_precision: fp32
  strategy:
    _target_: diffusionrl.sde.kernels.FlowSDEStrategy

backend:
  _target_: diffusionrl.train.backend.fsdp.FSDPBackend
  block_class_names: ["JointTransformerBlock"]
  trainable_attr: transformer
  fsdp_cfg:
    _target_: diffusionrl.train.configs.FSDPConfig
    param_dtype: bf16
    cpu_offload: false
    mixed_precision: true
    fsdp_mode: full
    reshard_after_forward: true
    activation_checkpointing: true   # v1 uses bf16_full_ac
    use_torch_compile: false
  optimizer_cfg:
    _target_: diffusionrl.train.backend.base.OptimizerConfig
    learning_rate: 3.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: 1.0e-8
    weight_decay: 0.0
  scheduler_cfg:
    _target_: diffusionrl.train.backend.base.LrSchedulerConfig
    type: constant
    warmup_steps: 0
    total_steps: 10000
  lora_cfg:
    _target_: diffusionrl.train.configs.LoraConfig
    rank: 32
    alpha: 64
    dropout: 0.0
    bias: none
    task_type: FEATURE_EXTRACTION
    target_modules:
      - attn.add_k_proj
      - attn.add_q_proj
      - attn.add_v_proj
      - attn.to_add_out
      - attn.to_k
      - attn.to_out.0
      - attn.to_q
      - attn.to_v

rollout:
  _target_: diffusionrl.rollout.engine.trainside.engine.TrainsideRolloutEngine
  stage_attrs: [diffusion]
  forward_batch_size: 8

reward:
  _target_: diffusionrl.reward.service.RewardService
  backend:
    _target_: diffusionrl.reward.local.pickscore.PickScoreRewardScorer
    base_device: cuda
    config:
      _target_: diffusionrl.reward.local.pickscore.PickScoreSpec
      batch_size: 8
      device: auto
      processor_id: laion/CLIP-ViT-H-14-laion2B-s32B-b79K
      model_id: yuvalkirstain/PickScore_v1

algorithm:
  _target_: diffusionrl.algorithms.dppo.DiffusionDPPO
  stage_attr: diffusion
  conditions_cls:
    _target_: hydra.utils.get_class
    path: diffusionrl.models.sd3.conditions.SD3Conditions
  params: ${sampling}
  # Flow-DPPO hyperparameters (v1 algorithm.algorithms.diffusion block).
  kl_mask_threshold: 1.0e-5
  add_kl_coefficient: true

stack:
  _target_: diffusionrl.train.stack.TrainStack
  micro_batch_size: 8
  max_grad_norm: 1.0

data_source:
  _target_: diffusionrl.data.data_source.DefaultDataSource
  args: {}

sampling:
  _target_: diffusionrl.types.sampling.DiffusionSamplingParams
  num_inference_steps: 10
  guidance_scale: 1.0
  height: 512
  width: 512
  eta: 0.7
  samples_per_prompt: 16
  seed: 42
  init_same_noise: false
  autocast_precision: bf16
  trajectory_precision: bf16
  logprob_precision: fp32
  scheduler:
    _target_: diffusionrl.utils.scheduler_utils.AllSDEScheduler
    num_timesteps: ${..num_inference_steps}
    timestep_fraction: [0.0, 0.5]   # SDE steps drawn from the first half (v1)
    num_sde_steps: 3

logging:
  report_to_wandb: ${oc.decode:${oc.env:REPORT_TO_WANDB,true}}
  project_name: ${oc.env:WANDB_PROJECT,diffusionrl-flow-dppo}
  run_name: ${oc.env:WANDB_RUN_NAME,sd3_flowdppo}
  entity: ${oc.env:WANDB_ENTITY,null}
  tags: ["sd3.5", "dppo", "flow-dppo", "kl-adv", "trainside", "v2"]
  log_media: false
  media_max_items: 8
  media_log_interval: 1
