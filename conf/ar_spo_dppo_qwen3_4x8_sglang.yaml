# AR SPO-DPPO Qwen3-8B on GSM8K — v2 trainer (VLMTrainer), SGLang rollout, 4x8 = 32 GPU.
#
# SGLang-rollout variant of conf/ar_spo_dppo_qwen3_4x8.yaml (trainside). Same
# model / algorithm / reward / FSDP+LoRA knobs; the ONLY differences are the
# rollout engine and the weight-sync block:
#
#   trainside  →  SGLangLLMRolloutEngine (colocate, time-shares each GPU with the
#                 FSDP train shard via sleep()/wake_up()).
#   no sync    →  TensorWeightSync(use_merged): each rollout folds the trained
#                 LoRA delta into the base and pushes the merged full Qwen3 to the
#                 SGLang server, so generation tracks the trained policy.
#
# Matching the trainside curve hinges on the sampling + chat template being
# identical to trainside: the engine threads top_k (without it SGLang uses the
# model-default top_k=20, collapsing GRPO group diversity) and applies the
# /no_think system message + enable_thinking=False (else Qwen3 over-runs
# max_new_tokens before the #### answer).
#
# Run:
#   QWEN3_PATH=/root/sync/models/Qwen3-8B DATA_PATH=/root/sync/datasets/gsm8k/train.jsonl \
#   python -m unirl.train_vlm --config-name=ar_spo_dppo_qwen3_4x8_sglang num_devices=32

num_devices: 32
batch_size: 32 # prompts_per_rollout
num_rollouts: 100
weight_sync_interval: 1 # sync the merged adapter into SGLang every rollout

# VLMTrainer advantage scope. v1 used group + use_global_std=true; the v2
# RolloutTrack.compute_advantages has no use_global_std, so "group" = per-group
# mean/std (closest match).
adv_normalization_scope: group

logging:
  report_to_wandb: true
  project_name: unirl-spo-dppo
  run_name: ar_spo_dppo_qwen3-8b_4x8_v2_sglang
  entity: diffusionrl-reproduce
  tags: [spo-dppo, qwen3, gsm8k, 4x8, v2, sglang]

bundle:
  _target_: unirl.models.qwen3.bundle.Qwen3Bundle.from_config
  config:
    _target_: unirl.models.qwen3.config.Qwen3PipelineConfig
    pretrained_model_ckpt_path: ${oc.env:QWEN3_PATH,/root/sync/models/Qwen3-8B}
    model_precision: bf16
    autocast_precision: bf16
    logprob_precision: fp32
    use_gradient_checkpointing: true

pipeline:
  # from_bundle shares the trainer-injected bundle (from_config would load a 2nd
  # copy). system_instruction=/no_think suppresses Qwen3's thinking mode.
  _target_: unirl.models.qwen3.pipeline.Qwen3Pipeline.from_bundle
  system_instruction: /no_think
  autocast_precision: bf16
  logprob_precision: fp32

backend:
  _target_: unirl.train.backend.fsdp.FSDPBackend
  block_class_names: ["Qwen3DecoderLayer"]
  trainable_attr: transformer
  fsdp_cfg:
    _target_: unirl.train.configs.FSDPConfig
    param_dtype: bf16
    cpu_offload: false
    mixed_precision: true
    fsdp_mode: full
    reshard_after_forward: false # #155: params stay gathered → 16.7x rollout speedup
    activation_checkpointing: true
    use_torch_compile: false
  optimizer_cfg:
    _target_: unirl.train.backend.base.OptimizerConfig
    learning_rate: 1.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: 1.0e-8
    weight_decay: 0.0
  scheduler_cfg:
    _target_: unirl.train.backend.base.LrSchedulerConfig
    type: constant
    warmup_steps: 0
    total_steps: 1000
  lora_cfg:
    _target_: unirl.train.configs.LoraConfig
    rank: 16
    alpha: 32
    dropout: 0.0
    bias: none
    task_type: CAUSAL_LM
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj

rollout:
  # SGLang LLM engine, colocate (time-shares each GPU with the FSDP train shard
  # via sleep()/wake_up() → release/resume_memory_occupation). tp_size=1 → one
  # single-GPU engine per rank, data-parallel across 32 ranks (mirrors trainside).
  _target_: unirl.rollout.engine.sglang_llm.engine.SGLangLLMRolloutEngine
  config:
    _target_: unirl.rollout.engine.sglang_llm.config.SGLangLLMEngineConfig
    pretrained_model_ckpt_path: ${oc.env:QWEN3_PATH,/root/sync/models/Qwen3-8B}
    tp_size: 1
    max_new_tokens: 128
    temperature: 0.7
    top_p: 0.9
    concurrency: 16
    # VLMTrainer pre-expands the req by samples_per_prompt (32→512), so the
    # engine emits one completion per entry (n=1); else samples double-count.
    samples_pre_expanded: true
    # Match the trainside Qwen3 chat template EXACTLY (qwen3/chat_template.py):
    # /no_think system message + enable_thinking=false, else Qwen3 emits a long
    # <think> block that overruns max_new_tokens=128 before the #### answer →
    # reward stuck at ~0. This is what made generation differ from trainside.
    system_instruction: /no_think
    chat_template_kwargs:
      enable_thinking: false
    engine_kwargs:
      # colocate on a 95 GiB H20: the FSDP train process holds ~54 GiB (gathered
      # 8B + merged-weight sync buffer + replay activations), so SGLang must fit
      # in the rest. 0.45 (~39 GiB) → 54+39 = 93.6, leaving only ~1 GiB → a
      # slightly larger decode batch OOM-killed the scheduler at rollout 46.
      # 0.3 (~28 GiB) → 82 GiB peak, ~13 GiB headroom; KV pool ~12 GiB is ample
      # for 16 samples/rank × ~230 tokens.
      mem_fraction_static: 0.3
      skip_server_warmup: true
      # LoRA-pool sync (set_lora_from_tensors → /load_lora_adapter_from_tensors):
      # the SGLang LoRA backend rides the triton attention path. This is the
      # combination that reproduces the trainside curve to ~0.70.
      attention_backend: triton
      enable_lora: true
      max_lora_rank: 16
      lora_target_modules: [q_proj, k_proj, v_proj, o_proj]
      max_loaded_loras: 8

reward:
  _target_: unirl.reward.service.RewardService
  backend:
    _target_: unirl.reward.local.gsm8k_exact_match.GSM8KExactMatchRewardScorer
    base_device: cpu
    config:
      _target_: unirl.reward.local.gsm8k_exact_match.GSM8KExactMatchSpec

algorithm:
  _target_: unirl.algorithms.spo_dppo.ARSPODPPO
  stage_attr: ar # resolves stage from the trainer-injected pipeline (.ar)
  variant: tv
  clip_divergence: 0.2
  clip_ratio_c: 20.0
  # 0.7 — same as trainside, and as sampling.temperature below. Our SGLang server
  # runs with SGLANG_RETURN_ORIGINAL_LOGPROB unset (default False) and no
  # rl_on_policy_target, so the sampler's standard path returns the TEMPERED logp
  # — log_softmax(logits / temperature) — in output_token_logprobs (see
  # sglang/srt/layers/sampler.py). replay must therefore temper at the same 0.7 so
  # old_logp (SGLang) and new_logp (replay) live on the same distribution. (Verify
  # on the GPU run: ratio_mean should sit ≈1.)
  sampling_temperature: 0.7
  conditions_cls:
    _target_: hydra.utils.get_class
    path: unirl.models.qwen3.conditions.Qwen3ARConditions

# LoRA-pool sync: extract the trained LoRA tensors from the FSDP model and
# hot-load them into the SRT server as an adapter (POST
# /load_lora_adapter_from_tensors); generation routes via lora_path. This is the
# sync path that reproduces the trainside curve — the merged full-weight path
# (TensorWeightSync) plateaus at ~0.2 (does NOT reproduce). param_prefix=""
# sends HF-native keys; verify is vLLM-Omni-only → false.
sync:
  _target_: unirl.distributed.weight_sync.lora.LocalLoraWeightSync
  param_prefix: ""
  adapter_name: default
  verify: false

stack:
  _target_: unirl.train.stack.TrainStack
  micro_batch_size: 16 # per-worker shard = 512/32 = 16
  max_grad_norm: 1.0

data_source:
  _target_: unirl.data.data_source.MultimodalRLDataSource
  args:
    run:
      data_path: ${oc.env:DATA_PATH,/root/sync/datasets/gsm8k/train.jsonl}
      eval_data_path: ${oc.env:EVAL_DATA_PATH,/root/sync/datasets/gsm8k/train.jsonl}
      seed: 42
    algorithm:
      prompts_per_rollout: 32 # 32 prompts x 16 samples = 512 / rollout

sampling:
  _target_: unirl.types.sampling.ARSamplingParams
  samples_per_prompt: 16
  temperature: 0.7
  top_p: 0.9
  top_k: 0
  max_new_tokens: 128
