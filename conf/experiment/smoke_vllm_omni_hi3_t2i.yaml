# @package _global_
# Smoke experiment for the new RolloutReq/RolloutResp rollout-side stack.
#
# Workload: 48 prompts × 16 samples per prompt = 768 samples.
# Engine: vllm-omni HunyuanImage-3 t2i.
# Placement: 1 rollout actor on 8 H20s (NOSET multi-GPU).
#
# This config is consumed by scripts/smoke_new_rollout_group_e2e.py — NOT by
# train.py. It composes only the rollout-side sections the smoke needs;
# train-side sections inherit defaults (and are not exercised because the
# smoke never bootstraps a TrainActorGroup).
defaults:
  - override /algorithm: grpo
  - override /model: hunyuan_image3_v2
  - override /rollout/engine: vllm_omni
  - override /sampling/sde_strategy: flow
  - _self_

run:
  seed: 42
  # Smoke uses an in-script hardcoded data source; these paths are never read,
  # but cfg.run requires them to be set for MultimodalRLDataSource fallback paths.
  data_path: /tmp/smoke_unused.txt
  eval_data_path: /tmp/smoke_unused.txt

sampling:
  num_inference_steps: 16
  guidance_scale: 2.5
  height: 1024
  width: 1024
  seed: 42
  init_same_noise: false
  sde_config:
    eta: 1.0

algorithm:
  prompts_per_rollout: 48
  samples_per_prompt: 16
  adv_normalization_scope: group
  use_global_std: true
  clip_range: 1.0e-4
  clip_schedule: constant
  use_kl_penalty: false
  kl_coef: 0.0
  scheduler:
    timestep_fraction: [0.0, 1.0]
    num_sde_steps: 16
  sde_config:
    eta: ${sampling.sde_config.eta}

model:
  pretrained_model_ckpt_path: /dockerdata/HunyuanImage-3-Instruct
  model_precision: bf16
  autocast_precision: bf16
  trajectory_precision: fp16
  logprob_precision: fp32
  guidance_scale: 2.5

rollout:
  engine:
    model_path: /dockerdata/HunyuanImage-3-Instruct
    modality: t2i
    default_height: 1024
    default_width: 1024
    default_num_inference_steps: 16
    default_guidance_scale: 2.5
    default_eta: 1.0
  plan:
    # Calibration knob — set via FBS env var on the smoke launcher.
    forward_batch_size: ${oc.decode:${oc.env:FBS,4}}

placement:
  num_rollout_nodes: 1
  num_rollout_gpus_per_node: 8
  num_rollout_gpus_per_actor: 8       # one big actor on all 8 H20s (NOSET)
  num_train_nodes: 1                  # placeholder — TrainActorGroup not bootstrapped
  num_train_gpus_per_node: 1
  num_train_gpus_per_actor: 1
  colocate: true                      # so total_gpus = max(8, 1) = 8
  colocate_gpu_fraction: 0.5
  strategy: PACK
  allow_noset_multi_gpu_inference: true

reward:
  aggregation_method: mean
  base_device: cuda
  components:
    - name: pickscore
      weight: 1.0
      batch_size: 8

# Train-side sections kept at defaults — the smoke does not call them. The
# composed cfg has training.* slots from train.yaml's defaults; they're not
# read by NewRolloutActor or NewRolloutPipeline.
training:
  plan:
    micro_batch_size: 8
    num_updates_per_batch: 1
    local_mini_batch_size: 768
    local_batch_size: 768
    global_batch_size: 768
  topology:
    actor_count: 1
  optimizer:
    learning_rate: 1.0e-4
  execution:
    offload_train: false
    offload_rollout: false

logging:
  logging_steps: 1
  log_media: false
  report_to_wandb: false

evaluation:
  eval_steps: 0
