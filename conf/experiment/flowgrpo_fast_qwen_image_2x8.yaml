# @package _global_
# FlowGRPO-Fast Qwen-Image, 2 nodes x 8 GPUs.
#
# This file owns the 2x8 training geometry. Launch scripts should only
# provide environment/runtime values and select this experiment.
defaults:
  - flowgrpo_fast_qwen_image
  - override /placement: trainside_2x8
  - _self_

sampling:
  samples_per_prompt: 12
  height: 256
  width: 256

algorithm:

rollout:
  plan:
    forward_batch_size: 1

training:
  plan:
    global_batch_size: 576
    local_batch_size: 36
    local_mini_batch_size: 18
  topology:
    actor_count: 16

logging:
  run_name: ${oc.env:WANDB_RUN_NAME,Qwen-Image-FlowGRPO-2x8}
  tags: [qwen-image, t2i, grpo, flowgrpo, newstack, 2x8]

resume:
  output_dir: ${oc.env:OUTPUT_DIR,outputs/flowgrpo_fast_qwen_image_2x8}
