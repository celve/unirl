# @package _global_
# GRPO WAN 2.2 T2V 14B recipe — dual-transformer architecture.
#
# Wan2.2-T2V uses two WanTransformer3DModel instances:
#   - transformer: high-noise stage (t >= boundary_timestep)
#   - transformer_2: low-noise refinement (t < boundary_timestep)
#
# Both transformers are trained via FSDP2 wrapping of the composite
# WanDualTransformer module.
#
# Usage:
#   python -m diffusionrl.main --config-name grpo_wan22_t2v_14b
#
defaults:
  - override /algorithm: grpo
  - override /model: wan22
  - override /sampling/sde_strategy: flow
  - _self_

run:
  data_source_dotpath: diffusionrl.data.data_source.ImageRLDataSource
  num_rollouts: 1000
  data_path: ${oc.env:DATA_PATH}
  eval_data_path: ${oc.env:EVAL_DATA_PATH,${oc.env:DATA_PATH}}

sampling:
  num_inference_steps: 20
  guidance_scale: 1.0
  # guidance_scale_2: 1.0
  height: 480
  width: 640
  num_frames: 1
  sde_config:
    eta: 0.7
    shift: 5.0



algorithm:
  prompts_per_rollout: 48
  samples_per_prompt: 16
  adv_normalization_scope: group
  use_global_std: true
  clip_range: 1.0e-4
  clip_schedule: constant
  use_kl_penalty: false
  kl_coef: 0.0
  ema:
    eval_ema_decay: 0.9
    eval_ema_update_interval: 1
  scheduler:
    timestep_fraction: [0.0, 0.2]
  sde_config:
    eta: ${sampling.sde_config.eta}
    shift: ${sampling.sde_config.shift}

placement:
  num_rollout_nodes: 0
  num_rollout_gpus_per_node: 0

rollout:
  plan:
    forward_batch_size: 1

training:
  plan:
    micro_batch_size: 1
    num_updates_per_batch: 2
    local_mini_batch_size: 48
    local_batch_size: 96
    global_batch_size: 768
  topology:
    actor_count: 8                # 1 node × 8 GPUs
  optimizer:
    learning_rate: 3.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: 1.0e-8
    weight_decay: 0.0
  lr_scheduler:
    type: constant
    warmup_steps: 0
    total_steps: 1000
  execution:
    max_grad_norm: 1.0
    offload_train: false
    offload_rollout: false

model:
  use_lora: true
  lora_rank: 64
  lora_alpha: 128
  use_gradient_checkpointing: true
  pretrained_model_ckpt_path: ${oc.env:PRETRAINED_MODEL,Wan-AI/Wan2.2-T2V-A14B-Diffusers}
  boundary_ratio: 0.875
  num_train_timesteps: 1000

reward:
  aggregation_method: mean
  base_device: cuda
  components:
    - name: video
      weight: 1.0
      batch_size: 8
      inner_model_name: pickscore
      temporal_weight: 0.3
      alignment_weight: 0.7
      sample_frames: 1

logging:
  logging_steps: 1
  log_media: true
  media_max_items: 8
  report_to_wandb: true
  project_name: diffusionrl-grpo-t2v
  run_name: grpo_wan22_t2v
  tags: [wan22, t2v, grpo, video, pickscore, dual-transformer]

evaluation:
  eval_steps: 60

resume:
  save_steps: 60
