# @package _global_
# FlowGRPO-Fast Qwen-Image recipe — direct-sampling on the NEW Policy stack.
#
# Mirror of conf/experiment/flowgrpo_fast_qwen_image.yaml (PR #104 OLD)
# mapped onto the new-stack shape:
#   - ``rollout/engine: trainside`` (no separate rollout actor; train
#     actors host a TrainsideRolloutEngine that wraps the FSDP-wrapped
#     bundle).
#   - ``cfg.training.policies: [LoRA, FSDP, EMA]`` — LoRA injection,
#     FSDP wrap, and EMA shadow live OUTSIDE the bundle (vs the OLD
#     QwenImageModelBundle.load() doing it inline).
#   - ``cfg.algorithms.image: DiffusionGRPO`` — slot-keyed, replays
#     the rollout's SDE transitions via QwenImageDiffusionStage.replay
#     to recompute log-probs.
#
# Anchored to a 1-node × 8-GPU pod (8 actors). Math:
#   global_batch     = prompts_per_rollout * samples_per_prompt = 48*16 = 768
#   local_batch_size = global / actor_count = 768 / 8 = 96
#   local_mini_batch = local / num_updates_per_batch = 96 / 2 = 48
#   micro_batch_size = 1   — Qwen-Image bundle is large; activations under
#                            full-graph replay OOM 96GB pods even with LoRA.
#
# σ schedule: Qwen-Image's scheduler_config.json ships with
# ``use_dynamic_shifting: True`` + base/max_shift + base/max_image_seq_len.
# FlowMatchSchedulePolicy.from_pretrained picks up the dynamic branch
# automatically when the engine builds the policy; cfg.model.shift is
# only used as a fallback if the pretrained path resolves to an HF
# repo ID (not a local dir).
#
# Launch:
#   python -m diffusionrl.train_new +experiment=flowgrpo_fast_qwen_image_new
defaults:
  - override /algorithm: grpo
  - override /model: qwen_image_v2
  - override /rollout/engine: trainside
  - override /sampling/sde_strategy: flow
  - _self_

run:
  seed: 42
  num_rollouts: 10000
  data_source_dotpath: diffusionrl.data.data_source.MultimodalRLDataSource
  data_path: ${oc.env:DATA_PATH,/mnt/bj/data/datasets/pickscore/train.txt}
  eval_data_path: ${oc.env:EVAL_DATA_PATH,/mnt/bj/data/datasets/pickscore/test.txt}

sampling:
  num_inference_steps: 12
  guidance_scale: 1.0
  height: 384
  width: 384
  seed: 42
  init_same_noise: false
  sde_config:
    eta: 0.7

algorithm:
  # Driver-side singular: feeds prompt batching, SDE-index scheduling,
  # and sampling scalars. NewTrainActor reads the plural `algorithms`
  # block below; the two are kept aligned but distinct.
  prompts_per_rollout: 48
  samples_per_prompt: 16
  adv_normalization_scope: group
  use_global_std: true
  clip_range: 1.0e-4
  clip_schedule: constant
  use_kl_penalty: true
  kl_coef: 0.0
  ema:
    eval_ema_decay: 0.99
    eval_ema_update_interval: 2
  scheduler:
    timestep_fraction: [0.0, 0.5]
    num_sde_steps: 3
  sde_config:
    eta: ${sampling.sde_config.eta}

model:
  # qwen_image_v2 (QwenImagePipelineConfig) is weights+params only —
  # LoRA, gradient checkpointing, and FSDP knobs live in
  # training.policies below.
  pretrained_model_ckpt_path: ${oc.env:QWEN_IMAGE_PATH,Qwen/Qwen-Image}
  model_precision: bf16
  autocast_precision: bf16
  trajectory_precision: bf16
  logprob_precision: fp32
  max_sequence_length: 512
  shift: 3.0

rollout:
  engine: {}
  plan:
    forward_batch_size: 1

placement:
  num_rollout_nodes: 1
  num_rollout_gpus_per_node: 8
  num_rollout_gpus_per_actor: 1
  num_train_nodes: 1
  num_train_gpus_per_node: 8
  num_train_gpus_per_actor: 1
  colocate: true
  colocate_gpu_fraction: 0.9
  strategy: PACK

# ----------------------------------------------------------------------
# New-stack training surface
# ----------------------------------------------------------------------
algorithms:
  # Slot ``image`` matches RolloutResp.rollout_traces["image"] on
  # Qwen-Image. ``stage_attr: diffusion`` points the algorithm at the
  # right stage on QwenImagePipeline.
  image:
    _target_: diffusionrl.algorithms_new.grpo.DiffusionGRPO
    stage_attr: diffusion
    clip_range: 1.0e-4
    clip_schedule: constant
    conditions_cls: diffusionrl.models_new.qwen_image.conditions.QwenImageConditions
    params:
      _target_: diffusionrl.models_new.qwen_image.diffusion.QwenImageDiffusionParams
      num_inference_steps: ${sampling.num_inference_steps}
      guidance_scale: ${sampling.guidance_scale}
      height: ${sampling.height}
      width: ${sampling.width}
      seed: ${run.seed}
      eta: ${sampling.sde_config.eta}
      init_same_noise: ${sampling.init_same_noise}
      samples_per_prompt: ${algorithm.samples_per_prompt}
      noise_group_ids: null
      # sde_indices: null — resolved per-rollout by NewRolloutPipeline.
      distilled_guidance_scale: null

training:
  policy_source: diffusion
  policies:
    # LoRA injected first (closest to the bundle), then FSDP wraps the
    # adapted module. Targets mirror QwenImageModelBundle
    # .default_lora_target_modules() (PR #104) — Qwen-Image's
    # transformer uses a different attn naming than SD3, with separate
    # img_mlp and txt_mlp residual blocks.
    - _target_: diffusionrl.training_new.lora_policy.LoRAPolicy
      rank: 64
      alpha: 128
      dropout: 0.0
      target_modules:
        - to_q
        - to_k
        - to_v
        - to_out.0
        - add_q_proj
        - add_k_proj
        - add_v_proj
        - to_add_out
        - img_mlp.net.0.proj
        - img_mlp.net.2
        - txt_mlp.net.0.proj
        - txt_mlp.net.2
    - _target_: diffusionrl.training_new.fsdp_policy.FSDPPolicy
      cpu_offload: false
      param_dtype: bf16
      mixed_precision: true
      fsdp_mode: full
      reshard_after_forward: true
      # Qwen-Image replay rebuilds the full forward graph for autograd;
      # the transformer is larger than SD3 so AC is on by default.
      activation_checkpointing: true
    - _target_: diffusionrl.training_new.ema_policy.EMAPolicy
      decay: 0.99
      update_step_interval: 2
  materialize:
    # Qwen-Image has a single text encoder (Qwen2.5-VL) — no _2/_3
    # siblings like SD3.
    with_aux: [vae, text_encoder]
  plan:
    micro_batch_size: 1
    num_updates_per_batch: 2
    local_mini_batch_size: 48
    local_batch_size: 96
    global_batch_size: 768
  topology:
    actor_count: 8
  optimizer:
    learning_rate: 3.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: 1.0e-8
    weight_decay: 0.0
  lr_scheduler:
    type: constant
    warmup_steps: 0
    total_steps: 10000
  execution:
    max_grad_norm: 1.0
    offload_train: false
    offload_rollout: false

reward:
  aggregation_method: mean
  base_device: cuda
  components:
    - name: pickscore
      weight: 1.0
      batch_size: 8

logging:
  logging_steps: 1
  log_media: false
  media_max_items: 8
  report_to_wandb: true
  project_name: diffusionrl-flowgrpo-newstack
  run_name: flowgrpo_fast_qwen_image_new
  tags: [qwen-image, t2i, grpo, flowgrpo, newstack]

evaluation:
  eval_steps: 0
