# @package _global_
# GRPO WAN 2.1 T2V recipe — direct-sampling (fsdp engine) GRPO on WAN T2V 1.3B
# with LoRA + video reward (pickscore inner) and PPO-style multi-update epochs.
#
# Translates the legacy launcher
#   scripts/wan/train_grpo_wan21_t2v_multinode.sh
# into LIN-185's per-experiment Hydra recipe pattern. Anchored to a single-node
# 8-GPU cluster (8 train actors). Override topology + plan via CLI for larger
# shapes (e.g. 2 nodes: training.topology.actor_count=16,
# training.plan.local_mini_batch_size=24, .local_batch_size=48).
defaults:
  - override /algorithm: grpo
  - override /model: wan21
  - override /sampling/sde_strategy: flow
  - _self_

run:
  data_source_dotpath: diffusionrl.data.data_source.MultimodalRLDataSource
  num_rollouts: 1000
  data_path: ${oc.env:DATA_PATH}
  eval_data_path: ${oc.env:EVAL_DATA_PATH,${oc.env:DATA_PATH}}

sampling:
  num_inference_steps: 14
  guidance_scale: 1.0
  height: 720
  width: 1280
  # 3 frames maps to a single latent frame (temporal_downsample=4) — fast
  # iteration recipe that exercises the full T2V pipeline without the cost of
  # long videos. Bump `num_frames` for actual video training.
  num_frames: 3
  sde_config:
    eta: 0.7
    shift: 5.0

algorithm:
  prompts_per_rollout: 48
  samples_per_prompt: 16
  adv_normalization_scope: group
  use_global_std: true
  clip_range: 1.0e-4
  clip_schedule: constant
  use_kl_penalty: false
  kl_coef: 0.0
  ema:
    eval_ema_decay: 0.9
    eval_ema_update_interval: 1
  scheduler:
    timestep_fraction: [0.0, 0.5]
  # Bind GRPO's SDE math params to sampling.sde_config so train-side log_prob
  # replay uses the same eta/shift as the rollout sampler.
  sde_config:
    eta: ${sampling.sde_config.eta}
    shift: ${sampling.sde_config.shift}

placement:
  # Direct-sampling: train actors also sample; no separate rollout actor.
  num_rollout_nodes: 0
  num_rollout_gpus_per_node: 0

rollout:
  plan:
    # Direct-sampling per-call chunk size (legacy: SAMPLING_FORWARD_BATCH).
    # Caps the per-actor activation footprint during 720p×1280 generate.
    forward_batch_size: 4

training:
  plan:
    # Anchored to 1 node × 8 GPUs = 8 train actors.
    # global = prompts_per_rollout * samples_per_prompt = 48 * 16 = 768.
    micro_batch_size: 1
    num_updates_per_batch: 2
    local_mini_batch_size: 48     # = global / actor_count / num_updates = 768/8/2
    local_batch_size: 96          # = local_mini_batch_size * num_updates_per_batch
    global_batch_size: 768        # = prompts_per_rollout * samples_per_prompt
  topology:
    actor_count: 8                # 1 node × 8 GPUs
  optimizer:
    learning_rate: 3.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: 1.0e-8
    weight_decay: 0.0
  lr_scheduler:
    type: constant
    warmup_steps: 0
    total_steps: 1000
  execution:
    max_grad_norm: 1.0
    offload_train: false
    offload_rollout: false

model:
  use_lora: true
  lora_rank: 64
  lora_alpha: 128
  use_gradient_checkpointing: true
  pretrained_model_ckpt_path: ${oc.env:PRETRAINED_MODEL,Wan-AI/Wan2.1-T2V-1.3B-Diffusers}

reward:
  aggregation_method: mean
  base_device: cuda
  components:
    # `video` wraps a frame-level scorer (pickscore by default) with a
    # temporal-consistency term — the LIN-185 equivalent of the legacy
    # `videopickscore` reward.
    #
    # ``sample_frames=1`` selects only the first frame for PickScore. With
    # ``num_frames=3 → 1 latent frame → 1 decoded frame``, sampling more is
    # wasted compute (linspace would map every index to frame 0 anyway). The
    # temporal term collapses to a constant 1.0 with one frame; group z-score
    # subtracts that constant out, so the alignment_weight/temporal_weight
    # ratio doesn't affect advantages here.
    - name: video
      weight: 1.0
      batch_size: 8
      inner_model_name: pickscore
      temporal_weight: 0.3
      alignment_weight: 0.7
      sample_frames: 1

logging:
  logging_steps: 1
  log_media: true
  media_max_items: 8
  report_to_wandb: true
  project_name: diffusionrl-grpo-t2v
  run_name: grpo_wan_t2v
  tags: [wan21, t2v, grpo, video, pickscore]

evaluation:
  eval_steps: 60

resume:
  save_steps: 60
