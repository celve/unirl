# @package _global_
# HI3-Instruct think_recaption RL — COLOCATE, 1-node 8-GPU.
#
# Full e2e on-policy training:
#   rollout → reward → train (AR+Diffusion GRPO) → weight sync (ipc_bucketed)
#
# Layout:
#   - 1 vllm-omni rollout actor on 8 GPUs (NOSET: AR TP=4 + DiT TP=4)
#   - 8 FSDP DP=8 train actors (1 GPU each, colocated)
#   - ipc_bucketed sync (ZMQ + cudaIpcGetMemHandle, no UUID dependency)
#   - offload_rollout: true (sleep vllm-omni during train)
#
# Single track ("image") hosts both DiffusionGRPO + ARGRPO on a shared LoRA.
defaults:
  - /training/track@training.tracks.image: default
  - /model@training.tracks.image.model: hunyuan_image3
  - /training/fsdp@training.tracks.image.fsdp: bf16_full_ac
  - /sync@sync: ipc_bucketed
  - override /algorithm: grpo
  - override /model: hunyuan_image3
  - override /rollout/engine: vllm_omni
  - override /sampling/sde_strategy: flow
  - override /training/execution: offload_both
  - _self_

run:
  data_source_dotpath: diffusionrl.data.data_source.MultimodalRLDataSource
  num_rollouts: 1000
  seed: 42
  data_path: /root/diffusionrl/data/datasets/pickscore/train.txt
  eval_data_path: /root/diffusionrl/data/datasets/pickscore/test.txt
  weight_sync_interval: 1

sampling:
  samples_per_prompt: 8
  num_inference_steps: 16
  guidance_scale: 1.0
  height: 1024
  width: 1024
  init_same_noise: false
  eta: 1.0

algorithm:
  prompts_per_rollout: 1
  adv_normalization_scope: global
  use_global_std: true
  kl_coef: 0.0
  scheduler:
    timestep_fraction: [0.0, 1.0]
    num_sde_steps: 16
  algorithms:
    image:
      name: diffusion_grpo
      stage_attr: diffusion
      conditions_cls: diffusionrl.models.hunyuan_image3.conditions.HunyuanImage3DiffusionConditions
      clip_range: 1.0e-4
      clip_schedule: constant
      params:
        _target_: diffusionrl.types.sampling.DiffusionSamplingParams
        num_inference_steps: ${sampling.num_inference_steps}
        guidance_scale: ${sampling.guidance_scale}
        height: ${sampling.height}
        width: ${sampling.width}
        seed: ${run.seed}
        sde_indices: null
        eta: ${sampling.eta}
        init_same_noise: ${sampling.init_same_noise}
        samples_per_prompt: ${sampling.samples_per_prompt}
        noise_group_ids: null
    ar:
      name: ar_grpo
      stage_attr: ar
      conditions_cls: diffusionrl.models.hunyuan_image3.conditions.HunyuanImage3ARConditions
      clip_range: 1.0e-4
      clip_schedule: constant

model:
  _target_: diffusionrl.models.hunyuan_image3.HunyuanImage3Pipeline.from_meta_config
  pretrained_model_ckpt_path: /root/HunyuanImage-3-Instruct
  model_precision: bf16
  autocast_precision: bf16
  trajectory_precision: fp16
  logprob_precision: fp32
  guidance_scale: 1.0

rollout:
  engine:
    model_path: /root/HunyuanImage-3-Instruct
    modality: t2i_think_recaption
    default_height: 1024
    default_width: 1024
    default_num_inference_steps: 16
    default_guidance_scale: 1.0
    default_eta: 1.0
    default_ar_max_tokens: 4096
    default_ar_temperature: 0.6
    default_ar_top_p: 0.95
    default_ar_top_k: 1024
  plan:
    forward_batch_size: ${oc.decode:${oc.env:FBS,1}}

placement:
  num_rollout_nodes: 1
  num_rollout_gpus_per_node: 8
  num_rollout_gpus_per_actor: 8
  num_train_nodes: 1
  num_train_gpus_per_node: 8
  num_train_gpus_per_actor: 1
  colocate: true
  colocate_gpu_fraction: 0.5
  strategy: PACK
  allow_noset_multi_gpu_inference: true

training:
  primary_track: image
  tracks:
    image:
      model:
        _target_: diffusionrl.models.hunyuan_image3.HunyuanImage3Pipeline.from_meta_config
        pretrained_model_ckpt_path: /root/HunyuanImage-3-Instruct
        model_precision: bf16
        autocast_precision: bf16
        trajectory_precision: fp16
        logprob_precision: fp32
        guidance_scale: 1.0
      source_stage_attr: diffusion
      algorithm_keys: [image, ar]
      lora:
        rank: 8
        alpha: 16
        dropout: 0.0
        bias: none
        task_type: FEATURE_EXTRACTION
        target_modules:
          - qkv_proj
          - o_proj
      optimizer:
        learning_rate: 1.0e-4
        adam_beta1: 0.9
        adam_beta2: 0.999
        adam_epsilon: 1.0e-8
        weight_decay: 0.0
      lr_scheduler:
        type: constant
        warmup_steps: 0
        total_steps: 100
  topology:
    actor_count: 8
  plan:
    micro_batch_size: 1
    num_updates_per_batch: 1
    local_mini_batch_size: 1
    local_batch_size: 1
    global_batch_size: 8
  materialize:
    with_aux: []

reward:
  aggregation_method: mean
  base_device: cuda
  components:
    pickscore:
      weight: 1.0
      batch_size: 4
      model_id: /root/yuvalkirstain/PickScore_v1
      processor_id: /root/yuvalkirstain/PickScore_v1

logging:
  logging_steps: 1
  log_media: false
  report_to_wandb: false

evaluation:
  eval_steps: 0
