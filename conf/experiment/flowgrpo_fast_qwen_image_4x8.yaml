# @package _global_
# FlowGRPO-Fast Qwen-Image, 4 nodes x 8 GPUs.
#
# This file owns the 4x8 training geometry. Launch scripts should only
# provide environment/runtime values and select this experiment.
defaults:
  - flowgrpo_fast_qwen_image
  - _self_

sampling:
  height: 256
  width: 256

algorithm:
  samples_per_prompt: 12

placement:
  num_rollout_nodes: 4
  num_rollout_gpus_per_node: 8
  num_train_nodes: 4
  num_train_gpus_per_node: 8

rollout:
  plan:
    forward_batch_size: 1

training:
  plan:
    global_batch_size: 576
    local_batch_size: 18
    local_mini_batch_size: 9
  topology:
    actor_count: 32

logging:
  run_name: ${oc.env:WANDB_RUN_NAME,Qwen-Image-FlowGRPO-4x8}
  tags: [qwen-image, t2i, grpo, flowgrpo, newstack, 4x8]

resume:
  output_dir: ${oc.env:OUTPUT_DIR,outputs/flowgrpo_fast_qwen_image_4x8}
