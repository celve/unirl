# @package _global_
# FlowGRPO-Fast SD3 recipe — COLOCATE variant.
#
# Based on flowgrpo_fast_sd3.yaml (disjoint, nccl_broadcast) but
# adapted for colocate mode: rollout + train share the same GPU pool.
#
# Targets a 1-node x 8-GPU layout:
#   - 8 vllm-omni rollout actors (TP=1, 1 GPU each)
#   - 8 FSDP DP=8 train actors (1 GPU each, colocated with rollout)
#
# Key differences from flowgrpo_fast_sd3.yaml (disjoint):
#   - sync: tensor_payload (CUDA-IPC; nccl_broadcast rejects duplicate GPUs)
#   - colocate: true (rollout+train share all 8 GPUs)
#   - num_rollout_gpus_per_actor: 1 so rollout runs as DP across all GPUs
#   - 8 train actors (DP=8) — up from 4 → batch geometry rescaled
#   - offload_{train,rollout}: false (H20 96GB can hold both; enable if OOM)
defaults:
  - /sync@sync: tensor_payload
  - override /algorithm: grpo
  - override /model: sd3
  - override /rollout/engine: vllm_omni
  - override /sampling/sde_strategy: flow
  - _self_

run:
  data_source_dotpath: diffusionrl.data.data_source.MultimodalRLDataSource
  num_rollouts: 20
  data_path: /root/diffusionrl/data/datasets/pickscore/train.txt
  eval_data_path: /root/diffusionrl/data/datasets/pickscore/test.txt
  weight_sync_interval: 1

sampling:
  num_inference_steps: 10
  guidance_scale: 1.0
  height: 512
  width: 512
  init_same_noise: false
  sde_config:
    eta: 0.7

algorithm:
  # Driver-side singular — feeds prompt batching, SDE-index scheduling.
  prompts_per_rollout: 4
  samples_per_prompt: 8
  adv_normalization_scope: group
  use_global_std: true
  clip_range: 1.0e-4
  clip_schedule: constant
  use_kl_penalty: true
  kl_coef: 0.0
  scheduler:
    timestep_fraction: [0.0, 0.5]
    num_sde_steps: 3
  sde_config:
    eta: ${sampling.sde_config.eta}

algorithms:
  # Slot key = rollout response trace key (SD3 emits resp.rollout_traces["image"]).
  image:
    _target_: diffusionrl.algorithms.DiffusionGRPO
    stage_attr: diffusion
    conditions_cls: diffusionrl.models.sd3.conditions.SD3Conditions
    clip_range: 1.0e-4
    clip_schedule: constant
    params:
      _target_: diffusionrl.models.sd3.diffusion.SD3DiffusionParams
      num_inference_steps: ${sampling.num_inference_steps}
      guidance_scale: ${sampling.guidance_scale}
      height: ${sampling.height}
      width: ${sampling.width}
      seed: ${run.seed}
      sde_indices: null
      eta: ${sampling.sde_config.eta}
      init_same_noise: ${sampling.init_same_noise}
      samples_per_prompt: ${algorithm.samples_per_prompt}
      noise_group_ids: null
      max_sequence_length: 256

model:
  pretrained_model_ckpt_path: ${oc.env:PRETRAINED_MODEL,stabilityai/stable-diffusion-3.5-medium}
  model_precision: bf16
  autocast_precision: bf16
  trajectory_precision: bf16
  logprob_precision: fp32

rollout:
  engine:
    model_path: ${oc.env:PRETRAINED_MODEL,stabilityai/stable-diffusion-3.5-medium}
    modality: sd35_t2i
    default_height: 512
    default_width: 512
    default_num_inference_steps: 10
    default_guidance_scale: 1.0
    default_eta: 0.7
  plan:
    forward_batch_size: ${oc.decode:${oc.env:FBS,32}}

placement:
  # Colocate: rollout and train share all 8 GPUs. With one rollout actor per
  # GPU, tensor_payload sync maps each train rank to the rollout actor on the
  # same physical device, and rollout requests shard across actors as DP.
  num_rollout_nodes: 1
  num_rollout_gpus_per_node: 8
  num_rollout_gpus_per_actor: 1       # 8 vllm-omni actors (TP=1, DP over 8)
  num_train_nodes: 1
  num_train_gpus_per_node: 8
  num_train_gpus_per_actor: 1         # 8 FSDP DP=8 train actors
  colocate: true
  colocate_gpu_fraction: 0.5
  strategy: PACK
  allow_noset_multi_gpu_inference: true

training:
  policies:
    # LoRA first, then FSDP wraps the adapted module.
    - _target_: diffusionrl.training.lora_policy.LoRAPolicy
      rank: 32
      alpha: 64
      dropout: 0.0
      target_modules:
        - attn.add_k_proj
        - attn.add_q_proj
        - attn.add_v_proj
        - attn.to_add_out
        - attn.to_k
        - attn.to_out.0
        - attn.to_q
        - attn.to_v
      bias: none
      task_type: FEATURE_EXTRACTION
    - _target_: diffusionrl.training.fsdp_policy.FSDPPolicy
      cpu_offload: false
      param_dtype: bf16
      mixed_precision: true
      fsdp_mode: full
      reshard_after_forward: true
      activation_checkpointing: true
  policy_source: diffusion
  topology:
    actor_count: 8                    # 8 DP=8 train actors (was 4)
  plan:
    # global = prompts_per_rollout * samples_per_prompt = 4 * 8 = 32
    # local = global / actor_count = 32 / 8 = 4
    # local_mini = local / num_updates_per_batch = 4 / 2 = 2
    micro_batch_size: 1
    num_updates_per_batch: 2
    local_mini_batch_size: 2          # was 4 with DP=4
    local_batch_size: 4               # was 8 with DP=4
    global_batch_size: 32
  optimizer:
    learning_rate: 3.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: 1.0e-8
    weight_decay: 0.0
  lr_scheduler:
    type: constant
    warmup_steps: 0
    total_steps: 10000
  execution:
    max_grad_norm: 1.0
    # Offloading disabled by default — H20 96GB can hold both the rollout
    # model (TP=1, resident on 1 of 8) and FSDP train shards (~2-3GB
    # per GPU) simultaneously. Enable if OOM:
    #   offload_train: true   → move FSDP state to CPU during rollout
    #   offload_rollout: true → sleep vllm-omni during training
    offload_train: false
    offload_rollout: false
  materialize:
    with_aux: []

reward:
  aggregation_method: mean
  base_device: cuda
  components:
    - name: pickscore
      weight: 1.0
      batch_size: 8

logging:
  logging_steps: 1
  log_media: false
  report_to_wandb: false

evaluation:
  eval_steps: 0
