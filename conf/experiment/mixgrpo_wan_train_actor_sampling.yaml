# @package _global_
# MixGRPO Wan 2.1 recipe — direct-sampling (fsdp engine) GRPO on WAN T2V.
#
# Translates the legacy launcher
#   scripts/train_mixgrpo_wan_train_actor_sampling.sh
# into LIN-185's per-experiment Hydra recipe pattern. Anchored to a single-node
# 8-GPU cluster (8 train actors, no separate rollout actors). Override via CLI
# for different topology / paths / wandb identity.
defaults:
  - override /algorithm: grpo
  - override /model: wan21
  - override /sampling/sde_strategy: dance
  - _self_

run:
  data_source_dotpath: diffusionrl.data.data_source.ImageRLDataSource
  num_rollouts: 1000
  data_path: ${oc.env:DATA_PATH}
  eval_data_path: ${oc.env:DATA_PATH}

sampling:
  num_inference_steps: 25
  guidance_scale: 5.0
  height: 320
  width: 576
  num_frames: 49
  sde_config:
    eta: 0.7
    shift: 5.0

algorithm:
  prompts_per_rollout: 8
  samples_per_prompt: 8
  adv_normalization_scope: group
  use_global_std: true
  clip_range: 1.0e-4
  clip_schedule: constant
  use_kl_penalty: false
  kl_coef: 0.0
  ema:
    eval_ema_decay: 0.9
    eval_ema_update_interval: 1
  scheduler:
    timestep_fraction: [0.0, 0.5]
  sde_config:
    eta: ${sampling.sde_config.eta}
    shift: ${sampling.sde_config.shift}

placement:
  # Direct-sampling: train actors also sample; no separate rollout actor.
  num_rollout_nodes: 0
  num_rollout_gpus_per_node: 0

rollout:
  plan:
    # Direct-sampling per-call chunk size (legacy: --sampling.forward-batch-size).
    forward_batch_size: 1

training:
  plan:
    # Anchored to 1 node × 8 GPUs = 8 train actors. global = prompts*samples = 64.
    micro_batch_size: 1
    num_updates_per_batch: 1
    local_mini_batch_size: 8     # = global / actor_count / num_updates = 64/8/1
    local_batch_size: 8          # = local_mini_batch_size * num_updates_per_batch
    global_batch_size: 64        # = prompts_per_rollout * samples_per_prompt
  topology:
    actor_count: 8               # 1 node × 8 GPUs
  optimizer:
    learning_rate: 1.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: 1.0e-8
    weight_decay: 0.0
  lr_scheduler:
    type: constant
    warmup_steps: 0
    total_steps: 1000
  execution:
    max_grad_norm: 1.0
    offload_train: false
    offload_rollout: false

model:
  use_lora: false
  use_gradient_checkpointing: true
  pretrained_model_ckpt_path: ${oc.env:PRETRAINED_MODEL,${oc.env:HOME}/models/local/wan2.1-t2v}

reward:
  aggregation_method: mean
  base_device: cuda
  components:
    - name: pickscore
      weight: 1.0
      batch_size: 8

logging:
  logging_steps: 1
  log_media: true
  media_max_items: 8
  report_to_wandb: true
  project_name: diffusionrl
  run_name: mixgrpo_wan_train_actor_sampling

evaluation:
  eval_steps: 60
