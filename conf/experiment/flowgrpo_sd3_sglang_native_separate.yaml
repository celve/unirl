# @package _global_
# FlowGRPO SD3 — SGLang NATIVE logprob, separate mode.
#
# SGLang rollout engine computes log_probs natively during inference.
# Trainer side does NOT need to replay — uses rollout-emitted sde_logp directly.
#
# Layout: 2-node x 8-GPU, separate (4 rollout + 4 train per node):
#   - 8 SGLang rollout actors (TP=1, logprob_source=native)
#   - 8 FSDP DP=8 train actors
#   - nccl_broadcast weight sync
#
# Batch geometry (8 train actors):
#   prompts_per_rollout = 16, samples_per_prompt = 8
#   global_batch_size = 128
#   local_batch_size = 128 / 8 = 16
#   local_mini_batch_size = 16 / 2 = 8
#   micro_batch_size = 1
#   -> 8 grad-accum steps per optimizer step
defaults:
  - /training/lora@training.lora: sd3_rank32
  - /training/fsdp@training.fsdp: bf16_full_ac
  - /sync@sync: nccl_broadcast
  - /training/optimizer@training.optimizer: adam_3e-4
  - /training/lr_scheduler@training.lr_scheduler: constant_10k
  - override /placement: separate_2x8_half
  - override /algorithm: grpo
  - override /model: sd3_bf16
  - override /rollout/engine: sglang
  - override /sampling/sde_strategy: flow
  - override /sampling: sd3_512
  - override /reward: pickscore
  - override /training/execution: standard
  - _self_
run:
  seed: 42
  data_source_dotpath: diffusionrl.data.data_source.MultimodalRLDataSource
  num_rollouts: 10000
  data_path: /root/diffusionrl/data/datasets/pickscore/train.txt
  eval_data_path: /root/diffusionrl/data/datasets/pickscore/test.txt
  weight_sync_interval: 1

sampling:
  samples_per_prompt: 8

algorithm:
  prompts_per_rollout: 16
  adv_normalization_scope: group
  use_global_std: true
  kl_coef: 0.0
  scheduler:
    timestep_fraction: [0.0, 0.5]
    num_sde_steps: 3
  algorithms:
    diffusion:
      name: diffusion_grpo
      stage_attr: diffusion
      conditions_cls: diffusionrl.models.sd3.conditions.SD3Conditions
      clip_range: 1.0e-4
      clip_schedule: constant
rollout:
  engine:
    model_family: sd3
    tp_size: 1
    logprob_source: native
    populate_conditions: true
    init_same_noise: ${sampling.init_same_noise}
    engine_kwargs:
      model_type: sd3
  plan:
    forward_batch_size: ${oc.decode:${oc.env:FBS,16}}

training:
  lora:
    bias: none
    task_type: FEATURE_EXTRACTION
    target_modules:
      - attn.add_k_proj
      - attn.add_q_proj
      - attn.add_v_proj
      - attn.to_add_out
      - attn.to_k
      - attn.to_out.0
      - attn.to_q
      - attn.to_v
  topology:
    actor_count: 8
  plan:
    micro_batch_size: 1
    num_updates_per_batch: 2
    local_mini_batch_size: 8
    local_batch_size: 16
    global_batch_size: 128
  materialize:
    with_aux: []

logging:
  logging_steps: 1
  log_media: false
  report_to_wandb: true
  project_name: diffusionrl-flowgrpo-newstack
  entity: null
  tags: ["sd3.5-medium", "sglang", "native", "separate", "lora-r32", "2x8-h20"]

evaluation:
  eval_steps: 0
