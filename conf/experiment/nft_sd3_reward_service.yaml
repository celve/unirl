# @package _global_
# DiffusionNFT SD3 — remote RewardService backend variant of nft_sd3.
#
# Same training setup as nft_sd3, but replaces the local pickscore scorer
# with a single ``reward_service`` executor that calls a remote HTTP API
# to compute hpsv2, pickscore, unified_reward, imagereward, and hpsv3 in
# one round trip. This frees all local GPUs for training and rollout.
#
# Used by:
#   reproduce_scripts/train_nft_sd3_reward_service_multinode.sh
#
# Override the service URL via env:
#   REWARD_SERVICE_URL=http://10.0.0.5:8080 bash reproduce_scripts/...
defaults:
  - nft_sd3
  - _self_

reward:
  aggregation_method: weighted_sum
  base_device: cpu
  components:
    - name: reward_service
      base_url: ${oc.env:REWARD_SERVICE_URL,http://localhost:8080}
      weight: 1.0
      batch_size: 8
      timeout: 120.0
      aggregation_method: weighted_sum
      required_rewards:
        - hpsv2
        - pickscore
        - unified_reward
        - imagereward
        - hpsv3
      reward_weights:
        hpsv2: 0.2
        pickscore: 0.2
        unified_reward: 0.2
        imagereward: 0.2
        hpsv3: 0.2

logging:
  tags: [reproduce, sd3.5, nft, reward_service, multinode]
