# @package _global_
# FlowGRPO-Fast SD3 — COLOCATE variant, REPRODUCE settings.
#
# Reproduce-grade hyperparameters aligned with the reference 2×8 GPU recipes
# (flowgrpo_sglang_sd3_colocate.yaml, flowgrpo_fast_sd3.yaml) but adapted for
# a single 1×8 H20 node using vllm-omni + train.py.
#
# === Key reproduce parameters (matching reference exactly) ===
#   - prompts_per_rollout: 48
#   - samples_per_prompt: 16
#   - global_batch_size: 768 (= 48 × 16)
#   - num_updates_per_batch: 2
#   - clip_range: 1e-4, constant schedule
#   - use_kl_penalty: true (kl_coef=0.0)
#   - LoRA rank=32, alpha=64
#   - lr: 3e-4, constant, no warmup
#   - EMA eval: decay=0.99, update_interval=2
#   - SDE: eta=0.7, shift=3.0, timestep_fraction=[0.0, 0.5], num_sde_steps=3
#   - Sampling: 10 inference steps, guidance_scale=1.0, 512×512
#   - Reward: pickscore, mean aggregation
#   - max_grad_norm: 1.0
#
# === What differs from 2×8 reference (hardware adaptation only) ===
#   actor_count: 8 (vs 16) — half the GPUs, double the grad accumulation
#   local_batch_size: 96 (vs 48) — global/actor_count
#   local_mini_batch_size: 48 (vs 24) — local_batch/num_updates
#   micro_batch_size: 1 — H20 memory constraint with AC + LoRA + full replay
#   → 48 grad-accum steps per mini-batch (vs 3 with micro=8 on 16 actors)
#   This preserves the same effective gradient per optimizer step.
#
# === Layout (1×8 H20 96GB, colocate) ===
#   - 8 vllm-omni rollout actors (TP=1, 1 GPU each, DP rollout)
#   - 8 FSDP DP=8 train actors (1 GPU each, colocated, ~40GB peak with AC)
#
# === Estimated throughput ===
#   rollout: 768 images sharded over 8 TP=1 actors
#   train:   2 updates × 48 accum-steps × ~0.3s ≈ 30s
#   sync:    ~0.5s
#   → rollout wall time should scale with available actor parallelism
defaults:
  - /sync@sync: tensor_payload
  - override /algorithm: grpo
  - override /model: sd3
  - override /rollout/engine: vllm_omni
  - override /sampling/sde_strategy: flow
  - _self_

run:
  data_source_dotpath: diffusionrl.data.data_source.MultimodalRLDataSource
  num_rollouts: 10000
  data_path: /root/diffusionrl/data/datasets/pickscore/train.txt
  eval_data_path: /root/diffusionrl/data/datasets/pickscore/test.txt
  weight_sync_interval: 1

# ── Sampling (identical to reference) ──
sampling:
  num_inference_steps: 10
  guidance_scale: 1.0
  height: 512
  width: 512
  init_same_noise: false
  sde_config:
    eta: 0.7

# ── Algorithm (identical to reference) ──
algorithm:
  prompts_per_rollout: 48
  samples_per_prompt: 16
  adv_normalization_scope: group
  use_global_std: true
  clip_range: 1.0e-4
  clip_schedule: constant
  use_kl_penalty: true
  kl_coef: 0.0
  ema:
    eval_ema_decay: 0.99
    eval_ema_update_interval: 2
  scheduler:
    timestep_fraction: [0.0, 0.5]
    num_sde_steps: 3
  sde_config:
    eta: ${sampling.sde_config.eta}

# ── Algorithms (per-slot config) ──
algorithms:
  image:
    _target_: diffusionrl.algorithms.DiffusionGRPO
    stage_attr: diffusion
    conditions_cls: diffusionrl.models.sd3.conditions.SD3Conditions
    clip_range: 1.0e-4
    clip_schedule: constant
    params:
      _target_: diffusionrl.models.sd3.diffusion.SD3DiffusionParams
      num_inference_steps: ${sampling.num_inference_steps}
      guidance_scale: ${sampling.guidance_scale}
      height: ${sampling.height}
      width: ${sampling.width}
      seed: ${run.seed}
      sde_indices: null
      eta: ${sampling.sde_config.eta}
      init_same_noise: ${sampling.init_same_noise}
      samples_per_prompt: ${algorithm.samples_per_prompt}
      noise_group_ids: null
      max_sequence_length: 256

# ── Model (identical to reference) ──
model:
  pretrained_model_ckpt_path: ${oc.env:PRETRAINED_MODEL,stabilityai/stable-diffusion-3.5-medium}
  model_precision: bf16
  autocast_precision: bf16
  trajectory_precision: bf16
  logprob_precision: fp32

# ── Rollout engine (vllm-omni) ──
rollout:
  engine:
    model_path: ${oc.env:PRETRAINED_MODEL,stabilityai/stable-diffusion-3.5-medium}
    modality: sd35_t2i
    default_height: 512
    default_width: 512
    default_num_inference_steps: 10
    default_guidance_scale: 1.0
    default_eta: 0.7
  plan:
    forward_batch_size: ${oc.decode:${oc.env:FBS,48}}

# ── Placement (1×8 H20, colocate) ──
placement:
  num_rollout_nodes: 1
  num_rollout_gpus_per_node: 8
  num_rollout_gpus_per_actor: 1       # 8 vllm-omni actors (TP=1, DP over 8)
  num_train_nodes: 1
  num_train_gpus_per_node: 8
  num_train_gpus_per_actor: 1         # 8 FSDP DP=8 train actors
  colocate: true
  colocate_gpu_fraction: 0.5
  strategy: PACK
  allow_noset_multi_gpu_inference: true

# ── Training (adapted for 8 actors; same effective gradient as 16-actor ref) ──
training:
  policies:
    # LoRA (identical to reference: rank=32, alpha=64)
    - _target_: diffusionrl.training.lora_policy.LoRAPolicy
      rank: 32
      alpha: 64
      dropout: 0.0
      target_modules:
        - attn.add_k_proj
        - attn.add_q_proj
        - attn.add_v_proj
        - attn.to_add_out
        - attn.to_k
        - attn.to_out.0
        - attn.to_q
        - attn.to_v
      bias: none
      task_type: FEATURE_EXTRACTION
    # FSDP wraps the LoRA-adapted module
    - _target_: diffusionrl.training.fsdp_policy.FSDPPolicy
      cpu_offload: false
      param_dtype: bf16
      mixed_precision: true
      fsdp_mode: full
      reshard_after_forward: true
      activation_checkpointing: true
  policy_source: diffusion
  topology:
    actor_count: 8                    # 1 node × 8 GPUs (reference: 16)
  plan:
    # global = 48 × 16 = 768 (identical to reference)
    # local = 768 / 8 = 96 (reference: 768/16=48)
    # local_mini = 96 / 2 = 48 (reference: 48/2=24)
    # micro = 1 (reference: 8) — more grad-accum, same effective update
    micro_batch_size: 1
    num_updates_per_batch: 2
    local_mini_batch_size: 48
    local_batch_size: 96
    global_batch_size: 768
  optimizer:
    learning_rate: 3.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: 1.0e-8
    weight_decay: 0.0
  lr_scheduler:
    type: constant
    warmup_steps: 0
    total_steps: 10000
  execution:
    max_grad_norm: 1.0
    offload_train: false
    offload_rollout: false
  materialize:
    with_aux: []

# ── Reward (identical to reference) ──
reward:
  aggregation_method: mean
  base_device: cuda
  components:
    - name: pickscore
      weight: 1.0
      batch_size: 8

# ── Logging (full reproduce-grade) ──
# WandB panels logged by train.py:
#   rollout/  — reward_{mean,std,min,max}, advantage_{mean,std,min,max},
#               num_samples, zero_std_group_{ratio,count}, group_count,
#               + per-slot training metrics (image/policy_loss, image/ratio_mean,
#               image/clip_fraction, image/approx_kl, etc.)
#   train/    — loss, grad_norm, lr, has_backward,
#               + same per-slot metrics keyed by optimizer step
#   perf/     — rollout_s, train_s, sync_s, reward_compute_s,
#               samples_per_s, step_s
#   sync/     — elapsed_s
#   media     — generated_media (images + prompts + rewards)
logging:
  logging_steps: 1
  log_media: true
  media_max_items: 48                 # log up to 48 images per rollout (1 per prompt)
  report_to_wandb: true
  project_name: diffusionrl-flowgrpo
  run_name: null                      # auto-generated by wandb
  tags: ["reproduce", "sd3.5-medium", "vllm-omni", "colocate", "lora-r32", "1x8-h20"]
  entity: null                        # uses default entity from wandb login

evaluation:
  eval_steps: 0
