# @package _global_
# End-to-end weight-sync smoke for the NEW groups (NewRolloutActorGroup +
# NewTrainActorGroup) against SD3 — **colocate / CUDA-IPC variant**.
# Consumed by ``scripts/smoke_new_groups_weight_sync_sd3.py --mode colocate``
# (NOT by ``train.py``). Sibling of
# ``smoke_vllm_omni_sd3_weight_sync.yaml`` (disjoint-GPU NCCL variant).
#
# Layout:
#   - 4 rollout actors (TP=1, 1 GPU each) wrapping vllm-omni's stock
#     ``StableDiffusion3Pipeline`` (single diffusion stage, modality=sd35_t2i).
#   - 4 train actors (1 GPU each, FSDP DP=4) **on the same 4 GPUs** as the
#     rollout actors. Time-share via ``colocate=true`` + ``offload_train``
#     so trainer and rollout don't OOM each other.
#
# This config verifies the tensor_payload and ipc_bucketed transports.
# Both use CUDA IPC under the hood (SGLang ``MultiprocessingSerializer``
# pickles handles; bucketed IPC uses ``cudaIpcGetMemHandle`` directly),
# which only works when trainer + rollout share physical GPUs.
# nccl_broadcast does NOT work here — its NCCL group rejects duplicate
# physical devices. Use the disjoint sibling for that transport.

defaults:
  - override /algorithm: grpo
  - override /model: sd3_v2
  - override /rollout/engine: vllm_omni
  - override /sampling/sde_strategy: flow
  - _self_

run:
  seed: 42
  num_rollouts: 1
  data_source_dotpath: diffusionrl.data.data_source.MultimodalRLDataSource
  data_path: /tmp/smoke_unused.txt
  eval_data_path: /tmp/smoke_unused.txt
  weight_sync_interval: 1

sampling:
  num_inference_steps: 4
  guidance_scale: 1.0
  height: 512
  width: 512
  init_same_noise: false
  sde_config:
    eta: 0.0

algorithm:
  prompts_per_rollout: 4
  samples_per_prompt: 1
  adv_normalization_scope: group
  use_global_std: true
  clip_range: 1.0e-4
  clip_schedule: constant
  use_kl_penalty: false
  kl_coef: 0.0
  scheduler:
    timestep_fraction: [0.0, 1.0]
    num_sde_steps: 4
  sde_config:
    eta: ${sampling.sde_config.eta}

algorithms:
  diffusion:
    _target_: diffusionrl.algorithms_new.DiffusionGRPO
    clip_range: 1.0e-4
    clip_schedule: constant

model:
  pretrained_model_ckpt_path: ${oc.env:PRETRAINED_MODEL,stabilityai/stable-diffusion-3.5-medium}
  model_precision: bf16
  autocast_precision: bf16
  trajectory_precision: bf16
  logprob_precision: fp32

rollout:
  engine:
    model_path: ${oc.env:PRETRAINED_MODEL,stabilityai/stable-diffusion-3.5-medium}
    modality: sd35_t2i
    default_height: 512
    default_width: 512
    default_num_inference_steps: 4
    default_guidance_scale: 1.0
    default_eta: 0.0
  plan:
    forward_batch_size: ${oc.decode:${oc.env:FBS,1}}

placement:
  # Colocate: rollout and train share GPUs 0..3 (4 GPUs total). Each rollout
  # actor runs TP=1 on one GPU, matching the train actor on the same physical
  # device for CUDA-IPC tensor payload sync.
  num_rollout_nodes: 1
  num_rollout_gpus_per_node: 4
  num_rollout_gpus_per_actor: 1       # 4 TP=1 rollout actors, DP over 4
  num_train_nodes: 1
  num_train_gpus_per_node: 4
  num_train_gpus_per_actor: 1         # 4 DP=4 train actors
  colocate: true
  strategy: PACK
  allow_noset_multi_gpu_inference: true

training:
  policies:
    - _target_: diffusionrl.training_new.fsdp_policy.FSDPPolicy
      cpu_offload: false
      param_dtype: bf16
      mixed_precision: true
      fsdp_mode: full
      reshard_after_forward: true
      activation_checkpointing: false
  policy_source: diffusion
  topology:
    actor_count: 4
  plan:
    micro_batch_size: 1
    num_updates_per_batch: 1
    local_mini_batch_size: 1
    local_batch_size: 1
    global_batch_size: 4
  optimizer:
    learning_rate: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: 1.0e-8
    weight_decay: 0.0
  lr_scheduler:
    type: constant
    warmup_steps: 0
    total_steps: 1
  execution:
    max_grad_norm: 1.0
    offload_train: false
    offload_rollout: false
  materialize:
    with_aux: []

reward:
  aggregation_method: mean
  base_device: cuda
  components:
    - name: pickscore
      weight: 1.0
      batch_size: 1

logging:
  logging_steps: 1
  log_media: false
  report_to_wandb: false

evaluation:
  eval_steps: 0
