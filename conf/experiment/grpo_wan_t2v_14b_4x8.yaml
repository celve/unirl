# @package _global_
# GRPO WAN 2.1 T2V 14B recipe — 4-node x 8-GPU (32 train actors).
#
# Identical hyperparameters to grpo_wan_t2v_14b (single-node variant);
# only training plan and topology are rebased for 32 actors.
#
# Used by:
#   reproduce_scripts/train_grpo_wan21_t2v_14b_4x8.sh
#
# Batch geometry (anchors: global=768, num_updates=2, micro=1):
#   actor_count         = 4 * 8 = 32
#   local_batch_size    = 768 / 32 = 24
#   local_mini_batch    = 24 / 2 = 12
defaults:
  - grpo_wan_t2v_14b
  - _self_

training:
  plan:
    # Rebased for 4 nodes x 8 GPUs = 32 train actors.
    local_mini_batch_size: 12    # = 768 / 32 / 2
    local_batch_size: 24         # = 12 * 2
    global_batch_size: 768
  topology:
    actor_count: 32              # 4 nodes x 8 GPUs
