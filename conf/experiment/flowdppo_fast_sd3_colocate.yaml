# @package _global_
# Flow-DPPO SD3 recipe — trainside (FSDP) sampling.
#
# Uses DiffusionDPPO algorithm (KL-divergence-based masking) with
# trainside rollout engine: rollout runs directly on the FSDP-wrapped
# training GPU (no separate rollout actor or vllm-omni subprocess).
#
# Key differences from FlowGRPO trainside:
#   - algorithms.image._target_: DiffusionDPPO (not DiffusionGRPO)
#   - kl_mask_threshold: controls KL threshold for masking
#   - add_kl_coefficient: normalizes KL by sigma_t (flow-matching noise scale)
#   - No clip_range needed (replaced by KL-based masking)
#
# Batch geometry (1-node × 8-GPU):
#   global_batch     = prompts_per_rollout * samples_per_prompt = 48 * 16 = 768
#   local_batch_size = global / actor_count = 768 / 8 = 96
#   local_mini_batch = local / num_updates_per_batch = 96 / 2 = 48
#   micro_batch_size = 8
#
# Launch:
#   python -m diffusionrl.train +experiment=flowdppo_fast_sd3_colocate
defaults:
  - /training/lora@training.lora: sd3_rank32
  - /training/fsdp@training.fsdp: bf16_full_ac
  - /training/optimizer@training.optimizer: adam_3e-4
  - /training/lr_scheduler@training.lr_scheduler: constant_10k
  - override /placement: colocate_1x8
  - override /algorithm: grpo
  - override /model: sd3_bf16_shift3
  - override /rollout/engine: trainside
  - override /sampling/sde_strategy: flow
  - override /sampling: sd3_512
  - override /reward: pickscore
  - override /training/execution: standard
  - _self_
run:
  seed: 42
  num_rollouts: 10000
  data_source_dotpath: diffusionrl.data.data_source.MultimodalRLDataSource
  data_path: ${oc.env:DATA_PATH,/mnt/bj/data/datasets/pickscore/train.txt}
  eval_data_path: ${oc.env:EVAL_DATA_PATH,/mnt/bj/data/datasets/pickscore/test.txt}

sampling:
  samples_per_prompt: 16

algorithm:
  # Driver-side singular — feeds prompt batching, SDE-index scheduling.
  prompts_per_rollout: 48
  adv_normalization_scope: group
  use_global_std: true
  # clip_range is unused by DPPO but kept for driver-side compat
  kl_coef: 0.0
  scheduler:
    timestep_fraction: [0.0, 0.5]
    num_sde_steps: 3
  algorithms:
    # Slot ``image`` matches RolloutResp.tracks["image"] on SD3.
    # ``stage_attr: diffusion`` points the algorithm at the right stage.
    diffusion:
      name: diffusion_dppo
      stage_attr: diffusion
      conditions_cls: diffusionrl.models.sd3.conditions.SD3Conditions
      # Flow-DPPO hyperparameters
      kl_mask_threshold: 1.0e-5
      add_kl_coefficient: true
rollout:
  engine: {}
  plan:
    forward_batch_size: 8

# ----------------------------------------------------------------------
# Training surface
# ----------------------------------------------------------------------
training:
  ema:
    decay: 0.99
    update_step_interval: 2
  materialize:
    with_aux: [vae, text_encoder, text_encoder_2, text_encoder_3]
  plan:
    # global = 48 * 16 = 768
    # local = 768 / 8 = 96
    # local_mini = 96 / 2 = 48
    micro_batch_size: 8
    num_updates_per_batch: 2
    local_mini_batch_size: 48
    local_batch_size: 96
    global_batch_size: 768
  topology:
    actor_count: 8

logging:
  logging_steps: 1
  log_media: false
  media_max_items: 8
  report_to_wandb: ${oc.decode:${oc.env:REPORT_TO_WANDB,true}}
  project_name: diffusionrl-flow-dppo
  run_name: ${oc.env:WANDB_RUN_NAME,flowdppo_fast_sd3_trainside}
  tags: [sd3, t2i, dppo, flow-dppo, kl-adv, trainside]

evaluation:
  eval_steps: 0
