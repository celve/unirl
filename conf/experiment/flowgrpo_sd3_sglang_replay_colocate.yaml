# @package _global_
# FlowGRPO SD3 — SGLang REPLAY logprob, COLOCATE mode .
#
# SGLang rollout engine computes log_probs natively during inference.
# Colocate: rollout and train actors time-share the same GPUs.
#
# Layout: 2-node x 8-GPU, colocate (16 actors total):
#   - 16 SGLang rollout actors (TP=1, logprob_source=native, colocated)
#   - 16 FSDP DP=16 train actors (colocated)
#   - tensor_payload weight sync
#
# Batch geometry (16 train actors):
#   prompts_per_rollout = 96, samples_per_prompt = 16
#   global_batch_size = 96 * 16 = 1536
#   local_batch_size = 1536 / 16 = 96
#   local_mini_batch_size = 96 / 2 = 48
#   micro_batch_size = 2
#   -> 24 grad-accum steps per optimizer step
defaults:
  - /training/lora@training.lora: sd3_rank32
  - /training/fsdp@training.fsdp: bf16_full_ac
  - /sync@sync: tensor_payload
  - /training/optimizer@training.optimizer: adam_3e-4
  - /training/lr_scheduler@training.lr_scheduler: constant_10k
  - override /placement: colocate_2x8_half
  - override /algorithm: grpo
  - override /model: sd3_bf16
  - override /rollout/engine: sglang
  - override /sampling/sde_strategy: flow
  - override /sampling: sd3_512
  - override /reward: pickscore
  - override /training/execution: offload_both
  - _self_
run:
  seed: 42
  data_source_dotpath: diffusionrl.data.data_source.MultimodalRLDataSource
  num_rollouts: 10000
  data_path: /root/diffusionrl/data/datasets/pickscore/train.txt
  eval_data_path: /root/diffusionrl/data/datasets/pickscore/test.txt
  weight_sync_interval: 1

sampling:
  samples_per_prompt: 16

algorithm:
  prompts_per_rollout: 96
  adv_normalization_scope: group
  use_global_std: true
  kl_coef: 0.0
  scheduler:
    timestep_fraction: [0.0, 0.5]
    num_sde_steps: 3
  algorithms:
    diffusion:
      name: diffusion_grpo
      stage_attr: diffusion
      conditions_cls: diffusionrl.models.sd3.conditions.SD3Conditions
      clip_range: 1.0e-4
      clip_schedule: constant
rollout:
  engine:
    model_family: sd3
    tp_size: 1
    logprob_source: replay
    populate_conditions: true
    init_same_noise: ${sampling.init_same_noise}
    engine_kwargs:
      model_type: sd3
  plan:
    forward_batch_size: ${oc.decode:${oc.env:FBS,16}}

training:
  lora:
    bias: none
    task_type: FEATURE_EXTRACTION
    target_modules:
      - attn.add_k_proj
      - attn.add_q_proj
      - attn.add_v_proj
      - attn.to_add_out
      - attn.to_k
      - attn.to_out.0
      - attn.to_q
      - attn.to_v
  topology:
    actor_count: 16
  plan:
    micro_batch_size: 2
    num_updates_per_batch: 2
    local_mini_batch_size: 48
    local_batch_size: 96
    global_batch_size: 1536
  materialize:
    with_aux: []

logging:
  logging_steps: 1
  log_media: false
  report_to_wandb: true
  project_name: diffusionrl-flowgrpo-newstack
  entity: null
  tags: ["sd3.5-medium", "sglang", "replay", "colocate", "lora-r32", "2x8-h20"]

evaluation:
  eval_steps: 0
