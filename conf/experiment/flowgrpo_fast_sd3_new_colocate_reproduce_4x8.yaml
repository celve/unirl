# @package _global_
# FlowGRPO-Fast SD3 — NEW-DESIGN path, COLOCATE variant, REPRODUCE settings.
# 4-node x 8-GPU (32 actors) version.
#
# Adapted from flowgrpo_fast_sd3_new_colocate_reproduce.yaml (1x8, 8 actors).
# Strategy: keep per-actor workload identical to the 1x8 baseline
# (local_batch_size=48), scale up global batch via 4x more actors.
# Rollout throughput scales ~4x (32 actors generate 1536 images in parallel).
#
# === Batch geometry for 32 actors ===
#   prompts_per_rollout = 96 (doubled from 48 to fill 4x actors)
#   samples_per_prompt = 16 (unchanged)
#   global_batch_size = 1536 (= 96 x 16)
#   actor_count = 32 (4 nodes x 8 GPUs)
#   local_batch_size = 1536 / 32 = 48 (identical to 1x8 per-actor!)
#   num_updates_per_batch = 2
#   local_mini_batch_size = 48 / 2 = 24 (identical to 1x8 per-actor!)
#   micro_batch_size = 1 (H20 memory constraint)
#   -> 24 grad-accum steps per mini-batch (same as 1x8 baseline)
#
# === Layout (4x8 H20 96GB, colocate) ===
#   - 32 vllm-omni rollout actors (TP=1, 1 GPU each, DP rollout)
#   - 32 FSDP DP=32 train actors (1 GPU each, colocated)
defaults:
  - /sync@sync: tensor_payload
  - override /algorithm: grpo
  - override /model: sd3_v2
  - override /rollout/engine: vllm_omni
  - override /sampling/sde_strategy: flow
  - _self_

run:
  data_source_dotpath: diffusionrl.data.data_source.MultimodalRLDataSource
  num_rollouts: 10000
  data_path: /apdcephfs_zwfy8/share_305110755/hunyuan/haonan/mmgrpo/DiffusionRL_main/data/datasets/pickscore/train.txt
  eval_data_path: /apdcephfs_zwfy8/share_305110755/hunyuan/haonan/mmgrpo/DiffusionRL_main/data/datasets/pickscore/test.txt
  weight_sync_interval: 1

# -- Sampling (identical to reference) --
sampling:
  num_inference_steps: 10
  guidance_scale: 1.0
  height: 512
  width: 512
  init_same_noise: false
  sde_config:
    eta: 0.7

# -- Algorithm (identical to reference) --
algorithm:
  prompts_per_rollout: 96
  samples_per_prompt: 16
  adv_normalization_scope: group
  use_global_std: true
  clip_range: 1.0e-4
  clip_schedule: constant
  use_kl_penalty: true
  kl_coef: 0.0
  ema:
    eval_ema_decay: 0.99
    eval_ema_update_interval: 2
  scheduler:
    timestep_fraction: [0.0, 0.5]
    num_sde_steps: 3
  sde_config:
    eta: ${sampling.sde_config.eta}

# -- Algorithms (new-design per-slot config) --
algorithms:
  image:
    _target_: diffusionrl.algorithms_new.DiffusionGRPO
    stage_attr: diffusion
    conditions_cls: diffusionrl.models_new.sd3.conditions.SD3Conditions
    clip_range: 1.0e-4
    clip_schedule: constant
    params:
      _target_: diffusionrl.models_new.sd3.diffusion.SD3DiffusionParams
      num_inference_steps: ${sampling.num_inference_steps}
      guidance_scale: ${sampling.guidance_scale}
      height: ${sampling.height}
      width: ${sampling.width}
      seed: ${run.seed}
      sde_indices: null
      eta: ${sampling.sde_config.eta}
      init_same_noise: ${sampling.init_same_noise}
      samples_per_prompt: ${algorithm.samples_per_prompt}
      noise_group_ids: null
      max_sequence_length: 256

# -- Model (identical to reference) --
model:
  pretrained_model_ckpt_path: ${oc.env:PRETRAINED_MODEL,/apdcephfs_zwfy8/share_305110755/hunyuan/haonan/mmgrpo/diffusionRL/models/local/sd3.5-medium}
  model_precision: bf16
  autocast_precision: bf16
  trajectory_precision: bf16
  logprob_precision: fp32

# -- Rollout engine (vllm-omni) --
rollout:
  engine:
    model_path: ${oc.env:PRETRAINED_MODEL,/apdcephfs_zwfy8/share_305110755/hunyuan/haonan/mmgrpo/diffusionRL/models/local/sd3.5-medium}
    modality: sd35_t2i
    default_height: 512
    default_width: 512
    default_num_inference_steps: 10
    default_guidance_scale: 1.0
    default_eta: 0.7
  plan:
    forward_batch_size: ${oc.decode:${oc.env:FBS,48}}

# -- Placement (4x8 H20, colocate) --
placement:
  num_rollout_nodes: 4
  num_rollout_gpus_per_node: 8
  num_rollout_gpus_per_actor: 1       # 32 vllm-omni actors (TP=1, DP over 32)
  num_train_nodes: 4
  num_train_gpus_per_node: 8
  num_train_gpus_per_actor: 1         # 32 FSDP DP=32 train actors
  colocate: true
  colocate_gpu_fraction: 0.5
  strategy: PACK
  allow_noset_multi_gpu_inference: true

# -- Training (32 actors; same effective gradient as reference) --
training:
  policies:
    # LoRA (identical to reference: rank=32, alpha=64)
    - _target_: diffusionrl.training_new.lora_policy.LoRAPolicy
      rank: 32
      alpha: 64
      dropout: 0.0
      target_modules:
        - attn.add_k_proj
        - attn.add_q_proj
        - attn.add_v_proj
        - attn.to_add_out
        - attn.to_k
        - attn.to_out.0
        - attn.to_q
        - attn.to_v
      bias: none
      task_type: FEATURE_EXTRACTION
    # FSDP wraps the LoRA-adapted module
    - _target_: diffusionrl.training_new.fsdp_policy.FSDPPolicy
      cpu_offload: false
      param_dtype: bf16
      mixed_precision: true
      fsdp_mode: full
      reshard_after_forward: true
      activation_checkpointing: true
  policy_source: diffusion
  topology:
    actor_count: 32                   # 4 nodes x 8 GPUs
  plan:
    # global = 96 x 16 = 1536 (2x the 1x8 baseline, 4x actors)
    # local = 1536 / 32 = 48 (identical to 1x8 per-actor!)
    # local_mini = 48 / 2 = 24 (identical to 1x8 per-actor!)
    # micro = 1 (H20 memory constraint)
    # -> 24 grad-accum steps per mini-batch (same as 1x8)
    micro_batch_size: 1
    num_updates_per_batch: 2
    local_mini_batch_size: 24
    local_batch_size: 48
    global_batch_size: 1536
  optimizer:
    learning_rate: 3.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: 1.0e-8
    weight_decay: 0.0
  lr_scheduler:
    type: constant
    warmup_steps: 0
    total_steps: 10000
  execution:
    max_grad_norm: 1.0
    offload_train: false
    offload_rollout: false
  materialize:
    with_aux: []

# -- Reward (identical to reference) --
reward:
  aggregation_method: mean
  base_device: cuda
  components:
    - name: pickscore
      weight: 1.0
      batch_size: 8
      processor_id: /apdcephfs_zwfy8/share_305110755/hunyuan/haonan/mmgrpo/diffusionRL/models/local/reward_models/CLIP-ViT-H-14
      model_id: /apdcephfs_zwfy8/share_305110755/hunyuan/haonan/mmgrpo/diffusionRL/models/local/reward_models/PickScore_v1

# -- Logging (full reproduce-grade with wandb) --
logging:
  logging_steps: 1
  log_media: true
  media_max_items: 48
  report_to_wandb: true
  project_name: diffusionrl-flowgrpo
  run_name: null
  tags: ["reproduce", "sd3.5-medium", "vllm-omni", "colocate", "lora-r32", "4x8-h20", "1536-batch"]
  entity: null

evaluation:
  eval_steps: 0
