# @package _global_
# Smoke experiment for the new Policy-stack direct-sampling path on SD3.5.
#
# Workload: small (2 prompts × 4 samples = 8) so it runs on a single H20
# in a few minutes. The training Policy serves rollouts in-process via
# TrainsideRolloutEngine — no separate rollout actor, no weight sync.
#
# Run via diffusionrl/train_new.py:
#
#   .venv/bin/python -m diffusionrl.train_new \\
#       +experiment=smoke_direct_sampling_sd3
defaults:
  - override /algorithm: grpo
  - override /model: sd3_v2
  - override /rollout/engine: trainside
  - override /sampling/sde_strategy: flow
  - _self_

run:
  seed: 42
  num_rollouts: 5
  data_source_dotpath: diffusionrl.data.MultimodalRLDataSource
  data_path: /tmp/smoke_unused.txt
  eval_data_path: /tmp/smoke_unused.txt

sampling:
  num_inference_steps: 8
  guidance_scale: 2.5
  height: 512
  width: 512
  seed: 42
  init_same_noise: false
  sde_config:
    eta: 0.3

algorithm:
  prompts_per_rollout: 2
  samples_per_prompt: 4
  adv_normalization_scope: group
  use_global_std: true
  clip_range: 1.0e-4
  clip_schedule: constant
  use_kl_penalty: false
  kl_coef: 0.0
  scheduler:
    timestep_fraction: [0.0, 1.0]
    num_sde_steps: 8
  sde_config:
    eta: ${sampling.sde_config.eta}

model:
  # ``SD3_PATH`` env var overrides; defaults to the pod-local staged path
  # used by setup_and_launch.sh.
  pretrained_model_ckpt_path: ${oc.env:SD3_PATH,/root/diffusionrl/models/local/stable-diffusion-3.5-medium}
  model_precision: bf16
  autocast_precision: bf16
  trajectory_precision: bf16
  logprob_precision: fp32
  shift: 3.0

rollout:
  engine: {}
  plan:
    forward_batch_size: 4

placement:
  # Direct sampling: rollout actors are NOT spawned separately
  # (NewRolloutActorGroup.from_train_group adopts train actor handles).
  # The placement validator still requires positive values for both
  # halves; we set rollout=train so the placement-graph math works.
  num_rollout_nodes: 1
  num_rollout_gpus_per_node: 1
  num_rollout_gpus_per_actor: 1
  num_train_nodes: 1
  num_train_gpus_per_node: 1
  num_train_gpus_per_actor: 1
  colocate: true
  colocate_gpu_fraction: 0.9
  strategy: PACK

# ----------------------------------------------------------------------
# New Policy-stack training surface. ``cfg.algorithms.<slot>`` (plural)
# wires per-slot StageAlgorithm presets; ``cfg.training.policies`` /
# ``policy_source`` wire the compose_policy stack. ``materialize.with_aux``
# tells the bundle to materialize VAE + text encoders on the train actor
# so the in-process pipeline can decode and embed in direct mode.
# ----------------------------------------------------------------------
algorithms:
  # The slot key matches ``RolloutResp.rollout_traces["image"]`` on SD3.
  # ``stage_attr: diffusion`` points the algorithm at the diffusion stage
  # on SD3Pipeline (whose attribute name differs from the slot name).
  # ``params:`` is inlined because the SD3 pipeline does NOT hold a
  # typed params object on a ``<slot>_params`` attribute — for HI3 it
  # could, but in general the cfg owns sampling-side knobs.
  image:
    _target_: diffusionrl.algorithms_new.grpo.DiffusionGRPO
    stage_attr: diffusion
    clip_range: 1.0e-4
    clip_schedule: constant
    conditions_cls: diffusionrl.models_new.sd3.conditions.SD3Conditions
    params:
      # ``guidance_scale`` / ``eta`` interpolate from sampling so replay
      # (which reads both) tracks any CLI override on the rollout side.
      _target_: diffusionrl.models_new.sd3.diffusion.SD3DiffusionParams
      num_inference_steps: 8
      guidance_scale: ${sampling.guidance_scale}
      height: 512
      width: 512
      seed: 42
      sde_indices: [0, 1, 2, 3, 4, 5, 6, 7]
      eta: ${sampling.sde_config.eta}

training:
  policy_source: diffusion
  policies:
    - _target_: diffusionrl.training_new.fsdp_policy.FSDPPolicy
      cpu_offload: false
      param_dtype: bf16
      mixed_precision: true
      fsdp_mode: full
      reshard_after_forward: true
      activation_checkpointing: false
    - _target_: diffusionrl.training_new.ema_policy.EMAPolicy
      decay: 0.9999
  materialize:
    with_aux:
      - vae
      - text_encoder
      - text_encoder_2
      - text_encoder_3
  plan:
    micro_batch_size: 1
    num_updates_per_batch: 1
    local_mini_batch_size: 8
    local_batch_size: 8
    global_batch_size: 8
  topology:
    actor_count: 1
  optimizer:
    learning_rate: 1.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_epsilon: 1.0e-8
    weight_decay: 0.0
  lr_scheduler:
    type: constant
    warmup_steps: 0
    total_steps: 5
  execution:
    offload_train: false
    offload_rollout: false
    max_grad_norm: 1.0

reward:
  aggregation_method: mean
  base_device: cuda
  components:
    - name: pickscore
      weight: 1.0
      batch_size: 4

logging:
  logging_steps: 1
  log_media: false
  report_to_wandb: false

evaluation:
  eval_steps: 0
