# @package _global_
# FLUX.2-klein-9B GRPO — single node × 8 GPUs = 8 actors.
#
# Derived from grpo_flux2_klein9b_trainside_4x8.yaml. Goal: reproduce the
# driver-side gather OOM on one node, then A/B test it against TransferQueue.
#
# PER-GPU batch is kept IDENTICAL to the tuned 4x8 recipe — only the node
# count and prompt count drop:
#
#   prompts_per_rollout = 16
#   samples_per_prompt  = 16    -> global_batch_size = 256
#   actor_count         = 8     -> local_batch_size  = 256 / 8 = 32   (== 4x8)
#   num_updates_per_batch = 2   -> local_mini        = 32 / 2 = 16    (== 4x8)
#   micro_batch_size    = 4     -> 4 micros / update                  (== 4x8)
#
# Why NOT keep global_batch_size = 1024 on 8 GPUs:
#   1024 / 8 actors = local 128 per GPU = 4x the tuned per-GPU load, and the
#   fp16 rollout cache (~30GB/actor at local=32) would balloon to ~120GB
#   and OOM during GENERATION — a different failure that TransferQueue does
#   NOT address. Keeping local=32 means any OOM you see is the driver gather
#   (the TQ-fixable one), not a per-GPU train/rollout-cache OOM.
#
# Everything Klein-specific (fp32 FSDP master, LoRA targets, dance SDE,
# offload=false) is kept VERBATIM from 4x8 so this is a faithful single-node
# reproduction of the production memory profile.
#
# Reproduce the OOM (TransferQueue OFF — the current default):
#   DATA_PATH=/apdcephfs_zwfy8/share_305110755/hunyuan/rzhu/DiffusionRL/data/datasets/pickscore/train.txt \
#   EVAL_DATA_PATH=/apdcephfs_zwfy8/share_305110755/hunyuan/rzhu/DiffusionRL/data/datasets/pickscore/test.txt \
#   bash scripts/run_experiment_single_node.sh grpo_flux2_klein9b_trainside_1x8
#
# Then re-run with TransferQueue ON to see if the OOM disappears:
#   ... bash scripts/run_experiment_single_node.sh grpo_flux2_klein9b_trainside_1x8 \
#       +transfer_queue=mooncake_tuned
#
# NOTE: at global=256 the driver gather is 1/4 of production's 1024, so it
# may sit just under the GPU-0 OOM threshold. If it does NOT OOM, the gather
# mechanism is confirmed (smaller gather fits) but the definitive repro of
# the 1024-sample gather still needs the multi-node 4x8.
defaults:
  - /training/lora@training.lora: klein_rank16
  - /training/fsdp@training.fsdp: bf16_full_ac
  - /training/optimizer@training.optimizer: adam_5e-5
  - /training/lr_scheduler@training.lr_scheduler: constant_10k
  - override /placement: colocate_1x8
  - override /algorithm: grpo
  - override /model: flux2_klein_bf16
  - override /rollout/engine: trainside
  - override /sampling/sde_strategy: dance
  - override /sampling: klein_512
  - override /reward: pickscore
  - override /training/execution: standard
  - _self_
run:
  seed: 42
  num_rollouts: 10000
  data_source_dotpath: diffusionrl.data.data_source.MultimodalRLDataSource
  data_path: ${oc.env:PICKSCORE_DATA_PATH,/apdcephfs_zwfy8/share_305110755/hunyuan/rzhu/DiffusionRL/data/datasets/pickscore/train.txt}
  eval_data_path: ${oc.env:PICKSCORE_EVAL_DATA_PATH,/apdcephfs_zwfy8/share_305110755/hunyuan/rzhu/DiffusionRL/data/datasets/pickscore/test.txt}

sampling:
  samples_per_prompt: 16

algorithm:
  prompts_per_rollout: 16
  adv_normalization_scope: group
  use_global_std: false
  kl_coef: 0.0
  scheduler:
    timestep_fraction: [0.0, 0.5]
    num_sde_steps: 3
  algorithms:
    image:
      _target_: diffusionrl.algorithms.grpo.DiffusionGRPO
      stage_attr: diffusion
      clip_range: 5.0e-3
      clip_schedule: constant
      conditions_cls: diffusionrl.models.flux2_klein.conditions.Flux2KleinConditions
rollout:
  engine: {}
  plan:
    forward_batch_size: 16

# ----------------------------------------------------------------------
# New-stack training surface — Klein-specific GRPO algorithm subclass +
# Klein-specific LoRA targets + single Qwen3 text encoder.
# ----------------------------------------------------------------------

training:
  ema:
    decay: 0.99
    update_step_interval: 2
  materialize:
    with_aux: [vae, text_encoder]
  plan:
    # global = 16 prompts × 16 samples = 256
    # local  = global / 8 actors = 32   (identical to the tuned 4x8)
    # local_mini = local / 2 updates = 16
    # micro = 4 → 4 micros/update
    micro_batch_size: 4
    num_updates_per_batch: 2
    local_mini_batch_size: 16
    local_batch_size: 32
    global_batch_size: 256
  topology:
    actor_count: 8

logging:
  logging_steps: 1
  log_media: true
  media_max_items: 16
  report_to_wandb: true
  project_name: diffusionrl-flowgrpo-newstack
  tags:
    - flux2-klein-9b
    - dance
    - fsdp-trainside
    - pickscore
    - single-node

evaluation:
  eval_steps: 0
