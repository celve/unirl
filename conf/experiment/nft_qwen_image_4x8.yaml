# @package _global_
# DiffusionNFT Qwen-Image, 4 nodes x 8 GPUs.
defaults:
  - nft_qwen_image
  - override /placement: trainside_4x8
  - _self_

sampling:
  samples_per_prompt: 12
  height: 256
  width: 256

algorithm:

rollout:
  plan:
    forward_batch_size: 1

training:
  plan:
    global_batch_size: 576
    local_batch_size: 18
    local_mini_batch_size: 18
  topology:
    actor_count: 32

logging:
  run_name: ${oc.env:WANDB_RUN_NAME,Qwen-Image-NFT-4x8}
  tags: [qwen-image, t2i, nft, newstack, 4x8]

resume:
  output_dir: ${oc.env:OUTPUT_DIR,outputs/nft_qwen_image_4x8}
