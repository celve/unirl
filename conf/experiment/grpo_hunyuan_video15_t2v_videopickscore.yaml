# @package _global_
# GRPO HunyuanVideo-1.5 T2V recipe — direct-sampling on the Policy stack.
#
# Mirror of conf/experiment/grpo_hunyuan_veido1p5_t2v_videopickscore.yaml
# (PR #101 OLD) mapped onto the configured shape:
#   - rollout/engine: trainside (no separate rollout actor; train actors
#     host a TrainsideRolloutEngine that wraps the FSDP-wrapped bundle).
#   - cfg.training.policies: [LoRA, FSDP, EMA] — LoRA injection, FSDP
#     wrap, and EMA shadow live OUTSIDE the bundle (vs the OLD
#     HunyuanVeido1p5ModelBundle.load() doing it inline).
#   - cfg.algorithms.video: DiffusionGRPO — slot-keyed, replays the
#     rollout's SDE transitions via HunyuanVideo15DiffusionStage.replay.
#   - reward.components[0]: videopickscore — newly-registered scorer in
#     diffusionrl/reward/scorers/video_pickscore.py.
#
# σ schedule: HunyuanVideo-1.5 uses STATIC FlowMatch shift (no dynamic μ
# like Qwen-Image / SD3.5). cfg.model.shift=5.0 wins regardless of the
# checkpoint's scheduler_config.json.
#
# Pure T2V: cfg.model.load_vision_encoder=false frees ~1.6 GB of SigLIP
# GPU memory. The transformer's image_embeds input is still satisfied by
# a zero placeholder of shape
# [B, vision_num_semantic_tokens, vision_states_dim].
#
# Launch:
#   python -m diffusionrl.train +experiment=grpo_hunyuan_video15_t2v_videopickscore
defaults:
  - override /algorithm: grpo
  - override /model: hunyuan_video15
  - override /rollout/engine: trainside
  - override /sampling/sde_strategy: dance
  - _self_

run:
  seed: 42
  num_rollouts: 10000
  data_source_dotpath: diffusionrl.data.data_source.MultimodalRLDataSource
  data_path: ${oc.env:DATA_PATH}
  eval_data_path: ${oc.env:EVAL_DATA_PATH,${oc.env:DATA_PATH}}

sampling:
  num_inference_steps: 50
  guidance_scale: 6.0
  height: 480
  width: 480
  num_frames: 13
  seed: 42
  init_same_noise: false
  sde_config:
    eta: 1.0

algorithm:
  # Driver-side singular: feeds prompt batching, SDE-index scheduling,
  # and sampling scalars. TrainActor reads the plural `algorithms`
  # block below; the two are kept aligned but distinct.
  prompts_per_rollout: 48
  samples_per_prompt: 24
  adv_normalization_scope: group
  use_global_std: true
  clip_range: 1.0e-4
  clip_schedule: constant
  use_kl_penalty: true
  kl_coef: 0.0
  ema:
    eval_ema_decay: 0.99
    eval_ema_update_interval: 2
  scheduler:
    timestep_fraction: [0.0, 0.6]
    num_sde_steps: 8
  sde_config:
    eta: ${sampling.sde_config.eta}

model:
  # hunyuan_video15 (HunyuanVideo15PipelineConfig) is weights+params
  # only — LoRA, gradient checkpointing, and FSDP knobs live in
  # training.policies below.
  pretrained_model_ckpt_path: ${oc.env:HUNYUAN_VIDEO15_PATH,tencent/HunyuanVideo1.5}
  model_precision: bf16
  autocast_precision: bf16
  trajectory_precision: bf16
  logprob_precision: fp32
  # HunyuanVideo-1.5 ships with static shift = 5.0 in its
  # scheduler_config.json; passed here as a fallback.
  shift: 5.0
  # Pure T2V: skip the SigLIP vision encoder to free GPU memory. The
  # transformer's image_embeds input is satisfied by a zero placeholder
  # of shape [B, 729, 1152] (the latter is hardcoded into the
  # transformer's cross-attention projection — don't change unless you
  # also retrain the model).
  load_vision_encoder: false
  vision_num_semantic_tokens: 729
  vision_states_dim: 1152
  mllm_max_length: 1000
  mllm_crop_start: 108
  mllm_skip_layers: 2
  byt5_max_length: 256

rollout:
  engine: {}
  plan:
    forward_batch_size: 1

placement:
  num_rollout_nodes: 1
  num_rollout_gpus_per_node: 8
  num_rollout_gpus_per_actor: 1
  num_train_nodes: 1
  num_train_gpus_per_node: 8
  num_train_gpus_per_actor: 1
  colocate: true
  colocate_gpu_fraction: 0.9
  strategy: PACK

# ----------------------------------------------------------------------
# Training surface
# ----------------------------------------------------------------------
algorithms:
  # Slot ``video`` matches RolloutResp.rollout_traces["video"] emitted
  # by HunyuanVideo15Pipeline.generate.
  video:
    _target_: diffusionrl.algorithms.grpo.DiffusionGRPO
    stage_attr: diffusion
    clip_range: 1.0e-4
    clip_schedule: constant
    conditions_cls: diffusionrl.models.hunyuan_video15.conditions.HunyuanVideo15Conditions
    params:
      _target_: diffusionrl.models.hunyuan_video15.diffusion.HunyuanVideo15DiffusionParams
      num_inference_steps: ${sampling.num_inference_steps}
      guidance_scale: ${sampling.guidance_scale}
      height: ${sampling.height}
      width: ${sampling.width}
      num_frames: ${sampling.num_frames}
      seed: ${run.seed}
      eta: ${sampling.sde_config.eta}
      init_same_noise: ${sampling.init_same_noise}
      samples_per_prompt: ${algorithm.samples_per_prompt}
      noise_group_ids: null
      # sde_indices: null — resolved per-rollout by RolloutPipeline.

training:
  policy_source: diffusion
  policies:
    # LoRA injected first (closest to the bundle), then FSDP wraps the
    # adapted module. Targets mirror PR #101's
    # HunyuanVeido1p5ModelBundle.default_lora_target_modules() — the
    # MMDiT block uses a diffusers Attention with added-KV joint-attention
    # + FFN per stream.
    - _target_: diffusionrl.training.lora_policy.LoRAPolicy
      rank: 32
      alpha: 64
      dropout: 0.0
      target_modules:
        - attn.to_q
        - attn.to_k
        - attn.to_v
        - attn.to_out.0
        - attn.add_q_proj
        - attn.add_k_proj
        - attn.add_v_proj
        - attn.to_add_out
        - ff.net.0.proj
        - ff.net.2
        - ff_context.net.0.proj
        - ff_context.net.2
    - _target_: diffusionrl.training.fsdp_policy.FSDPPolicy
      cpu_offload: false
      param_dtype: bf16
      mixed_precision: true
      fsdp_mode: full
      reshard_after_forward: true
      # HunyuanVideo-1.5 is one of the largest models; activations under
      # full-graph replay are heavy even with LoRA, so AC stays on.
      activation_checkpointing: true
    - _target_: diffusionrl.training.ema_policy.EMAPolicy
      decay: 0.99
      update_step_interval: 2
  materialize:
    # HunyuanVideo-1.5 has dual text encoders (Qwen2.5-VL MLLM +
    # ByT5 glyph); vision encoder is opt-in via cfg.model.load_vision_encoder.
    with_aux: [vae, text_encoder, text_encoder_2]
  plan:
    micro_batch_size: 1
    num_updates_per_batch: 2
    local_mini_batch_size: 72
    local_batch_size: 144
    global_batch_size: 1152
  topology:
    actor_count: 8
  optimizer:
    learning_rate: 3.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: 1.0e-8
    weight_decay: 0.0
  lr_scheduler:
    type: constant
    warmup_steps: 0
    total_steps: 10000
  execution:
    max_grad_norm: 1.0
    offload_train: false
    offload_rollout: false

reward:
  aggregation_method: mean
  base_device: cuda
  components:
    - name: videopickscore
      weight: 1.0
      batch_size: 8

logging:
  logging_steps: 1
  log_media: false
  media_max_items: 8
  report_to_wandb: true
  project_name: diffusionrl-flowgrpo-newstack
  run_name: grpo_hunyuan_video15_t2v_videopickscore
  tags: [hunyuan_video15, t2v, grpo, videopickscore, newstack]

evaluation:
  eval_steps: 0
