# @package _global_
# GRPO WAN 2.1 T2V recipe — NEW Policy stack, trainside (direct-sampling).
#
# Mirror of conf/experiment/grpo_wan_t2v.yaml (legacy fsdp engine) mapped
# onto the new-stack shape: ``rollout/engine: trainside``,
# ``cfg.training.policies: [LoRA, FSDP]``, slot-keyed ``cfg.algorithms.video:
# DiffusionGRPO``.
#
# Anchored to a 1-node × 8-GPU pod (8 train actors = sampler). The math
# matches grpo_wan_t2v.yaml so behavioral parity is auditable:
#   global_batch       = prompts_per_rollout * samples_per_prompt = 48*16 = 768
#   local_batch_size   = global / actor_count = 768 / 8 = 96
#   local_mini_batch   = local / num_updates_per_batch = 96 / 2 = 48
#   micro_batch_size   = 1                              (T2V activations heavy)
#
# Launch via:
#   python -m diffusionrl.train_new +experiment=grpo_wan21_t2v_new
defaults:
  - override /algorithm: grpo
  - override /model: wan21_v2
  - override /rollout/engine: trainside
  - override /sampling/sde_strategy: flow
  - _self_

run:
  seed: 42
  num_rollouts: 1000
  data_source_dotpath: diffusionrl.data.data_source.MultimodalRLDataSource
  data_path: ${oc.env:DATA_PATH}
  eval_data_path: ${oc.env:EVAL_DATA_PATH,${oc.env:DATA_PATH}}

sampling:
  num_inference_steps: 14
  guidance_scale: 1.0
  height: 720
  width: 1280
  # num_frames=5 maps to 2 latent frames (temporal_downsample=4, so
  # T_lat = (5-1)//4 + 1 = 2) — fast iteration recipe that exercises the
  # full T2V pipeline including the temporal axis without the cost of
  # long videos. The WAN VAE requires ``(num_frames - 1) % 4 == 0``, so
  # valid choices are 1, 5, 9, 13, 17, 21, … . Bump ``num_frames`` for
  # actual video training.
  num_frames: 5
  seed: 42
  init_same_noise: false
  sde_config:
    eta: 0.7

algorithm:
  prompts_per_rollout: 48
  samples_per_prompt: 16
  adv_normalization_scope: group
  use_global_std: true
  clip_range: 1.0e-4
  clip_schedule: constant
  use_kl_penalty: false
  kl_coef: 0.0
  ema:
    eval_ema_decay: 0.9
    eval_ema_update_interval: 1
  scheduler:
    timestep_fraction: [0.0, 0.5]
  sde_config:
    eta: ${sampling.sde_config.eta}

# ----------------------------------------------------------------------
# New-stack training surface (mirrors flowgrpo_fast_sd3_trainside.yaml)
# ----------------------------------------------------------------------
algorithms:
  # Slot ``video`` matches RolloutResp.rollout_traces["video"] on WAN.
  # ``stage_attr: diffusion`` points the algorithm at the right stage on
  # WAN21Pipeline (which exposes ``self.diffusion``).
  video:
    _target_: diffusionrl.algorithms_new.grpo.DiffusionGRPO
    stage_attr: diffusion
    clip_range: 1.0e-4
    clip_schedule: constant
    conditions_cls: diffusionrl.models_new.wan21.conditions.WAN21Conditions
    params:
      # ALL request-shape params interpolate from the ``sampling`` block so
      # a CLI override of e.g. ``+sampling.height=512`` propagates to BOTH
      # rollout (which builds RolloutReq from sampling) AND replay (which
      # reads these params to recompute log-probs). Hardcoding any of
      # ``num_inference_steps`` / ``height`` / ``width`` / ``num_frames`` /
      # ``seed`` here would silently let rollout and replay use different
      # shapes → logprob recomputation mismatch → GRPO ratio drift.
      _target_: diffusionrl.models_new.wan21.diffusion.WAN21DiffusionParams
      num_inference_steps: ${sampling.num_inference_steps}
      guidance_scale: ${sampling.guidance_scale}
      height: ${sampling.height}
      width: ${sampling.width}
      num_frames: ${sampling.num_frames}
      seed: ${run.seed}
      eta: ${sampling.sde_config.eta}

placement:
  # Direct-sampling: train actors also sample; no separate rollout actor.
  num_rollout_nodes: 0
  num_rollout_gpus_per_node: 0

rollout:
  engine: {}
  plan:
    # Direct-sampling per-call chunk size (caps activation footprint
    # during 720p×1280 generate). Legacy: ``SAMPLING_FORWARD_BATCH``.
    forward_batch_size: 4

training:
  policy_source: diffusion
  policies:
    - _target_: diffusionrl.training_new.lora_policy.LoRAPolicy
      rank: 64
      alpha: 128
      dropout: 0.0
      # WAN transformer LoRA targets — diffusers ``WanTransformer3DModel``
      # uses ``attn1.*`` / ``attn2.*`` (self / cross attention) +
      # ``ffn`` projections + the final ``proj_out`` Linear. T2V omits
      # the image-cross-KV adders (``attn2.add_k_proj`` /
      # ``attn2.add_v_proj``) — those are I2V-only and live in the
      # ``grpo_wan21_i2v_new.yaml`` recipe.
      target_modules:
        - attn1.to_q
        - attn1.to_k
        - attn1.to_v
        - attn1.to_out.0
        - attn2.to_q
        - attn2.to_k
        - attn2.to_v
        - attn2.to_out.0
        - ffn.net.0.proj
        - ffn.net.2
        - proj_out
    - _target_: diffusionrl.training_new.fsdp_policy.FSDPPolicy
      cpu_offload: false
      param_dtype: bf16
      mixed_precision: true
      fsdp_mode: full
      reshard_after_forward: true
      # WAN T2V replay activations under full transformer autograd are
      # heavy at 720p×1280; AC recomputes block forwards during backward
      # to cut activation memory roughly in half (matches SD3 trainside).
      activation_checkpointing: true
  materialize:
    # WAN21Bundle eager-loads; ``with_aux`` is a no-op here but kept for
    # parity with the SD3 / HI3 recipes — Bundle.from_config already
    # loads VAE + text_encoder on every train actor.
    with_aux: []
  plan:
    # 1 node × 8 GPUs = 8 train actors
    # global_batch = prompts_per_rollout * samples_per_prompt = 48 * 16 = 768
    micro_batch_size: 1
    num_updates_per_batch: 2
    local_mini_batch_size: 48     # 768 / 8 / 2
    local_batch_size: 96          # local_mini_batch_size * num_updates
    global_batch_size: 768
  topology:
    actor_count: 8
  optimizer:
    learning_rate: 3.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: 1.0e-8
    weight_decay: 0.0
  lr_scheduler:
    type: constant
    warmup_steps: 0
    total_steps: 1000
  execution:
    max_grad_norm: 1.0
    offload_train: false
    offload_rollout: false

model:
  pretrained_model_ckpt_path: ${oc.env:PRETRAINED_MODEL,Wan-AI/Wan2.1-T2V-1.3B-Diffusers}
  model_precision: bf16
  autocast_precision: bf16
  trajectory_precision: fp16
  logprob_precision: fp32
  shift: 5.0
  max_sequence_length: 512

reward:
  aggregation_method: mean
  base_device: cuda
  components:
    # ``video`` wraps a frame-level scorer (pickscore by default) with a
    # temporal-consistency term. ``sample_frames=1`` selects only the
    # first frame for PickScore. Same convention as legacy
    # ``grpo_wan_t2v.yaml``.
    - name: video
      weight: 1.0
      batch_size: 8
      inner_model_name: pickscore
      temporal_weight: 0.3
      alignment_weight: 0.7
      sample_frames: 1

logging:
  logging_steps: 1
  log_media: true
  media_max_items: 8
  report_to_wandb: true
  project_name: diffusionrl-grpo-t2v-newstack
  run_name: grpo_wan21_t2v_new
  tags: [wan21, t2v, grpo, video, pickscore, new-stack]

evaluation:
  eval_steps: 60

resume:
  save_steps: 60
