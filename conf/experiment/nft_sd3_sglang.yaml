# @package _global_
# DiffusionNFT SD3 — SGLang separate-mode variant of nft_sd3.
#
# NFT + SGLang rollout engine in separate mode: train and rollout actors
# live on disjoint GPUs (default 4+4 per 8-GPU node). NFT is a
# forward-process algorithm — it does not consume rollout-side log_probs,
# so logprob_source is kept at ``replay`` for parity with GRPO-SGLang.
#
# Used by:
#   reproduce_scripts/train_nft_sd3_sglang_multinode.sh
#
# Anchored to a 2-node x 8-GPU cluster split 4-train / 4-rollout per node,
# giving 8 single-GPU SGLang rollout actors (TP=1) and 8 FSDP train actors.
defaults:
  - nft_sd3
  - /sync: nccl_broadcast
  - override /rollout/engine: sglang
  - _self_

rollout:
  engine:
    tp_size: 1
    logprob_source: replay
    engine_kwargs:
      model_type: sd3
  plan:
    forward_batch_size: 24

placement:
  colocate: false
  num_train_gpus_per_node: 4
  num_rollout_gpus_per_node: 4
  num_rollout_gpus_per_actor: 1

training:
  plan:
    # Rebased for 2 nodes x 4 train GPUs = 8 train actors.
    # global = prompts*samples = 768, num_updates=1.
    micro_batch_size: 8
    num_updates_per_batch: 1
    local_mini_batch_size: 96    # = 768 / 8 / 1
    local_batch_size: 96         # = local_mini_batch_size * num_updates_per_batch
    global_batch_size: 768       # = prompts_per_rollout * samples_per_prompt
  topology:
    actor_count: 8               # 2 nodes x 4 train GPUs

logging:
  tags: [reproduce, sd3.5, nft, sglang, pickscore, multinode]
