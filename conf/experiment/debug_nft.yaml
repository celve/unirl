# @package _global_
# DiffusionNFT SD3 — debug-mode short-loop variant of nft_sd3.
#
# Used by:
#   reproduce_scripts/debug_nft.sh
#
# Inherits the full nft_sd3 recipe (model, reward, algorithm, batch geometry,
# placement) and overrides only the debug-specific knobs: 3 rollouts instead
# of 10000, eval every rollout, no wandb reporting, larger guidance scale for
# faster visual feedback.
defaults:
  - nft_sd3
  - _self_

run:
  num_rollouts: 3

sampling:
  guidance_scale: 4.5

evaluation:
  eval_steps: 1

logging:
  report_to_wandb: false
