# @package _global_
# FLUX.2-klein-9B GRPO production recipe — 4 nodes × 8 GPUs = 32 actors,
# direct-sampling on the NEW Policy stack.
#
# Faithful port of the hyperparameters from
# ``main_flux_bundle/reproduce_scripts/train_grpo_flux2_klein9b_sglang_multinode.sh``
# (the "carefully tuned" recipe the user said NOT to change).
#
# Batch geometry (5 core knobs, the rest follow):
#
#   prompts_per_rollout = 64
#   samples_per_prompt  = 16    -> global_batch_size = 1024
#   actor_count         = 32    -> local_batch_size  = 1024 / 32 = 32
#   num_updates_per_batch = 2   -> local_mini        = 32 / 2 = 16
#   micro_batch_size    = 4     -> 4 micros / update
#
# Klein-specific recipe knobs (kept verbatim from the legacy script):
#
#   sde_type       = dance       (empirical-mu schedule via
#                                Flux2KleinSchedulePolicy.compute_sigma)
#   num_inference_steps = 10
#   num_sde_steps  = 3
#   timestep_fraction = [0.0, 0.5]
#   eta            = 0.7
#   clip_range     = 5.0e-3      (loosened vs SD3's 1e-4 — Klein sigmas
#                                are heavily skewed to 1.0 and the
#                                ratio drifts past 1±1e-4 fast)
#   kl_coef        = 0.0         (legacy used 0.005; dropped — base GRPO
#                                has no KL and no other model uses it)
#   adv_norm_scope = group
#   use_global_std = false
#   guidance_scale = 1.0         (Klein transformer ignores guidance,
#                                kept for API symmetry)
#   height x width = 512 x 512
#   lora_rank      = 16          (lower than SD3's 32 — keep close to base)
#   lora_alpha     = 32
#   learning_rate  = 5.0e-5
#   fsdp_precision = fp32        (Klein's empirical-mu schedule is
#                                numerically sensitive; bf16 master
#                                weights drift reward after ~hundred
#                                rollouts)
#   logprob_precision   = fp32   (PPO ratio stability)
#   trajectory_precision = fp16  (rollout cache fits in 30GB / actor)
#
# Launch via the matching shell script:
#
#   bash reproduce_scripts/train_grpo_flux2_klein9b_4x8_multinode.sh
defaults:
  - override /algorithm: grpo
  - override /model: flux2_klein_v2
  - override /rollout/engine: trainside
  - override /sampling/sde_strategy: dance
  - _self_

run:
  seed: 42
  num_rollouts: 10000
  data_source_dotpath: diffusionrl.data.data_source.MultimodalRLDataSource
  data_path: ${oc.env:PICKSCORE_DATA_PATH,/apdcephfs_zwfy8/share_305110755/hunyuan/rzhu/DiffusionRL/data/datasets/pickscore/train.txt}
  eval_data_path: ${oc.env:PICKSCORE_EVAL_DATA_PATH,/apdcephfs_zwfy8/share_305110755/hunyuan/rzhu/DiffusionRL/data/datasets/pickscore/test.txt}

sampling:
  num_inference_steps: 10
  guidance_scale: 1.0
  height: 512
  width: 512
  seed: 42
  init_same_noise: true
  sde_config:
    eta: 0.7

algorithm:
  prompts_per_rollout: 64
  samples_per_prompt: 16
  adv_normalization_scope: group
  use_global_std: false
  clip_range: 5.0e-3
  clip_schedule: constant
  use_kl_penalty: true
  kl_coef: 0.0
  ema:
    eval_ema_decay: 0.99
    eval_ema_update_interval: 2
  scheduler:
    timestep_fraction: [0.0, 0.5]
    num_sde_steps: 3
  sde_config:
    eta: ${sampling.sde_config.eta}

model:
  pretrained_model_ckpt_path: ${oc.env:FLUX2_KLEIN_PATH,/apdcephfs_zwfy8/share_305110755/hunyuan/public_models/black-forest-labs/FLUX.2-klein-base-9B}
  model_precision: bf16
  autocast_precision: bf16
  trajectory_precision: fp16
  logprob_precision: fp32

rollout:
  engine: {}
  plan:
    forward_batch_size: 16

placement:
  num_rollout_nodes: 4
  num_rollout_gpus_per_node: 8
  num_rollout_gpus_per_actor: 1
  num_train_nodes: 4
  num_train_gpus_per_node: 8
  num_train_gpus_per_actor: 1
  colocate: true
  colocate_gpu_fraction: 0.9
  strategy: PACK

# ----------------------------------------------------------------------
# New-stack training surface — Klein-specific GRPO algorithm subclass +
# Klein-specific LoRA targets + single Qwen3 text encoder.
# ----------------------------------------------------------------------
algorithms:
  image:
    _target_: diffusionrl.algorithms.grpo.DiffusionGRPO
    stage_attr: diffusion
    clip_range: 5.0e-3
    clip_schedule: constant
    conditions_cls: diffusionrl.models.flux2_klein.conditions.Flux2KleinConditions
    params:
      _target_: diffusionrl.models.flux2_klein.diffusion.Flux2KleinDiffusionParams
      num_inference_steps: ${sampling.num_inference_steps}
      guidance_scale: ${sampling.guidance_scale}
      height: ${sampling.height}
      width: ${sampling.width}
      seed: ${sampling.seed}
      eta: ${sampling.sde_config.eta}
      init_same_noise: ${sampling.init_same_noise}

training:
  policy_source: diffusion
  policies:
    - _target_: diffusionrl.training.lora_policy.LoRAPolicy
      rank: 16
      alpha: 32
      dropout: 0.0
      # Klein canonical LoRA targets — mirrors
      # ``Flux2ModelBundle.default_lora_target_modules()`` in the
      # legacy codebase. PEFT silently drops any name that doesn't
      # match a real submodule, so listing both un-fused and fused
      # projection names is safe.
      target_modules:
        - to_q
        - to_k
        - to_v
        - to_out.0
        - proj_in
        - proj_out
        - qkv_proj
        - ff_proj
    - _target_: diffusionrl.training.fsdp_policy.FSDPPolicy
      cpu_offload: false
      # Klein's empirical-mu schedule is numerically sensitive; the
      # legacy recipe uses ``FSDP_PRECISION=fp32`` for the master
      # weights and bf16 mixed-precision for the forward.
      param_dtype: fp32
      mixed_precision: true
      fsdp_mode: full
      reshard_after_forward: true
      # 9B transformer + LoRA + full replay graph is the hot path
      # for activation memory; AC keeps the 80GB H20 envelope.
      activation_checkpointing: true
    - _target_: diffusionrl.training.ema_policy.EMAPolicy
      decay: 0.99
      update_step_interval: 2
  materialize:
    with_aux: [vae, text_encoder]
  plan:
    # global = 64 prompts × 16 samples = 1024
    # local  = global / 32 actors = 32
    # local_mini = local / 2 updates = 16
    # micro = 4 → 4 micros/update
    micro_batch_size: 4
    num_updates_per_batch: 2
    local_mini_batch_size: 16
    local_batch_size: 32
    global_batch_size: 1024
  topology:
    actor_count: 32
  optimizer:
    learning_rate: 5.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: 1.0e-8
    weight_decay: 0.0
  lr_scheduler:
    type: constant
    warmup_steps: 0
    total_steps: 10000
  execution:
    max_grad_norm: 1.0
    offload_train: false
    offload_rollout: false

reward:
  aggregation_method: mean
  base_device: cuda
  components:
    - name: pickscore
      weight: 1.0
      batch_size: 8

logging:
  logging_steps: 1
  log_media: true
  media_max_items: 16
  report_to_wandb: true
  project_name: diffusionrl-flowgrpo-newstack
  tags:
    - reproduce
    - flux2-klein-9b
    - dance
    - fsdp-trainside
    - pickscore
    - multinode

evaluation:
  eval_steps: 0
