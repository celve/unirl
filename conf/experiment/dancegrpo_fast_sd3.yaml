# @package _global_
# DanceGRPO-Fast SD3.5 recipe — trainside direct-sampling.
#
# Imported from PR #109's training recipe and mapped onto the current
# Policy stack shape. The only algorithmic difference from
# flowgrpo_fast_sd3_trainside is the Dance SDE kernel selected through
# ``sampling/sde_strategy: dance``; launcher scripts only select this
# experiment and provide environment-dependent paths.
defaults:
  - flowgrpo_fast_sd3_trainside
  - override /sampling/sde_strategy: dance
  - _self_

run:
  seed: 42
  num_rollouts: 10000
  data_path: ${oc.env:DATA_PATH,/mnt/bj/data/datasets/pickscore/train.txt}
  eval_data_path: ${oc.env:EVAL_DATA_PATH,/mnt/bj/data/datasets/pickscore/test.txt}

sampling:
  sde_config:
    eta: 0.7

algorithm:
  prompts_per_rollout: 48
  samples_per_prompt: 16
  scheduler:
    timestep_fraction: [0.0, 0.5]
    num_sde_steps: 3
  sde_config:
    eta: ${sampling.sde_config.eta}

placement:
  num_rollout_nodes: 2
  num_rollout_gpus_per_node: 8
  num_train_nodes: 2
  num_train_gpus_per_node: 8

training:
  plan:
    micro_batch_size: 8
    num_updates_per_batch: 2
    local_mini_batch_size: 24
    local_batch_size: 48
    global_batch_size: 768
  topology:
    actor_count: 16

logging:
  project_name: diffusionrl-dancegrpo
  run_name: ${oc.env:WANDB_RUN_NAME,dancegrpo_fast_sd3}
  report_to_wandb: ${oc.decode:${oc.env:REPORT_TO_WANDB,true}}
  tags: [sd3.5, dancegrpo, grpo, trainside]

resume:
  output_dir: ${oc.env:OUTPUT_DIR,outputs/dancegrpo_fast_sd3}
