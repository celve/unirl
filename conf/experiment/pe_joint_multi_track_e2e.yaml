# @package _global_
# PE-joint multi-track END-TO-END test: ARGRPO over Qwen3-0.6B +
# DiffusionGRPO over SD3.5-medium, composed via the LIN-279
# ComposedRolloutEngine, scored by pickscore, trained on a 1x8 H20
# colocate pod.
#
# Scale-up from pe_joint_multi_track_smoke.yaml at the SAME model sizes
# (Qwen3-0.6B + SD3.5-medium) — the e2e isolates the batch-geometry
# scaling axis. Promote to Qwen3-8B as a separate follow-up once this
# passes.
#   smoke    : P=4 N=2 M=2  →  16 SD samples / rollout
#   this e2e : P=6 N=4 M=4  →  96 SD samples / rollout (6x)
#
# First attempt with P=6 N=8 M=16 (768 samples, 48x) hit CUDA OOM in
# DenoisingStage: the SD3 forward at M=16 needed +12 GB activations on
# top of the resident sgl engines + offloaded-but-not-fully-released
# train actor (sum ≈ 92 GB / 95 GB). Stepped down to N=M=4 (2x smoke
# each) so per-actor diffusion forward batch is 4 (vs 2 smoke; 16 OOM).
# Group sizes (N for LLM, M for diff) must also be equal for the per-
# track advantage validator — N=M=4 satisfies both.
#
# Memory budget on 95 GB H20 (0.6B LLM):
#   Rollout phase: sgl-LLM (mem_frac=0.20 → 19 GB) + sgl-diff (0.30 →
#     28.5 GB) + activations ≈ 60 GB ✓ (leaves 35 GB for forward peak)
#   Train phase  : Qwen3-0.6B BF16 (1.5 GB) + SD3.5 BF16 (24 GB) + LoRA
#     optim (~0.5 GB) + FSDP shards (~5 GB) + activations (~12 GB) ≈ 43 GB ✓
#   offload_train/rollout = true kept on to validate the time-slicing path
#   that 8B promotion will eventually require.
#
# Success: rollout/diffusion/reward_mean trends upward over ~30 rollouts;
# both per-track losses finite; ratios in [0.6, 1.8]; no NaN; no OOM.
defaults:
  - /sync@sync: tensor_payload
  # Compose typed schemas at the per-track paths — see smoke yaml lines
  # 27-36 for why this is needed (dict materialization → AttributeError
  # otherwise).
  - /training/track@training.tracks.diffusion: default
  - /training/track@training.tracks.ar: default
  - /model@training.tracks.diffusion.model: sd3
  - /model@training.tracks.ar.model: qwen3_v2
  - override /algorithm: grpo
  - override /rollout/engine: composed_pe
  - override /sampling/sde_strategy: flow
  - _self_

run:
  data_source_dotpath: diffusionrl.data.data_source.MultimodalRLDataSource
  # 100 rollouts is enough to see the reward growth signal per the e2e
  # caveat ("reward curve grows instead of fluctuating at an early
  # point"). Promote to 1000 once trend is confirmed.
  num_rollouts: 1000
  seed: 42
  data_path: /root/diffusionrl/data/datasets/pickscore/train.txt
  eval_data_path: /root/diffusionrl/data/datasets/pickscore/test.txt
  weight_sync_interval: 1

sampling:
  # Fast 4-step flow with shift=3.0 (reference recipe's choice).
  # Smoke used 20 steps; the e2e budget-checks the fast path that the
  # production recipe will use.
  num_inference_steps: 4
  guidance_scale: 1.0
  height: 512
  width: 512
  init_same_noise: false
  eta: 0.7
  samples_per_prompt: 16

algorithm:
  prompts_per_rollout: 6              # P
  samples_per_prompt: 16              # M (images per rewrite)
  pe_rewrites_per_prompt: 4           # N (rewrites per prompt)
  adv_normalization_scope: global
  use_global_std: true
  clip_range: 1.0e-4
  clip_schedule: constant
  use_kl_penalty: true
  kl_coef: 0.0                        # reference-model KL is a follow-up
  scheduler:
    timestep_fraction: [0.0, 1.0]
    num_sde_steps: 2
  algorithms:
    # Track keys MUST match cfg.training.tracks.<name> AND the engine's
    # emitted track names. ComposedRolloutEngine emits {"ar", "diffusion"}.
    ar:
      name: ar_grpo
      stage_attr: ar
      conditions_cls: diffusionrl.models.qwen3.conditions.Qwen3ARConditions
      clip_range: 1.0e-4
      clip_schedule: constant
    diffusion:
      name: diffusion_grpo
      stage_attr: diffusion
      conditions_cls: diffusionrl.models.sd3.conditions.SD3Conditions
      clip_range: 1.0e-4
      clip_schedule: constant
      params:
        _target_: diffusionrl.types.sampling.DiffusionSamplingParams
        num_inference_steps: ${sampling.num_inference_steps}
        guidance_scale: ${sampling.guidance_scale}
        height: ${sampling.height}
        width: ${sampling.width}
        seed: ${run.seed}
        sde_indices: null
        eta: ${sampling.eta}
        init_same_noise: ${sampling.init_same_noise}
        samples_per_prompt: 16          # M (smoke: 2)
        noise_group_ids: null
        max_sequence_length: 256

model:
  pretrained_model_ckpt_path: ${oc.env:PRETRAINED_MODEL,/root/diffusionrl/models/local/stable-diffusion-3.5-medium}

rollout:
  engine:
    ar:
      name: sglang_llm
      pretrained_model_ckpt_path: ${oc.env:LLM_MODEL,/root/diffusionrl/models/local/Qwen3-0.6B}
      tp_size: 1
      max_new_tokens: 256
      temperature: 0.7
      top_p: 0.9
      concurrency: 4
      engine_kwargs:
        mem_fraction_static: 0.05
        skip_server_warmup: true
        disable_cuda_graph: false
        attention_backend: triton
        enable_lora: true
        max_lora_rank: 16
        lora_target_modules: [q_proj, k_proj, v_proj, o_proj]

    diffusion:
      name: sglang
      sampling: ${sampling}
      model_family: sd3
      num_gpus: 1
      tp_size: 1
      local_mode: true
      engine_kwargs:
        mem_fraction_static: 0
        skip_server_warmup: true
        disable_cuda_graph: true
        attention_backend: torch_sdpa
    sleep_diffusion_on_start: false
  plan:
    # Per-actor per-rollout sample count: P*sp*N*M / actor_count
    # = 6*4*4*4 / 8 = 48 (driver pre-expands by sp; composed engine
    # branches by N*M; see rollout/pipeline.py:365).
    # rollout_actor.generate chunks `req` at this size (see
    # ray/rollout_actor.py:217 → chunked_engine_generate_req). With
    # forward_batch_size=4 sgl-diff peaked at 74 GB; halving to 2
    # should approximately halve the per-chunk SD3 + VAE-decode peak.
    forward_batch_size: 1

placement:
  num_rollout_nodes: 1
  num_rollout_gpus_per_node: 8
  num_rollout_gpus_per_actor: 1
  num_train_nodes: 1
  num_train_gpus_per_node: 8
  num_train_gpus_per_actor: 1
  colocate: true
  # 2-role colocate (rollout actor + train actor); the composed engine
  # handles the 4-phase sleep/wake (LLM-gen → SD-gen → SD-train → LLM-train)
  # internally. 0.5 fraction per role evenly splits the 8 GPUs.
  colocate_gpu_fraction: 0.5
  strategy: PACK
  allow_noset_multi_gpu_inference: true

training:
  primary_track: diffusion

  tracks:
    diffusion:
      model:
        pretrained_model_ckpt_path: ${model.pretrained_model_ckpt_path}
        model_precision: bf16
        autocast_precision: bf16
        trajectory_precision: bf16
        logprob_precision: fp32
      source_stage_attr: diffusion
      lora:
        rank: 16
        alpha: 32
        dropout: 0.0
        bias: none
        task_type: FEATURE_EXTRACTION
        target_modules:
          - attn.add_k_proj
          - attn.add_q_proj
          - attn.add_v_proj
          - attn.to_add_out
          - attn.to_k
          - attn.to_out.0
          - attn.to_q
          - attn.to_v
      fsdp:
        cpu_offload: false
        param_dtype: bf16
        mixed_precision: true
        fsdp_mode: hybrid
        reshard_after_forward: true
        activation_checkpointing: true
      optimizer:
        learning_rate: 3.0e-4
        adam_beta1: 0.9
        adam_beta2: 0.999
        adam_epsilon: 1.0e-8
        weight_decay: 1.0e-4
      lr_scheduler:
        type: constant
        warmup_steps: 0
        total_steps: 1000

    ar:
      model:
        pretrained_model_ckpt_path: ${oc.env:LLM_MODEL,/root/diffusionrl/models/local/Qwen3-0.6B}
        model_precision: bf16
        use_lora: true
        lora_target_modules: [q_proj, k_proj, v_proj, o_proj]
      source_stage_attr: ar
      lora:
        rank: 16
        alpha: 32
        dropout: 0.0
        target_modules: [q_proj, k_proj, v_proj, o_proj]
        bias: none
        task_type: CAUSAL_LM
      fsdp:
        cpu_offload: false
        param_dtype: bf16
        mixed_precision: true
        fsdp_mode: hybrid
        reshard_after_forward: true
        activation_checkpointing: true
      optimizer:
        learning_rate: 1.0e-5
        adam_beta1: 0.9
        adam_beta2: 0.999
        adam_epsilon: 1.0e-8
        weight_decay: 0.0
      lr_scheduler:
        type: constant
        warmup_steps: 0
        total_steps: 1000
      # Per-track micro override. Smoke runs with micro=1 (default from
      # cfg.training.plan); we keep micro=2 here as a forward-compat marker
      # for the 8B promotion. At 0.6B the activations are negligible
      # either way.
      plan_overrides:
        micro_batch_size: 2

  topology:
    actor_count: 8
  plan:
    # P*N*M = 6*4*16 = 384 diffusion samples per rollout
    # P*N   = 6*4    = 24 LLM sequences per rollout
    # Per-actor (DP=8): diffusion 48, llm 3.
    micro_batch_size: 4
    num_updates_per_batch: 2
    local_mini_batch_size: 48
    local_batch_size: 96
    global_batch_size: 768
  execution:
    max_grad_norm: 1.0
    # Time-slice train and rollout memory via offload. With offload=false
    # the smoke fits at small scale (M=2), but the first OOM attempt
    # showed train actor sits at 12.93 GB during rollout phase even with
    # offload, so we still need it to drain peak when sgl engines and
    # SD3 forward all compete for the 95 GB.
    offload_train: true
    offload_rollout: true
  materialize:
    with_aux: []

reward:
  aggregation_method: mean
  base_device: cuda
  components:
    pickscore:
      weight: 1.0
      batch_size: 16

logging:
  logging_steps: 1
  log_media: false
  report_to_wandb: true
  project_name: pe-joint-e2e
  run_name: pe-joint-e2e-${now:%m%d-%H%M}
  entity: linyuwus

evaluation:
  eval_steps: 0
