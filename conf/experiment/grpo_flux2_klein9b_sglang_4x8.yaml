# @package _global_
# FLUX.2-klein-9B GRPO recipe — SGLang rollout engine, 4 nodes x 8 GPUs.
#
# Derived from grpo_flux2_klein9b_trainside_4x8.yaml (the production
# trainside recipe). Swaps the rollout engine from trainside (in-process
# FSDP-wrapped sampling) to SGLang (separate worker process per actor,
# weight-synced from the trainer). Klein-specific hyperparameters mostly
# follow the production trainside recipe; this SGLang variant uses bf16 FSDP
# so LoRA tensors stay compatible with rollout-side kernels without adding a
# separate wire-dtype cast path.
#
# Batch geometry (identical to the trainside 4x8 recipe):
#
#   prompts_per_rollout    = 64
#   samples_per_prompt     = 16    -> global_batch_size = 1024
#   actor_count            = 32    -> local_batch_size  = 32
#   num_updates_per_batch  = 2     -> local_mini_batch  = 16
#   micro_batch_size       = 4     -> 4 micros / update
#
# Klein-specific recipe knobs (kept verbatim from trainside 4x8):
#
#   sde_type            = dance     (Flux2KleinSchedulePolicy + DanceSDEStrategy)
#   num_inference_steps = 10        (from /sampling: klein_512)
#   num_sde_steps       = 3
#   timestep_fraction   = [0.0, 0.5]
#   eta                 = 0.7
#   clip_range          = 5.0e-3    (loosened vs SD3's 1e-4 — Klein sigmas
#                                   are heavily skewed to 1.0; ratio drifts
#                                   past 1+/-1e-4 fast)
#   kl_coef             = 0.0
#   adv_norm_scope      = group
#   use_global_std      = false
#   guidance_scale      = 1.0       (Klein transformer ignores guidance)
#   height x width      = 512 x 512
#   lora_rank           = 16        (klein_rank16 preset)
#   lora_alpha          = 32
#   learning_rate       = 1.0e-4    (raised from adam_5e-5 preset's 5.0e-5
#                                   per user request — see in-line override
#                                   under training.tracks.image.optimizer)
#   fsdp_precision      = bf16      (bf16_full_ac preset; keeps LoRA wire
#                                   dtype compatible with rollout kernels)
#   logprob_precision   = fp32
#   trajectory_precision = fp16
#
# SGLang-specific configuration:
#
#   logprob_source      = replay    (trainer recomputes logprob via
#                                   Flux2KleinDiffusionStage.replay; the
#                                   SGLang fork does NOT need to emit
#                                   trajectory_log_probs.)
#   populate_conditions = true      (SGLang's Klein pipeline emits 15360-dim
#                                   Qwen3-layer-concat prompt_embeds;
#                                   _build_text_conditions packs them
#                                   shape-agnostically into TextEmbedCondition,
#                                   which Klein consumes verbatim. Empty
#                                   conditions would crash trainer-side
#                                   replay — there is no fallback path.)
#   sde_strategy        = dance     (canonical_name "dance" maps to SGLang
#                                   kernel label "dance" via the engine's
#                                   _resolve_sde_label; the fork must
#                                   register the Dance SDE kernel under
#                                   that exact identifier.)
#   model_family        = flux2_klein
#   sync mode           = tensor_payload
#   placement           = colocate_4x8_half (SGLang and train actors share
#                                   each GPU bundle 0.5 + 0.5 = 1.0;
#                                   offload_both is required to time-share.)
#
# Upstream SGLang fork prerequisites (engine fails fast otherwise):
#
#   1. FLUX.2-klein pipeline registered. DiffGenerator.from_pretrained
#      will raise if the fork's runtime does not know how to load Klein
#      (Qwen3 text encoder + 9B Flux2Transformer2DModel + 32-ch VAE).
#   2. Dance SDE kernel registered under string "dance" in the fork's
#      ``rollout_sde_type`` dispatch (see ``_resolve_sde_label`` in
#      ``diffusionrl/rollout/engine/sglang/engine.py``). If the fork uses
#      a different identifier (e.g. "flux2_dance"), patch that one-line
#      mapping rather than this recipe.
#
# Validation (iter-0 ratio sanity check):
#
#   Because logprob_source=replay, the rollout-side SDE kernel (in SGLang)
#   and the trainer-side replay (Flux2KleinDiffusionStep.step_with_logp)
#   must compute prev_mean identically. On iter-0 the importance ratio
#   policy_log_probs / old_log_probs is reconstructed from the SAME
#   trajectory by both sides, so ratio should be ~= 1.0 (within fp32
#   noise). Any non-trivial drift on iter-0 means the SGLang fork's Dance
#   kernel diverges from our SDE math.
#
# Launch:
#
#   bash scripts/run_experiment_multinode_taiji.sh grpo_flux2_klein9b_sglang_4x8
#
#   (Or call ``python -m diffusionrl.train +experiment=grpo_flux2_klein9b_sglang_4x8 ...``.)
defaults:
  - /sync@sync: tensor_payload
  - /training/track@training.tracks.image: default
  - /model@training.tracks.image.model: flux2_klein_v2
  - /training/lora@training.tracks.image.lora: klein_rank16
  - /training/fsdp@training.tracks.image.fsdp: bf16_full_ac
  - /training/optimizer@training.tracks.image.optimizer: adam_5e-5
  - /training/lr_scheduler@training.tracks.image.lr_scheduler: constant_10k
  # SGLang colocate needs a half-fraction placement preset (rollout + train
  # share each bundle, 0.5 + 0.5 = 1.0). The non-half ``colocate_4x8`` (0.9)
  # is for trainside-only recipes; using it here over-subscribes the bundle
  # and train actors hang forever in ``health_check.remote()`` (GPU util 0).
  - override /placement: colocate_4x8_half
  - override /algorithm: grpo
  - override /model: flux2_klein_v2
  - override /rollout/engine: sglang
  - override /sampling/sde_strategy: dance
  - override /sampling: klein_512
  - override /reward: pickscore
  - override /training/execution: offload_both
  - _self_
run:
  seed: 42
  num_rollouts: 10000
  data_source_dotpath: diffusionrl.data.data_source.MultimodalRLDataSource
  data_path: ${oc.env:PICKSCORE_DATA_PATH,/apdcephfs_zwfy8/share_305110755/hunyuan/rzhu/DiffusionRL/data/datasets/pickscore/train.txt}
  eval_data_path: ${oc.env:PICKSCORE_EVAL_DATA_PATH,/apdcephfs_zwfy8/share_305110755/hunyuan/rzhu/DiffusionRL/data/datasets/pickscore/test.txt}
  weight_sync_interval: 1

sampling:
  samples_per_prompt: 16

algorithm:
  prompts_per_rollout: 64
  adv_normalization_scope: group
  use_global_std: false
  kl_coef: 0.0
  scheduler:
    timestep_fraction: [0.0, 0.5]
    num_sde_steps: 3
  algorithms:
    image:
      name: diffusion_grpo
      stage_attr: diffusion
      conditions_cls: diffusionrl.models.flux2_klein.conditions.Flux2KleinConditions
      clip_range: 5.0e-3
      clip_schedule: constant

model:
  pretrained_model_ckpt_path: ${oc.env:FLUX2_KLEIN_PATH,/apdcephfs_zwfy8/share_305110755/hunyuan/public_models/black-forest-labs/FLUX.2-klein-base-9B}
  model_precision: bf16
  autocast_precision: bf16
  trajectory_precision: fp16
  logprob_precision: fp32

rollout:
  engine:
    model_family: flux2_klein
    tp_size: 1
    logprob_source: replay
    populate_conditions: true
    init_same_noise: ${sampling.init_same_noise}
    engine_kwargs:
      model_type: flux2_klein
  plan:
    forward_batch_size: ${oc.decode:${oc.env:FBS,8}}

training:
  primary_track: image
  tracks:
    image:
      model:
        pretrained_model_ckpt_path: ${model.pretrained_model_ckpt_path}
        model_precision: ${model.model_precision}
        autocast_precision: ${model.autocast_precision}
        trajectory_precision: ${model.trajectory_precision}
        logprob_precision: ${model.logprob_precision}
      source_stage_attr: diffusion
      optimizer:
        learning_rate: 1.0e-4
      ema:
        target_decay: 0.99
        timing: optimizer_step
  topology:
    actor_count: 32
  plan:
    micro_batch_size: 4
    num_updates_per_batch: 2
    local_mini_batch_size: 16
    local_batch_size: 32
    global_batch_size: 1024
  materialize:
    with_aux: []

logging:
  logging_steps: 1
  log_media: true
  media_max_items: 16
  report_to_wandb: ${oc.decode:${oc.env:REPORT_TO_WANDB,true}}
  project_name: diffusionrl-flowgrpo-newstack
  run_name: ${oc.env:WANDB_RUN_NAME,flux2_klein9b_grpo_sglang_4x8}
  tags:
    - reproduce
    - flux2-klein-9b
    - dance
    - sglang
    - colocate
    - pickscore
    - multinode

resume:
  output_dir: ${oc.env:OUTPUT_DIR,outputs/grpo_flux2_klein9b_sglang_4x8}

evaluation:
  eval_steps: 0
