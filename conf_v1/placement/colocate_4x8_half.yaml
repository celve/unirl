# 4-node x 8-GPU colocate preset for SGLang (or any other separate-sampling)
# mode where the rollout and train actors share each GPU bundle. Each actor
# claims half the GPU (``colocate_gpu_fraction: 0.5``) so rollout + train
# sum to 1.0 per bundle and Ray can actually schedule both — anything above
# 0.5 here over-subscribes the bundle and the train actor hangs forever in
# ``health_check.remote()`` (GPU util sits at 0). The non-half ``colocate_4x8``
# preset (0.9) is for direct-sampling (trainside) recipes that have only
# one actor type per bundle.
defaults:
  - default
  - _self_

num_rollout_nodes: 4
num_rollout_gpus_per_node: 8
num_rollout_gpus_per_actor: 1
num_train_nodes: 4
num_train_gpus_per_node: 8
num_train_gpus_per_actor: 1
colocate: true
colocate_gpu_fraction: 0.5
strategy: PACK
allow_noset_multi_gpu_inference: true
