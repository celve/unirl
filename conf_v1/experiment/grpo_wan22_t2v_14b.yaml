# @package _global_
# GRPO WAN 2.2 T2V 14B recipe — Policy stack, trainside (direct-sampling).
#
# Wan2.2-T2V uses two ``WanTransformer3DModel`` instances:
#   - transformer / ``high_noise``:  sigma >= boundary_ratio (coarse structure)
#   - transformer_2 / ``low_noise``: sigma <  boundary_ratio (detail refinement)
#
# Both transformers live under :class:`WanDualTransformer` composite. FSDP2
# wraps each ``WanTransformerBlock`` independently (recurses into both
# sub-transformers). peft's LoRA injection walks ``named_modules()`` so the
# ``target_modules`` suffixes hit BOTH branches — verify on first GPU smoke
# that ``requires_grad`` parameters list contains both ``high_noise.*`` and
# ``low_noise.*`` LoRA params (see
# ``WAN22DiffusionStage.trainable_module()`` docstring).
#
# Launch via:
#   python -m diffusionrl.train +experiment=grpo_wan22_t2v_14b
defaults:
  - /training/lora@training.lora: rank64
  - /training/fsdp@training.fsdp: bf16_full_ac
  - /training/optimizer@training.optimizer: adam_3e-4
  - /training/lr_scheduler@training.lr_scheduler: constant_1k
  - override /algorithm: grpo
  - override /model: wan22
  - override /rollout/engine: trainside
  - override /sampling/sde_strategy: flow
  - override /reward: video_pickscore
  - override /training/execution: standard
  - _self_
run:
  seed: 42
  num_rollouts: 1000
  data_source_dotpath: diffusionrl.data.data_source.MultimodalRLDataSource
  data_path: ${oc.env:DATA_PATH}
  eval_data_path: ${oc.env:EVAL_DATA_PATH,${oc.env:DATA_PATH}}

sampling:
  samples_per_prompt: 16
  num_inference_steps: 20
  guidance_scale: 1.0
  # WAN22 dual-stage CFG: ``guidance_scale_2`` defaults to None → low_noise
  # branch reuses guidance_scale. Set explicitly per recipe if the two
  # stages should diverge.
  # guidance_scale_2: 1.0
  height: 480
  width: 640
  num_frames: 1
  seed: 42
  init_same_noise: false
  eta: 0.7

algorithm:
  prompts_per_rollout: 48
  adv_normalization_scope: group
  use_global_std: true
  kl_coef: 0.0
  scheduler:
    timestep_fraction: [0.0, 0.2]
  algorithms:
    video:
      name: diffusion_grpo
      stage_attr: diffusion
      clip_range: 1.0e-4
      clip_schedule: constant
      # WAN22 reuses WAN21Conditions (no extra slots; guidance_scale_2 is
      # request-shape, lives on WAN22DiffusionParams).
      conditions_cls: diffusionrl.models.wan21.conditions.WAN21Conditions
# ----------------------------------------------------------------------
# Training surface
# ----------------------------------------------------------------------
placement:
  num_rollout_nodes: 0
  num_rollout_gpus_per_node: 0

rollout:
  engine: {}
  plan:
    forward_batch_size: 1

training:
  materialize:
    with_aux: []
  plan:
    micro_batch_size: 1
    num_updates_per_batch: 2
    local_mini_batch_size: 48
    local_batch_size: 96
    global_batch_size: 768
  topology:
    actor_count: 8

model:
  pretrained_model_ckpt_path: ${oc.env:PRETRAINED_MODEL,Wan-AI/Wan2.2-T2V-A14B-Diffusers}
  model_precision: bf16
  autocast_precision: bf16
  trajectory_precision: fp16
  logprob_precision: fp32
  shift: 5.0
  max_sequence_length: 512
  boundary_ratio: 0.875
  num_train_timesteps: 1000

logging:
  logging_steps: 1
  log_media: true
  media_max_items: 8
  report_to_wandb: true
  project_name: diffusionrl-grpo-t2v-newstack
  run_name: grpo_wan22_t2v
  tags: [wan22, t2v, grpo, video, pickscore, dual-transformer]

evaluation:
  eval_steps: 60

resume:
  save_steps: 60
