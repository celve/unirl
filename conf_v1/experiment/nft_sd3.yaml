# @package _global_
# DiffusionNFT SD3 recipe — Policy stack, trainside (direct-sampling).
#
# Forward-process diffusion RL with dual-adapter EMA reference. Replaces
# the OLD ``conf/experiment/nft_sd3.yaml`` (deleted in commit 0f2bb2c3
# "refactor: delete OLD recipes"); recovered baseline values via
# ``git show 0f2bb2c3~1:conf/experiment/nft_sd3.yaml`` then adapted to
# the schema:
#   - ``override /algorithm: nft`` selects ``NFTRolloutControl`` (driver-side)
#   - ``override /model: sd3`` selects the SD3 pipeline
#   - ``override /rollout/engine: trainside`` keeps the OLD direct-sampling
#     semantics (train actors also sample; no separate rollout actor; no
#     ``cfg.sync`` block per validate_weight_sync_contract)
#   - ``algorithm.scheduler.num_sde_steps: 0`` — KEY: forward-process path.
#     Rollout engine sees ``sde_indices=None`` and runs Euler ODE only;
#     trajectory stores clean final latents (see
#     ``rollout/pipeline.py:725-746``).
#   - ``algorithms.image._target_: DiffusionNFT`` — stage-driven loss class
#     (forward-diffusion + dual blend + x0 reconstruction). Production
#     defaults (beta=1.0, adv_mode=raw, use_adaptive_weight=true,
#     train_timestep_mode=all, training_timestep_fraction=0.99) inlined
#     as flat kwargs.
#   - ``training.policies[0]`` is :class:`NFTLoRAPolicy` (replaces the
#     plain LoRAPolicy used by GRPO). It owns the dual-adapter
#     ("default" + "old") install + EMA update at the rollout boundary.
#
# Children:
#   - ``nft_sd3_reward_service.yaml`` — remote reward service variant
#   - ``nft_sd3_sglang.yaml`` — SGLang separate-mode variant (overrides
#     ``rollout/engine`` to ``sglang`` + adds ``sync: nccl_broadcast``)
#
# Launch via:
#   python -m diffusionrl.train +experiment=nft_sd3

defaults:
  - /training/fsdp@training.fsdp: bf16_full_ac
  - /training/optimizer@training.optimizer: adam_3e-4_wd1e-4
  - /training/lr_scheduler@training.lr_scheduler: constant_10k
  - override /algorithm: nft
  - override /model: sd3_bf16
  - override /rollout/engine: trainside
  - override /sampling/sde_strategy: flow
  - override /reward: pickscore
  - override /training/execution: standard
  - _self_
run:
  seed: 42
  data_source_dotpath: diffusionrl.data.data_source.MultimodalRLDataSource
  num_rollouts: 10000
  data_path: ${oc.env:DATA_PATH,/root/diffusionrl/data/datasets/pickscore/train.txt}
  eval_data_path: ${oc.env:EVAL_DATA_PATH,/root/diffusionrl/data/datasets/pickscore/test.txt}

sampling:
  samples_per_prompt: 16
  num_inference_steps: 10
  guidance_scale: 1.0
  height: 512
  width: 512
  init_same_noise: false
  eta: 0.0

algorithm:
  # Driver-side singular: ``NFTRolloutControl``. Schema-shape compatible
  # with ``GRPORolloutControlConfig``; the two recipes are interchangeable
  # at this layer (``override /algorithm: nft`` flips the registered target).
  prompts_per_rollout: 48
  adv_normalization_scope: group
  use_global_std: true
  # KL math deferred to Phase 2 (kl_coef > 0 fails fast in DiffusionNFT).
  kl_coef: 0.0
  scheduler:
    # KEY: ``num_sde_steps: 0`` triggers the forward-process rollout path.
    # ``AllSDEScheduler`` returns an empty SDE index set; rollout engine
    # captures dense latents but no per-step log_prob.
    timestep_fraction: [0.0, 1.0]
    num_sde_steps: 0
  algorithms:
    # Slot key = rollout response track key (SD3 emits resp.tracks["image"]).
    # ``stage_attr: diffusion`` overrides the default pipeline-attribute
    # lookup (SD3Pipeline exposes ``self.diffusion``, not ``self.image``).
    # TrainActor injects ``nft_lora_policy=<NFTLoRAPolicy in chain>`` at
    # instantiate time so the algorithm can call
    # ``policy.with_old_adapter()`` for the reference forward.
    diffusion:
      name: diffusion_nft
      stage_attr: diffusion
      conditions_cls: diffusionrl.models.sd3.conditions.SD3Conditions
      # Production defaults from OLD nft_sd3.yaml ema + algorithm blocks.
      # NEW collapses OLD's separate timestep_mode/shuffle/fraction into
      # the three flat fields below; advanced modes (adv_mode != raw, etc.)
      # fail fast in DiffusionNFT.__init__.
      beta: 1.0
      adv_clip_max: 5.0
      adv_mode: raw
      use_adaptive_weight: true
      train_timestep_mode: all
      shuffle_train_timesteps: true
      apply_time_shift_in_loss: false
      training_timestep_fraction: 0.99
      kl_coef: 0.0
placement:
  # Direct-sampling: train actors sample on their own GPUs; no separate
  # rollout actor pool. Matches OLD NFT layout (FSDP direct-sampling).
  num_rollout_nodes: 0
  num_rollout_gpus_per_node: 0
  num_train_nodes: 1
  num_train_gpus_per_node: 8
  num_train_gpus_per_actor: 1
  colocate: false
  strategy: PACK
  allow_noset_multi_gpu_inference: true

rollout:
  # ``trainside`` is a no-op placeholder at the engine layer (the train
  # actor's own Pipeline runs sampling). Empty engine block is sufficient.
  engine: {}
  plan:
    # Forward-batch size during direct-sampling on each train actor.
    # 512²/10-step SD3.5 sampling on an H20 96GB safely accommodates 32.
    forward_batch_size: ${oc.decode:${oc.env:FBS,32}}

training:
  ema_lora:
    rank: 32
    alpha: 64
    dropout: 0.0
    bias: none
    task_type: FEATURE_EXTRACTION
    shadow_adapter: old
    ema_decay: 0.001
    ema_decay_type: warmup
    ema_flat_steps: 0
    ema_uprate: 0.001
    ema_uphold: 0.5
    timing: rollout_end
    target_modules:
      - attn.add_k_proj
      - attn.add_q_proj
      - attn.add_v_proj
      - attn.to_add_out
      - attn.to_k
      - attn.to_out.0
      - attn.to_q
      - attn.to_v
  materialize:
    with_aux: []
  plan:
    # 1 node × 8 GPUs = 8 train actors. global = prompts*samples = 768.
    # OLD nft_sd3 was anchored to 2 nodes × 8 GPUs = 16 actors; we scale
    # down to 1×8 for single-node smoke ease. Sglang child re-tunes for
    # 2-node setup. local_batch = global / actors = 96.
    micro_batch_size: 8
    num_updates_per_batch: 1
    local_mini_batch_size: 96
    local_batch_size: 96
    global_batch_size: 768
  topology:
    actor_count: 8

logging:
  logging_steps: 1
  log_media: true
  media_max_items: 48
  report_to_wandb: true
  project_name: diffusionrl-diffusionNFT
  run_name: nft_sd3
  tags: [sd3.5, nft, pickscore, trainside]

evaluation:
  eval_steps: 0
