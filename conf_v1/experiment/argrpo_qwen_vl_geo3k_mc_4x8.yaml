# @package _global_
# ARGRPO Qwen2.5-VL on Geometry3K MC — 4 nodes x 8 GPUs (32 GPUs).
# INHERITS from argrpo_qwen_vl_geo3k.yaml (132 lines). Only overrides below.
#
# Base already provides: model (QwenVLPipeline, bf16), rollout (trainside),
#   training.tracks.ar (optimizer lr=5e-6, LoRA), mc_exact_match reward,
#   evaluation (eval_steps=50), execution (max_grad_norm=1.0).
defaults:
  - argrpo_qwen_vl_geo3k
  - _self_

# ---- Changes for geo3k_mc + 4x8 scale-up ----

run:
  data_path: ${oc.env:DATA_PATH,/root/sync/datasets/geo3k_mc/train.jsonl}
  eval_data_path: ${oc.env:EVAL_DATA_PATH,/root/sync/datasets/geo3k_mc/val.jsonl}

placement:
  num_rollout_nodes: 4
  num_rollout_gpus_per_node: 8
  num_train_nodes: 4
  num_train_gpus_per_node: 8

algorithm:
  prompts_per_rollout: 32       # 2x base (16) to fill 4x actors
  samples_per_prompt: 16        # 2x base (8)
  adv_normalization_scope: global

rollout:
  plan:
    forward_batch_size: 16

training:
  plan:
    global_batch_size: 512      # 16 * 32 actors
    local_batch_size: 16        # same as base
    local_mini_batch_size: 16   # same as base (16/1)
    num_updates_per_batch: 1    # same as base
    micro_batch_size: 16
  topology:
    actor_count: 32

logging:
  report_to_wandb: true
  project_name: ${oc.env:WANDB_PROJECT,diffusionrl-flowgrpo-newstac}
  run_name: ${oc.env:WANDB_RUN_NAME,argrpo_qwen_vl_geo3k_mc_4x8}
  entity: ${oc.env:WANDB_ENTITY,diffusionrl-reproduce}

resume:
  output_dir: ${oc.env:OUTPUT_DIR,outputs/argrpo_qwen_vl_geo3k_mc_4x8}
