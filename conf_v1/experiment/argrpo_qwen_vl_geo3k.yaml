# @package _global_
# ARGRPO Qwen2.5-VL on Geometry3K — VLM RL for geometry QA.
#
# AR-only pipeline: QwenVLPipeline reads primitives["text"] + primitives["image"],
# generates text via QwenVLARStage, trains via ARGRPO.
# MCExactMatchRewardScorer compares generated letter to ground truth.
#
# Trainside engine (no separate rollout actors). ViT frozen, LLM trained
# with LoRA.
#
# Launch:
#   QWEN_VL_PATH=/path/to/Qwen2.5-VL-7B-Instruct \
#   DATA_PATH=/path/to/geo3k/train.jsonl \
#   python -m diffusionrl.train +experiment=argrpo_qwen_vl_geo3k
defaults:
  - override /algorithm: grpo
  - override /model: qwen_vl
  - override /rollout/engine: trainside
  - _self_

run:
  seed: 42
  num_rollouts: 2000
  data_source_dotpath: diffusionrl.data.data_source.MultimodalRLDataSource
  data_path: ${oc.env:DATA_PATH,/mnt/data/geo3k/train.jsonl}
  eval_data_path: ${oc.env:EVAL_DATA_PATH,/mnt/data/geo3k/val.jsonl}

sampling:
  samples_per_prompt: 8
  seed: 42

algorithm:
  prompts_per_rollout: 16
  adv_normalization_scope: group
  use_global_std: true
  kl_coef: 0.0
  scheduler:
    num_sde_steps: 0
  algorithms:
    ar:
      name: ar_grpo
      stage_attr: ar
      conditions_cls: diffusionrl.models.qwen_vl.conditions.QwenVLARConditions
      clip_range: 1.0e-4
      clip_schedule: constant

model:
  pretrained_model_ckpt_path: ${oc.env:QWEN_VL_PATH,Qwen/Qwen2.5-VL-7B-Instruct}
  model_precision: bf16
  autocast_precision: bf16
  logprob_precision: fp32
  freeze_vision_tower: true
  use_gradient_checkpointing: true
  max_prompt_length: 2048

rollout:
  engine: {}
  plan:
    forward_batch_size: 1

placement:
  num_rollout_nodes: 1
  num_rollout_gpus_per_node: 8
  num_rollout_gpus_per_actor: 1
  num_train_nodes: 1
  num_train_gpus_per_node: 8
  num_train_gpus_per_actor: 1
  colocate: true
  colocate_gpu_fraction: 0.9
  strategy: PACK

training:
  tracks:
    ar:
      model:
        _target_: diffusionrl.models.qwen_vl.QwenVLPipeline.from_config
        pretrained_model_ckpt_path: ${model.pretrained_model_ckpt_path}
        model_precision: bf16
        autocast_precision: bf16
        logprob_precision: fp32
        freeze_vision_tower: true
        use_gradient_checkpointing: true
        max_prompt_length: 2048
      source_stage_attr: ar
      optimizer:
        learning_rate: 5.0e-6
        adam_beta1: 0.9
        adam_beta2: 0.999
        adam_epsilon: 1.0e-8
        weight_decay: 0.0
      lr_scheduler:
        type: constant
        warmup_steps: 0
        total_steps: 2000
  materialize:
    with_aux: []
  plan:
    micro_batch_size: 1
    num_updates_per_batch: 1
    local_mini_batch_size: 16
    local_batch_size: 16
    global_batch_size: 128
  topology:
    actor_count: 8
  execution:
    max_grad_norm: 1.0
    offload_train: false
    offload_rollout: false

reward:
  aggregation_method: mean
  base_device: cpu
  components:
    mc_exact_match:
      weight: 1.0

logging:
  logging_steps: 1
  log_media: false
  report_to_wandb: ${oc.decode:${oc.env:REPORT_TO_WANDB,true}}
  project_name: diffusionrl-vlm-geo3k
  run_name: ${oc.env:WANDB_RUN_NAME,argrpo_qwen_vl_geo3k}
  tags: [qwen-vl, vlm, grpo, geo3k, geometry]

resume:
  output_dir: ${oc.env:OUTPUT_DIR,outputs/argrpo_qwen_vl_geo3k}

evaluation:
  eval_steps: 50
