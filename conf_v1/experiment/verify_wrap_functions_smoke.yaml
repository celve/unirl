# @package _global_
# Smoke test for the wrap-functions refactor (LIN-272).
#
# Minimal trainside (direct-sampling) config in tracks format.
# Exercises: inject_lora → fsdp_wrap → apply_deferred_ops → train loop.
#
#   global_batch = 4 * 4 = 16
#   local_batch  = 16 / 8 = 2
#   micro_batch  = 2
#
# Launch:
#   EXPERIMENT=verify_wrap_functions_smoke bash scripts/run_experiment_single_node.sh
defaults:
  - /training/track@training.tracks.image: default
  - /model@training.tracks.image.model: sd3
  - override /placement: colocate_1x8
  - override /algorithm: grpo
  - override /model: sd3
  - override /rollout/engine: trainside
  - override /sampling/sde_strategy: flow
  - override /sampling: sd3_512
  - override /training/execution: standard
  - _self_
run:
  seed: 42
  num_rollouts: 10
  data_source_dotpath: diffusionrl.data.data_source.MultimodalRLDataSource
  data_path: ${oc.env:DATA_PATH,/mnt/gz/data/datasets/pickscore/train.txt}
  eval_data_path: ${oc.env:EVAL_DATA_PATH,/mnt/gz/data/datasets/pickscore/test.txt}

sampling:
  samples_per_prompt: 4

algorithm:
  prompts_per_rollout: 4
  adv_normalization_scope: group
  use_global_std: true
  kl_coef: 0.0
  scheduler:
    timestep_fraction: [0.0, 0.5]
    num_sde_steps: 3
  algorithms:
    image:
      _target_: diffusionrl.algorithms.grpo.DiffusionGRPO
      stage_attr: diffusion
      clip_range: 1.0e-4
      clip_schedule: constant
      conditions_cls: diffusionrl.models.sd3.conditions.SD3Conditions
model:
  pretrained_model_ckpt_path: ${oc.env:PRETRAINED_MODEL,/root/diffusionrl/models/local/stable-diffusion-3.5-medium}
  model_precision: bf16
  shift: 3.0

rollout:
  engine: {}
  plan:
    forward_batch_size: 4

training:
  primary_track: image
  materialize:
    with_aux: [vae, text_encoder, text_encoder_2, text_encoder_3]
  plan:
    micro_batch_size: 2
    num_updates_per_batch: 1
    local_mini_batch_size: 2
    local_batch_size: 2
    global_batch_size: 16
  topology:
    actor_count: 8
  tracks:
    image:
      model:
        pretrained_model_ckpt_path: ${oc.env:PRETRAINED_MODEL,/root/diffusionrl/models/local/stable-diffusion-3.5-medium}
        model_precision: bf16
        autocast_precision: bf16
        trajectory_precision: bf16
        logprob_precision: fp32
        shift: 3.0
      source_stage_attr: diffusion
      lora:
        rank: 16
        alpha: 32
        dropout: 0.0
        target_modules:
          - attn.add_k_proj
          - attn.add_q_proj
          - attn.add_v_proj
          - attn.to_add_out
          - attn.to_k
          - attn.to_out.0
          - attn.to_q
          - attn.to_v
        bias: none
        task_type: FEATURE_EXTRACTION
      fsdp:
        cpu_offload: false
        param_dtype: bf16
        mixed_precision: true
        fsdp_mode: full
        reshard_after_forward: true
        activation_checkpointing: true
      optimizer:
        learning_rate: 3.0e-4
        adam_beta1: 0.9
        adam_beta2: 0.999
        adam_epsilon: 1.0e-8
        weight_decay: 0.0
      lr_scheduler:
        type: constant
        warmup_steps: 0
        total_steps: 100

reward:
  aggregation_method: mean
  base_device: cuda
  components:
    pickscore:
      weight: 1.0
      batch_size: 4

logging:
  logging_steps: 1
  log_media: false
  report_to_wandb: ${oc.env:REPORT_TO_WANDB,false}
  project_name: diffusionrl-verify-wrap-functions
  entity: ${oc.env:WANDB_ENTITY,linyuwus}

evaluation:
  eval_steps: 0
