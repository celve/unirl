# @package _global_
# FLUX.2-klein-9B GRPO smoke recipe — direct-sampling on the NEW Policy
# stack.
#
# Tiny workload (2 prompts × 2 samples = 4 samples / rollout, 2 rollouts)
# so the full code path (Bundle load → text-encode → Klein SDE loop →
# VAE decode → reward → GRPO replay + KL anchor → FSDP/LoRA update)
# can be exercised end-to-end on a single H20-class GPU. This is the
# diff-tile cousin of ``smoke_direct_sampling_sd3.yaml`` adapted for
# Klein.
#
# Klein-specific divergences from the SD3 / Qwen smoke recipes:
#
# - ``model: flux2_klein_v2`` — typed pipeline registered in
#   ``diffusionrl.models.flux2_klein.__init__``.
# - ``sde_strategy: dance`` — Klein's empirical-μ schedule + DanceSDE is
#   what the legacy ``train_grpo_flux2_klein9b_sglang_multinode.sh``
#   ships, and what ``Flux2KleinSchedulePolicy.compute_sigma`` returns.
# - ``algorithms.image`` uses the shared ``DiffusionGRPO`` (same as SD3 /
#   Qwen); Klein adds no algorithm of its own. ``kl_coef=0`` — the KL
#   anchor from the legacy recipe is intentionally dropped (no other
#   model uses it and base GRPO does not implement it).
# - ``training.policies`` LoRA targets are Klein-specific (fused
#   ``qkv_proj`` / ``ff_proj`` projections present in
#   :class:`Flux2Transformer2DModel`).
# - ``materialize.with_aux: [vae, text_encoder]`` — Klein has a single
#   Qwen3 text encoder, not the SD3 triple.
#
# Run via diffusionrl/train_new.py:
#
#   python -m diffusionrl.train +experiment=grpo_flux2_klein9b_trainside_smoke
defaults:
  - /training/lora@training.lora: klein_rank16
  - /training/fsdp@training.fsdp: fp32_full_ac
  - override /algorithm: grpo
  - override /model: flux2_klein_bf16
  - override /rollout/engine: trainside
  - override /sampling/sde_strategy: dance
  - _self_
run:
  seed: 42
  num_rollouts: 2
  data_source_dotpath: diffusionrl.data.data_source.MultimodalRLDataSource
  # Override via env if the pickscore dataset lives elsewhere on the cluster
  # (the path here is the canonical CephFS location used by the legacy
  # main_flux_bundle scripts).
  data_path: ${oc.env:PICKSCORE_DATA_PATH,/apdcephfs_zwfy8/share_305110755/hunyuan/rzhu/DiffusionRL/data/datasets/pickscore/train.txt}
  eval_data_path: ${oc.env:PICKSCORE_EVAL_DATA_PATH,/apdcephfs_zwfy8/share_305110755/hunyuan/rzhu/DiffusionRL/data/datasets/pickscore/test.txt}

sampling:
  samples_per_prompt: 2
  num_inference_steps: 8
  guidance_scale: 1.0
  height: 256
  width: 256
  seed: 42
  init_same_noise: true
  eta: 0.3

algorithm:
  prompts_per_rollout: 2
  adv_normalization_scope: group
  use_global_std: false
  kl_coef: 0.0
  scheduler:
    timestep_fraction: [0.2, 0.8]
    num_sde_steps: 2
  algorithms:
    # Slot ``image`` matches RolloutResp.tracks["image"] emitted
    # by Flux2KleinPipeline.generate. ``stage_attr: diffusion`` matches
    # the Pipeline's attribute name. ``conditions_cls`` reconstructs the
    # typed ``Flux2KleinConditions`` from the generic Conditions dict
    # carried on the response, so the replay path sees the same
    # ``text`` / ``negative_text`` shape as the rollout path saw.
    image:
      _target_: diffusionrl.algorithms.grpo.DiffusionGRPO
      stage_attr: diffusion
      clip_range: 5.0e-3
      clip_schedule: constant
      conditions_cls: diffusionrl.models.flux2_klein.conditions.Flux2KleinConditions
rollout:
  engine: {}
  plan:
    forward_batch_size: 2

placement:
  num_rollout_nodes: 1
  num_rollout_gpus_per_node: 1
  num_rollout_gpus_per_actor: 1
  num_train_nodes: 1
  num_train_gpus_per_node: 1
  num_train_gpus_per_actor: 1
  colocate: true
  colocate_gpu_fraction: 0.9
  strategy: PACK

# ----------------------------------------------------------------------
# New-stack training surface — Klein-specific GRPO algorithm subclass +
# Klein-specific LoRA targets + single Qwen3 text encoder.
# ----------------------------------------------------------------------

training:
  ema:
    decay: 0.99
    update_step_interval: 2
  materialize:
    with_aux: [vae, text_encoder]
  plan:
    micro_batch_size: 1
    num_updates_per_batch: 1
    local_mini_batch_size: 4
    local_batch_size: 4
    global_batch_size: 4
  topology:
    actor_count: 1
  optimizer:
    learning_rate: 5.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_epsilon: 1.0e-8
    weight_decay: 0.0
  lr_scheduler:
    type: constant
    warmup_steps: 0
    total_steps: 2
  execution:
    max_grad_norm: 1.0
    offload_train: false
    offload_rollout: false

reward:
  aggregation_method: mean
  base_device: cuda
  components:
    pickscore:
      weight: 1.0
      batch_size: 2

logging:
  logging_steps: 1
  log_media: false
  media_max_items: 4
  report_to_wandb: false
  project_name: diffusionrl-flowgrpo-klein-smoke

evaluation:
  eval_steps: 0
