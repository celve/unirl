# @package _global_
# GRPO WAN 2.2 I2V 14B recipe — Policy stack, trainside (direct-sampling).
#
# I2V variant of grpo_wan22_t2v_14b.yaml. WAN 2.2 14B I2V checkpoints
# declare ``image_dim == 0`` (no CLIP vision tower) — image conditioning
# flows purely through the VAE-latent + mask payload (20-channel concat,
# transformer in_channels = 36). The dual-transformer routing in WAN 2.2
# is preserved unchanged; both high_noise and low_noise sub-transformers
# receive the channel-concat hidden state via ``WanDualTransformer``'s
# ``**kwargs`` passthrough.
#
# Scope: ``expand_timesteps=False`` path only (WAN 2.2 14B I2V). The
# WAN 2.2 5B I2V variant uses ``expand_timesteps=True`` with mask
# blending + per-token timestep — a different transformer kwargs shape
# entirely; deferred until a separate phase.
#
# Launch via:
#   python -m diffusionrl.train +experiment=grpo_wan22_i2v
defaults:
  - /training/lora@training.lora: rank64
  - /training/fsdp@training.fsdp: bf16_full_ac
  - /training/optimizer@training.optimizer: adam_3e-4
  - /training/lr_scheduler@training.lr_scheduler: constant_1k
  - override /algorithm: grpo
  - override /model: wan22
  - override /rollout/engine: trainside
  - override /sampling/sde_strategy: flow
  - override /reward: video_pickscore
  - override /training/execution: standard
  - _self_
run:
  seed: 42
  num_rollouts: 1000
  data_source_dotpath: diffusionrl.data.data_source.MultimodalRLDataSource
  data_path: ${oc.env:DATA_PATH}
  eval_data_path: ${oc.env:EVAL_DATA_PATH,${oc.env:DATA_PATH}}

sampling:
  samples_per_prompt: 16
  # I2V on WAN 2.2 14B: fewer denoising steps keep smoke iteration tight.
  num_inference_steps: 10
  guidance_scale: 1.0
  # WAN22 dual-stage CFG: ``guidance_scale_2`` defaults to None → low_noise
  # branch reuses guidance_scale. Set explicitly per recipe if the two
  # stages should diverge.
  # guidance_scale_2: 1.0
  height: 480
  width: 640
  # num_frames=9 → 3 latent frames; sufficient temporal axis for I2V smoke.
  num_frames: 9
  seed: 42
  init_same_noise: false
  eta: 0.7

algorithm:
  prompts_per_rollout: 48
  adv_normalization_scope: group
  use_global_std: true
  kl_coef: 0.0
  scheduler:
    timestep_fraction: [0.0, 0.2]
  algorithms:
    video:
      name: diffusion_grpo
      stage_attr: diffusion
      clip_range: 1.0e-4
      clip_schedule: constant
      conditions_cls: diffusionrl.models.wan21.conditions.WAN21Conditions
# ----------------------------------------------------------------------
# Training surface
# ----------------------------------------------------------------------
placement:
  num_rollout_nodes: 0
  num_rollout_gpus_per_node: 0

rollout:
  engine: {}
  plan:
    forward_batch_size: 1

training:
  materialize:
    with_aux: []
  plan:
    micro_batch_size: 1
    num_updates_per_batch: 2
    local_mini_batch_size: 48
    local_batch_size: 96
    global_batch_size: 768
  topology:
    actor_count: 8

model:
  # WAN 2.2 14B I2V (``expand_timesteps=False`` path).
  pretrained_model_ckpt_path: ${oc.env:PRETRAINED_MODEL,Wan-AI/Wan2.2-I2V-A14B-Diffusers}
  model_precision: bf16
  autocast_precision: bf16
  trajectory_precision: fp16
  logprob_precision: fp32
  shift: 5.0
  max_sequence_length: 512
  # WAN 2.2 dual-transformer boundary. Default ``0.875`` mirrors the
  # default on :class:`WAN22PipelineConfig`; set explicitly here so the
  # recipe is self-documenting.
  boundary_ratio: 0.875
  num_train_timesteps: 1000

logging:
  logging_steps: 1
  log_media: true
  media_max_items: 8
  report_to_wandb: true
  project_name: diffusionrl-grpo-i2v-newstack
  run_name: grpo_wan22_i2v
  tags: [wan22, i2v, grpo, video, pickscore, dual-transformer]

evaluation:
  eval_steps: 60

resume:
  save_steps: 60
